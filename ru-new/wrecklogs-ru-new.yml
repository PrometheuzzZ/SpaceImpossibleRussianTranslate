wreck-log-gen7-body: "[Последняя запись] Ненавижу возить пассажиров. Взяли эту подработку из-за хорошей оплаты, но не догадались, что это заключённые, пока не начали их грузить. Только бы не устроили проблем."
wreck-log-gen7-more1: "[i]Записей больше нет. Груда обломков, из которой был извлечён этот бортжурнал, судя по всему, — всё, что осталось от {shipname}.[/i]"

#General 8
