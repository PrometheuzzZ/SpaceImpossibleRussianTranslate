wreck-log-gen8-body: "[Последняя запись] Новый член экипажа уже неделю мутит воду. Всё поднимает вопрос оплаты — я раз за разом говорю ему: разбирайся с руководством, не со мной. Лучше бы не устраивал проблем — до ближайшей гауптвахты очень далеко."
wreck-log-gen8-more1: "[i]Записей больше нет. Груда обломков, из которой был извлечён этот бортжурнал, судя по всему, — всё, что осталось от {shipname}.[/i]"

#General 9
