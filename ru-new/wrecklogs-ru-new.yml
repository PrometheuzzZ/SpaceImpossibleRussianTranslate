wreck-log-gen9-body: "[Последняя запись] Не могу поверить, что взял это командование. Оказывается, инженерная команда — Кал'Гири. Знай я заранее — никогда бы не взял своих людей на борт. В кают-компании уже несколько драк, и, похоже, становится только хуже."
wreck-log-gen9-more1: "[i]Записей больше нет. Груда обломков, из которой был извлечён этот бортжурнал, судя по всему, — всё, что осталось от {shipname}.[/i]"

