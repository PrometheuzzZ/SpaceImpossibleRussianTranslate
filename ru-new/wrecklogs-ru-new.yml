wreck-log-gen14-body: "[Последняя запись] Уже 20 дней мы застряли в этой гравитационной аномалии. Топливо и еда на исходе, опаздываем на 12 дней. Остаётся надеяться, что нас отправят искать до того, как через три дня кончится кислород. Зачем я полез проверять это эхо на сенсорах? Даже если выберемся — не забуду этого никогда."
wreck-log-gen14-more1: "[i]Записей больше нет. Груда обломков, из которой был извлечён этот бортжурнал, судя по всему, — всё, что осталось от {shipname}.[/i]"

