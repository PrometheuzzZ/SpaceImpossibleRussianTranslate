#Pirate Treasure 1
wreck-log-treasure1-header: "Журнал капитана {captname}"
wreck-log-treasure1-body: "Хаха! Все говорили, что ничего не выйдет. А вот же оно — передо мной. Деньги, отданные тому торговцу-Кал'Гири за координаты, явно стоили того. Разведал местность — всё выглядит отлично. Теперь нужно вернуться на базу, взять грузовой контейнер и возвратиться. Немного не в тему: реактор выдаёт скачки мощности с последней стоянки, но думаю, выдержит. Займусь техобслуживанием после."
