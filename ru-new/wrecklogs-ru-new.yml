wreck-log-gen5-body: "[Последняя запись] ...эхо на сенсорах, которое мы наблюдаем последний час, оказалось каким-то объектом длиной около 2 метров. Поднимем его на борт и посмотрим, что это такое. Возможно, представляет ценность для сальважа."
wreck-log-gen5-more1: "[i]Записей больше нет. Груда обломков, из которой был извлечён этот бортжурнал, судя по всему, — всё, что осталось от {shipname}.[/i]"

#General 6
wreck-log-gen6-header: "Журнал капитана {captname}"
wreck-log-gen6-body: "[Последняя запись] Сигнал бедствия оказался спасательной капсулой с {shipname2}. Скоро состыкуемся и заберём выживших на борт. Я приказал первому офицеру встретить гостей вооружённым — на всякий случай. Уверен, всё будет нормально, но нутром чую тревогу всякий раз, когда что-то подобное случается."
wreck-log-gen6-more1: "[i]Записей больше нет. Груда обломков, из которой был извлечён этот бортжурнал, судя по всему, — всё, что осталось от {shipname}.[/i]"

