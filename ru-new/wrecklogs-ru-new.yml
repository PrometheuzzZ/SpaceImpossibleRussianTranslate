wreck-log-gen13-body: "[Последняя запись] Я говорил {crewname} РАЗ за РАЗОМ: НЕ ПОКУПАТЬ запчасти у азорийских перекупщиков. Теперь грозит полный отказ реактора — поле подавления скачет из-за бракованного клапана сброса. Попробуем работать на пяти реакторах при половинной мощности. Может, до порта доберёмся."
wreck-log-gen13-more1: "[i]Записей больше нет. Груда обломков, из которой был извлечён этот бортжурнал, судя по всему, — всё, что осталось от {shipname}.[/i]"

