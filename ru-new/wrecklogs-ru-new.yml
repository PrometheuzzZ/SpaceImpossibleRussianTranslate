wreck-log-gen11-body: "[Последняя запись] С глубокой скорбью фиксирую гибель инженера {engname}. Он осматривал плазменные коллекторы, когда вышел из строя предохранительный клапан, — ожоги по всему телу. Надеюсь, этот металлолом доберётся до дома без новых несчастий."
wreck-log-gen11-more1: "[i]Записей больше нет. Груда обломков, из которой был извлечён этот бортжурнал, судя по всему, — всё, что осталось от {shipname}.[/i]"

