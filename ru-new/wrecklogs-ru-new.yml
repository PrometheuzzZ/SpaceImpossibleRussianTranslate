#Wreck Logs
wreck-log-subheader: "Бортжурнал"
wreck-log-cont: "ПРОДОЛЖИТЬ"

#General 1
wreck-log-gen1-header: "Журнал капитана {captname}"
wreck-log-gen1-body: "[Последняя запись] Звёздная дата: 78795.33. Журнал капитана {captname}.\n Мы получили новые инструкции с базы. Они хотят, чтобы {shipname} отработал манёвры на высокой скорости с большими перегрузками. Я не в восторге, но запрос подтверждён — выполним. Штурман выпил двойную порцию кофе и говорит, что готов.\n\n Надеюсь, обойдётся."
wreck-log-gen1-more1: "[i]Записей больше нет. Груда обломков, из которой был извлечён этот бортжурнал, судя по всему, — всё, что осталось от {shipname}.[/i]"

#General 2
wreck-log-gen2-header: "Журнал капитана {captname}"
wreck-log-gen2-body: "[Последняя запись] Мы загрузили последнюю партию медикаментов. Пока всё идёт нормально, но мы вот-вот войдём в спорную территорию. Здесь никогда не знаешь, чего ожидать."
wreck-log-gen2-more1: "[i]Записей больше нет. Груда обломков, из которой был извлечён этот бортжурнал, судя по всему, — всё, что осталось от {shipname}.[/i]"

#General 3
wreck-log-gen3-header: "Журнал капитана {captname}"
wreck-log-gen3-body: "[Последняя запись] Клянусь, это последний раз, когда я соглашаюсь на VIP-сопровождение. Плевать, что она — дочь начальника моего начальника, мне уже хватит. Я приказал штурману идти на полной тяге, плевать на астероиды. Зато этого пассажира сдадим быстрее — и домой попадём тоже."
wreck-log-gen3-more1: "[i]Записей больше нет. Груда обломков, из которой был извлечён этот бортжурнал, судя по всему, — всё, что осталось от {shipname}.[/i]"

#General 4
wreck-log-gen4-header: "Журнал капитана {captname}"
wreck-log-gen4-body: "[Последняя запись] Мы три недели в пути от порта, и {randcrewname} стал последним погибшим. Мы вышли на связь с базой, но они не спешат с помощью — видимо, не верят, насколько мы больны. У меня развился кашель. Боюсь, скоро я не смогу исполнять обязанности. Да хранит нас Господь в этот тяжкий час."
wreck-log-gen4-more1: "[i]Записей больше нет. Груда обломков, из которой был извлечён этот бортжурнал, судя по всему, — всё, что осталось от {shipname}.[/i]"

