dialogue-ai-replies-spaced1: "Убирайся в космос! Скажи, куда слать соболезнования твоим вдовам."
dialogue-ai-replies-spaced2: "Убирайся в космос! Твой груз теперь мой!"
dialogue-ai-replies-spaced3: "Убирайся в космос! Ты умрёшь!"

dialogue-ai-replies-none: "<Не отвечать>"

dialogue-ai-replies-abort1: "Ой, моя ошибка. Неважно."
dialogue-ai-replies-abort2: "Неважно. Может, позже."

dialogue-ai-replies-trade1: "[b][00ff22]Ⱡ[/b][-]Покажи, что у тебя есть [aaaaaa][i][открыть торговлю][/i][-]"
dialogue-ai-replies-tradeunable1: "Ладно. Найду другого торговца."

dialogue-ai-replies-disc1: "Я ищу информацию об этой звёздной системе."

dialogue-ai-replies-ack1: "Подожди! Я уйду!"
dialogue-ai-replies-ack2: "Ладно, ладно. Держусь на расстоянии."
dialogue-ai-replies-ack3: "Понял. Я не причиню вреда."
dialogue-ai-replies-ack4: "Понял. Я и так собирался уходить."
dialogue-ai-replies-ack5: "Спасибо за тёплый приём."
dialogue-ai-replies-ack6: "Понял. Я просто пролетаю мимо."
dialogue-ai-replies-ack7: "Понял. Приём пять."
dialogue-ai-replies-ack8: "Взаимно. Приятно видеть друга."
dialogue-ai-replies-ack9: "Ненадолго, лазерный мозгляк. Теперь это моё место."

dialogue-ai-replies-help1: "Сделаю всё что смогу."
dialogue-ai-replies-help2: "Хорошо. С удовольствием устрою засаду."

dialogue-default-enter-firsttime-header: "ХЕРМАН"
dialogue-default-enter-firsttime-text: "ПРИВЕТ, КАПИТАН. Я ХЕРМАН. Последнее время мало новых лиц. Ходят слухи, что гиперврата в соседней системе больше не работают. Очень тревожно."
dialogue-default-enter-firsttime-replydef: "Это тревожно. Возможно, я туда загляну."
dialogue-default-enter-firsttime-replydef-resp: "Если понадоблюсь — вызывай снова ({key-hail})"
dialogue-default-enter-firsttime-reply1: "Какие гиперврата?"
dialogue-default-enter-firsttime-reply1-resp: "Ну, гиперврата: большие, чёрные с розовым, очень шумные. Говорят, они существуют дольше, чем человечество. Именно они делают возможной жизнь, какой мы её знаем."
dialogue-default-enter-firsttime-replyspaced-resp: Наверное, не стоит орать об этом здесь. На этот раз прощаю — видно, ты тут новичок"

dialogue-default-buyship-text: "Корабль продаётся за [b][77ccff]Ⱡ{shipcost}[-][/b]."
dialogue-default-buyship-opt-buy: "Купить корабль [Требуется: Ⱡ{shipcost}]"
dialogue-default-buyship-buy-fail: "Недостаточно денег"
dialogue-default-buyship-buy-suc: "Поздравляем с покупкой. Корабль теперь ваш!"

dialogue-default-trapmine-text: "Ха! Попался в нашу ловушку. Плати [b][00ccff]Ⱡ{bribecost}[-][/b] или пожалеешь"
dialogue-default-trapmine-reply-bribe: "Ладно, заплачу [Требуется: Ⱡ{bribecost}]"
dialogue-default-trapmine-reply-ignore: "Убирайся! Я не подчиняюсь пиратам"
dialogue-default-trapmine-ignored: "Игнорируешь нас?! Твой груз достанется нам без труда!"
dialogue-default-trapmine-reply-bribe-fail: "Дурак! Если не можешь заплатить — расплатишься по-другому!"
dialogue-default-trapmine-reply-bribe-suc: "Приятно вести дела. Мы отключили мины"


