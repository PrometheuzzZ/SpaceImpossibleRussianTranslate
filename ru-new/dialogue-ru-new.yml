dialogue-conflict-reply-shieldparts: "Помогу. Возьмите эти детали, чтобы снова двигаться. [Требуется: 1 x {item-base:item.part.shield}]"
dialogue-conflict-reply-attack1: "Как жаль. За тебя хорошо заплатят на рынках рабов *АТАКА*"
dialogue-conflict-reply-attack2: "Печально. Зато добить тебя будет проще *АТАКА*"
dialogue-conflict-reply-takepeople: "Я могу доставить вас на дружественную станцию."

dialogue-default-conflict-defendersdistress1: "Сработало! Капитан, не поверишь, но я победил! Отбился не вспотев. Вот только корабль сильно повреждён. Придётся его бросить. Доставишь меня до ближайшей станции?"
dialogue-default-conflict-defendersdistress-peoplespawn: "Я и мой экипаж рассчитываем на тебя! Не подведи."

dialogue-default-conflict-attackersdistress1: "Привет, Капитан. Мой корабль вышел из строя после недавней стычки. Можешь поделиться {item-base:item.part.reactor}, чтобы я снова мог двигаться?"
dialogue-default-conflict-attackersdistress2: "Ты как раз вовремя. После тяжёлого боя я победил, но мне срочно нужны {item-base:item.part.engine}, чтобы уйти в варп."
dialogue-default-conflict-attackersdistress3: "Привет, Капитан. Мой корабль вышел из строя после недавней стычки. Можешь поделиться {item-base:item.part.weapon}?"
dialogue-default-conflict-attackersdistress4: "Ты как раз вовремя. После тяжёлого боя я победил, но мне срочно нужны {item-base:item.part.shield}."
dialogue-default-conflict-attackersdistress-partthanks: "Спасибо за помощь."

dialogue-kalgiri-conflict-defendersdistress1: "Капитан. После яростного обмена ударами я вышел победителем. Но ценой. Мой корабль почти уничтожен. Можешь доставить меня на ближайшую станцию?"
dialogue-kalgiri-conflict-defendersdistress-peoplespawn: "Я и мой экипаж рассчитываем на тебя! Не подведи."

dialogue-kalgiri-conflict-attackersdistress1: "Капитан. Как недавно поваленное дерево, мой корабль перевёрнут. Но это дерево упало на лесоруба, раздавив атакующего. Можешь поделиться {item-base:item.part.reactor}, чтобы поднять этот ствол?"
dialogue-kalgiri-conflict-attackersdistress2: "Мощным ударом я победил врага. Но ценой велика — мой корабль возмездия повреждён и не может продолжать бой. Прошу {item-base:item.part.engine} в помощь."
dialogue-kalgiri-conflict-attackersdistress3: "Капитан. Как недавно поваленное дерево, мой корабль перевёрнут. Но это дерево упало на лесоруба, раздавив атакующего. Можешь поделиться {item-base:item.part.weapon}?"
dialogue-kalgiri-conflict-attackersdistress4: "Мощным ударом я победил врага. Но цена велика — мой корабль возмездия повреждён. Прошу {item-base:item.part.shield} в помощь."
dialogue-kalgiri-conflict-attackersdistress-partthanks: "Спасибо за помощь."

dialogue-ticeroy-conflict-defendersdistress1: "Флот Тисерой гордится чистыми и эффективными боевыми стратегиями. С большой гордостью подтверждаю уничтожение цели. Но ценой. Мой корабль тяжело повреждён — настолько, что подлежит затоплению. Прошу помочь эвакуировать экипаж."
dialogue-ticeroy-conflict-defendersdistress-peoplespawn: "Я и мой экипаж рассчитываем на тебя! Не подведи."

dialogue-ticeroy-conflict-attackersdistress1: "Вольно, Капитан. После недавней стычки мой корабль не может вернуться на базу. У вас есть {item-base:item.part.reactor}?"
dialogue-ticeroy-conflict-attackersdistress2: "Вольно, Капитан. После недавней стычки мой корабль не может вернуться на базу. У вас есть {item-base:item.part.engine}?"
dialogue-ticeroy-conflict-attackersdistress3: "Приветствую, Капитан. Как член флота Тисерой официально запрашиваю помощь в восстановлении боеспособности корабля. Уполномочен запросить у вас {item-base:item.part.weapon}."
dialogue-ticeroy-conflict-attackersdistress4: "Приветствую, Капитан. Как член флота Тисерой официально запрашиваю помощь в восстановлении боеспособности. Уполномочен запросить у вас {item-base:item.part.shield}."
dialogue-ticeroy-conflict-attackersdistress-partthanks: "Спасибо за помощь."

dialogue-sixiser-conflict-defendersdistress1: "Ха-ха! Моя жертва не имела шансов! Но, признаю, успела всадить пару хороших попаданий в мой корабль. Прямо скажу: мне нужна помощь. Забери меня и мой экипаж на станцию."
dialogue-sixiser-conflict-defendersdistress-peoplespawn: "Я и мой экипаж рассчитываем на тебя! Не подведи."

dialogue-sixiser-conflict-attackersdistress1: "Всё лучше, когда идёт хорошо, верно? Ну, Капитан, после жёсткой обороны мой корабль не может уйти в варп. Есть {item-base:item.part.reactor} для друга в беде?"
dialogue-sixiser-conflict-attackersdistress2: "Всё лучше, когда идёт хорошо, верно? Ну, Капитан, после жёсткой обороны мой корабль не может уйти в варп. Есть {item-base:item.part.engine} для друга в беде?"
dialogue-sixiser-conflict-attackersdistress3: "Рад встрече, Капитан. Недавно отправил нескольких плохишей в космос и оказался в затруднительном положении. Найдётся {item-base:item.part.weapon}, чтобы я снова мог двигаться?"
dialogue-sixiser-conflict-attackersdistress4: "Рад встрече, Капитан. Недавно отправил нескольких плохишей в космос и оказался в затруднительном положении. Найдётся {item-base:item.part.shield}?"
dialogue-sixiser-conflict-attackersdistress-partthanks: "Спасибо за помощь."

dialogue-drum-conflict-defendersdistress1: "НАЧАЛО ПЕРЕВОДА --[ Непоправимые повреждения. Корпус непригоден. Переправить органических операторов на родину? ]-- КОНЕЦ ПЕРЕВОДА"
dialogue-drum-conflict-defendersdistress-peoplespawn: "НАЧАЛО ПЕРЕВОДА --[ Надежда на помощь. Требуется доставка к месту назначения. ]-- КОНЕЦ ПЕРЕВОДА"

dialogue-drum-conflict-attackersdistress1: "НАЧАЛО ПЕРЕВОДА --[ Сломанный корабль сломан дважды. Много воспоминаний, руки подняты в победе. Славный обмен {item-base:item.part.reactor}, сопряжённая благодарность. ]-- КОНЕЦ ПЕРЕВОДА"
dialogue-drum-conflict-attackersdistress2: "НАЧАЛО ПЕРЕВОДА --[ Боевая работа завершена. Злоумышленники отброшены. Корабль сломан и опечален. Передать {item-base:item.part.engine} для починки? ]-- КОНЕЦ ПЕРЕВОДА"
dialogue-drum-conflict-attackersdistress3: "НАЧАЛО ПЕРЕВОДА --[ Сломанный корабль сломан дважды. Много воспоминаний, руки подняты в победе. Славный обмен {item-base:item.part.weapon}, сопряжённая благодарность. ]-- КОНЕЦ ПЕРЕВОДА"
dialogue-drum-conflict-attackersdistress4: "НАЧАЛО ПЕРЕВОДА --[ Боевая работа завершена. Злоумышленники отброшены. Корабль сломан и опечален. Передать {item-base:item.part.shield} для починки? ]-- КОНЕЦ ПЕРЕВОДА"
dialogue-drum-conflict-attackersdistress-partthanks: "НАЧАЛО ПЕРЕВОДА --[ Помощь принята с благодарностью. ]-- КОНЕЦ ПЕРЕВОДА"

dialogue-eu-conflict-defendersdistress1: "Привет, Капитан. После смертельной схватки мой корабль уцелел, но победителем вышел сломленным. Доставишь меня и экипаж на безопасную базу?"
dialogue-eu-conflict-defendersdistress-peoplespawn: "Я и мой экипаж рассчитываем на тебя! Не подведи."

dialogue-eu-conflict-attackersdistress1: "Привет, Капитан. Была стычка, и благодаря хорошей подготовке и умению я победил. Но корабль сильно потрепало. У тебя нет лишних {item-base:item.part.reactor}?"
dialogue-eu-conflict-attackersdistress2: "Привет, Капитан. Была стычка, и благодаря хорошей подготовке я победил. Но корабль сильно потрепало. У тебя нет лишних {item-base:item.part.engine}?"
dialogue-eu-conflict-attackersdistress3: "Добро пожаловать, Капитан. Ты опоздал. Битва окончена, но не без значительного ущерба. Мне нужно несколько {item-base:item.part.weapon}, чтобы восстановить боеспособность."
dialogue-eu-conflict-attackersdistress4: "Добро пожаловать, Капитан. Ты опоздал. Битва окончена, но не без значительного ущерба. Мне нужно несколько {item-base:item.part.shield}."
dialogue-eu-conflict-attackersdistress-partthanks: "Спасибо за помощь."

