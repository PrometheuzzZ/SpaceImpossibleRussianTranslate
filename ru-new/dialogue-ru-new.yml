dialogue-communique: "КОММЮНИКЕ"

dialogue-ticeroy-communique-header: "Военное коммюнике Тисерой"
dialogue-ticeroy-communique-text: "Согласно последним данным разведки, коммуникационная сеть ненадёжна. Требуется доставить этот доклад лично Верховному Лорду Тисерой. Координаты прилагаются. \n [eeeeee][i]Прилагается доклад о силах флота Тисерой и последних передвижениях[/i][-]"

dialogue-ticeroy-hail-boss-header: "Верховный Лорд Тисерой"
dialogue-ticeroy-hail-boss-neutral-text: "Приветствую, Капитан. Вы находитесь в сердце флота Тисерой. Если вы здесь не по делам флота — быстро пожалеете об этом."
dialogue-ticeroy-hail-boss-hated-text: "Вы и вам подобные хорошо известны здесь. Ваши разрушительные действия не будут терпеться в составе флота. Готовьтесь к встрече с создателем."

dialogue-eu-communique-header: "Исследовательское коммюнике Союза Исследователей"
dialogue-eu-communique-text: "Содержимое приложенного отчёта необходимо передать непосредственно главному учёному. Мы не можем отправить эти данные по стандартным каналам. Координаты прилагаются. \n [eeeeee][i]Прилагается отчёт о совершенно секретном научном открытии[/i][-]"

dialogue-eu-hail-boss-header: "Главный учёный Союза Исследователей"
dialogue-eu-hail-boss-neutral-text:  "Добро пожаловать. У вас есть данные для обмена? Или вы ищете что-то другое?"
dialogue-eu-hail-boss-hated-text: "Вы хорошо известны здесь как злодей. Мне нечего вам сказать."

dialogue-sixiser-communique-header: "Секретное коммюнике Сиксисер"
dialogue-sixiser-communique-text: "Следующей информации нельзя доверять никому. Доставить лично главарю Сиксисер. Координаты прилагаются. \n [eeeeee][i]Прилагается доклад о маршрутах наркоторговли Сиксисер[/i][-]"

dialogue-sixiser-hail-boss-header: "Капитан Бенозар, Главарь пиратов Сиксисер, Бич звёзд"
dialogue-sixiser-hail-boss-neutral-text:  "Эй, Капитан. Что привело тебя в эти края? Ищешь приключений или просто хочешь хорошо провести время?"
dialogue-sixiser-hail-boss-hated-text:  "Знаю тебя, Капитан. Ты приносишь только неудачи. Лучше убирайся, пока мы с ребятами не отправили тебя в открытый космос."


dialogue-arkwright-hail-boss-header: "Вальтер Аркрайт"
dialogue-arkwright-hail-boss-neutral-text: "Торговец номер один во вселенной к вашим услугам. Что вы ищете?"
dialogue-arkwright-hail-boss-hate-text: "Ты — плохой бизнес. Ты занесён в чёрный список. Убирайся."

dialogue-arkwright-hail-drone-header: "Корабль-дрон Вальтера Аркрайта"
dialogue-arkwright-hail-drone-neutral-text: "[Автосообщение] Пожалуйста, направляйте все запросы к Вальтеру Аркрайту в торговом грузовом модуле."
dialogue-arkwright-hail-drone-hated-text: "[Автосообщение] Вы известны как провокатор и экономический дестабилизатор. Приготовьтесь к ликвидации."

dialogue-drum-communique-header: "Коммюнике Федерации Друминенс"
dialogue-drum-communique-text: "То, что выглядит как бессмыслица, несомненно ценно для Друминенс. Из данных можно разобрать местоположение личного корабля Президента Друминенс. Координаты включены. \n [eeeeee][i]Возможно, вам это непонятно, но явно ценно. Подумайте, что было бы, если бы вы схватились с Президентом Друминенс.[/i][-]"

dialogue-drum-hail-boss-header: "Президент --[Непереводимо]--"
dialogue-drum-hail-boss-neutral-text: "НАЧАЛО ПЕРЕВОДА --[ Беседа приветствуется. Желателен обмен данными при наличии. ]-- КОНЕЦ ПЕРЕВОДА"
dialogue-drum-hail-boss-hated-text: "НАЧАЛО ПЕРЕВОДА --[ Беседа нежелательна. Немедленно удалитесь. ]-- КОНЕЦ ПЕРЕВОДА"

dialogue-kalgiri-communique-header: "Коммюнике Кал'Гири"
dialogue-kalgiri-communique-text: "Вопросы исключительной срочности должны быть переданы в канцелярию Первого Оратора. Не подлежат передаче по стандартным каналам — только курьером. Координаты включены. \n [eeeeee][i]Содержится информация о государственной безопасности Кал'Гири[/i][-]"

dialogue-kalgiri-hail-boss-header: "Первый Оратор Кал'Гири"
dialogue-kalgiri-hail-boss-neutral-text:  "Слушаю. Что привело тебя в поле зрения моего экрана? Лучше пусть это будет что-то достойное."
dialogue-kalgiri-hail-boss-hated-text: "Я слышал о тебе и тебе подобных. Убирайся прежде, чем разгневаешь меня."

#Conflict
#-- Battle
dialogue-default-conflict-defenderskilled: "И они называли нас сбродом. Мы справились, они бежали как мокрые чешуйчатые космокрысы! Спасибо за помощь, Капитан."
dialogue-default-conflict-attackerskilled: "Вот так мы отразили их вторжение в наше пространство. Спасибо за помощь, Капитан."
dialogue-kalgiri-conflict-defenderskilled: "Ни тени сомнения не мелькнуло у меня, у нас — ибо мы Кал'Гири и никогда не отступаем от врагов. Благодарю за помощь, Капитан."
dialogue-kalgiri-conflict-attackerskilled: "Стойко и верно — пусть песни воспевают Кал'Гири, защитивших это пространство сегодня. И пусть не забудется помощь этого достопочтенного Капитана."
dialogue-ticeroy-conflict-defenderskilled: "Капитан, ваша храбрость в помощи Тисерой сегодня внесена в мои записи. Ваша помощь в этой атаке отмечена."
dialogue-ticeroy-conflict-attackerskilled: "Пусть в записях значится, что в этот день и в этот час Тисерой противостояли всем агрессорам и вышли победителями. Пусть также значится, что без вашей помощи, Капитан, это было бы невозможно."
dialogue-sixiser-conflict-defenderskilled: "Хаха! Они и не поняли, что их ударило. Они всегда недооценивают, что могут сделать несколько решительных Сиксисер. И не забудем твою помощь, Капитан. Спасибо."
dialogue-sixiser-conflict-attackerskilled: "Сиксисер снова победили! Мы им показали — не убегаем, когда на кону наша территория. Спасибо, Капитан."
dialogue-drum-conflict-defenderskilled: "НАЧАЛО ПЕРЕВОДА --[ Наступление достигнуто. Враги горят. Победа достигнута. Большая благодарность. ]-- КОНЕЦ ПЕРЕВОДА"
dialogue-drum-conflict-attackerskilled: "НАЧАЛО ПЕРЕВОДА --[ Оборона выполнена. Капитан отмечен за доблесть. Дружеское признание завершено. ]-- КОНЕЦ ПЕРЕВОДА"
