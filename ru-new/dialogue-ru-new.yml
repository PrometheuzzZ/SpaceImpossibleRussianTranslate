dialogue-default-enterrange-station-blackhole-neutral-text: "Приветствую, Капитан. Держитесь подальше! Мои братья и я заняты исследованием этой аномалии."
dialogue-default-enterrange-station-blackhole-neutral-reply-explain: "Что за исследование? Что делает эта аномалия?"
dialogue-default-enterrange-station-blackhole-neutral-reply-openanomaly: "Вы можете активировать для меня аномалию?"
dialogue-default-enterrange-station-blackhole-neutral-explain: "Мои братья и я ищем Истину вселенной. Мы пришли к этой чёрной дыре в погоне за этой целью — интенсивная гравитация создаёт условия, которых нет больше нигде. Мы обнаружили, что эта аномалия способна порождать вещество, прошедшее сквозь горизонт событий и считавшееся навсегда утраченным для Вселенной."
dialogue-default-enterrange-station-blackhole-neutral-openanomaly: "Мы можем активировать аномалию для всех, кто интересуется Истиной. Однако для фокусировки гравитационных линз требуется Тёмная материя. Есть ли у вас Тёмная материя?"
dialogue-default-enterrange-station-blackhole-neutral-anomalyactivate: "Да, у меня есть Тёмная материя. Пожалуйста, приступайте. [Требуется: 20 x {item-base:item.darkmatter}]"
dialogue-default-enterrange-station-blackhole-neutral-anomalyactivate-respsuc: "Осторожно! Начинается Инверсия масс!"
dialogue-default-enterrange-station-blackhole-disliked-text: "Я слышал о вас, Капитан. Вы не из тех, кто избегает конфликтов. Тем не менее держитесь подальше! Мои братья и я заняты исследованием этой аномалии."
dialogue-default-enterrange-station-blackhole-disliked-explain: "Мои братья и я ищем Истину вселенной. Мы пришли к этой чёрной дыре в погоне за этой целью — интенсивная гравитация создаёт условия, которых нет больше нигде. Мы обнаружили, что эта аномалия способна порождать вещество, прошедшее сквозь горизонт событий и считавшееся навсегда утраченным для Вселенной."
dialogue-default-enterrange-station-blackhole-disliked-openanomaly: "Известно, что вы враждебны к моим братьям. Несмотря на это, я помогу каждому в этом поиске. Мы можем активировать аномалию для всех, кто интересуется Истиной. Однако для фокусировки гравитационных линз требуется Тёмная материя. Есть ли у вас Тёмная материя?"
dialogue-default-enterrange-station-blackhole-disliked-anomalyactivate: "Да, у меня есть Тёмная материя. Пожалуйста, приступайте."
dialogue-default-enterrange-station-blackhole-disliked-anomalyactivate-respsuc: "Осторожно! Начинается Инверсия масс!"
