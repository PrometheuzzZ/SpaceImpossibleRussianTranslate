#dialogue-fac0-winconflict: "Good work everyone. We've thrown out those who sought to bind us with needless rules and law."
#dialogue-fac1-winconflict: "Finally, peace in the star system has been achieved. Now we may all resume our day to day lives."
#dialogue-fac2-winconflict: "Another momentous occasion to be recorded for all-time. Each one of us holds a special place in history."
#dialogue-fac3-winconflict: "Congratulations ladies, gentlemen. Another system brought to order through solid execution of tactics and warfare."
#dialogue-fac4-winconflict: "We sure showed them didn't we? Finally safe haven for the Sixiser has been realized."
#dialogue-fac5-winconflict: "НАЧАЛО ПЕРЕВОДА --[ System at status normal. Sixiser happiness everyone assisted.  ]-- КОНЕЦ ПЕРЕВОДА"

dialogue-assemblerpass-default-text: "Эй! Тебе нужен пропуск, чтобы пользоваться моими ассемблерами. Я могу выдать пропуск ко всем ассемблерам в этом регионе за Ⱡ{cost}"
dialogue-assemblerpass-takeopt: "Конечно [Требуется Ⱡ{cost}]"
dialogue-assemblerpass-default-granted: "У тебя теперь есть пропуск к любому ассемблеру до следующего WARP!"

dialogue-repair-default-text: "Эй! Этот ремонт обойдётся тебе. Я оцениваю около Ⱡ{cost} за все эти плитки"
dialogue-repair-acceptopt: "Конечно [Требуется Ⱡ{cost}]"
dialogue-repair-takepass: "Возьму пропуск ассемблера [Требуется Ⱡ{passcost}]"
dialogue-repair-default-suc: "Должно быть полностью отремонтировано!"

tut-inventoryopen-tip: "Предметы можно перемещать по инвентарю корабля с помощью {key-interact} — и это только начало..."
tut-manufactureopen-tip: "В разделе Производство вы можете перерабатывать Руды в Листы, а затем в Компоненты. {key-interact}, чтобы выбрать рецепт и изготовить его"
tut-firstwarpout-tip: "Добро пожаловать в варп. Нажмите {key-systemclickmove} или используйте {key-moveforward} {key-rotatecounterclockwise} {key-moveback} {key-rotateclockwise} для исследования вселенной"
tut-warphint-tip: "Этот регион — не весь мир. Нажмите кнопку [b]ВАРП[/b] или {key-warp}, чтобы исследовать вселенную"
tut-pickupresource-tip: "Руды можно [b]Переработать[/b] с помощью [b]Фабрикаторов[/b] в Листы, а затем в предметы и Компоненты"
tut-firstcomponent-inventory-tip: "Вы получили Компонент! Компоненты «делают что-то полезное» для корабля. Компоненты можно устанавливать в крепления на вашем корабле с помощью {key-interact}."
tut-firstcomponent-interact-tip: "Вы поменяли Компонент! Компоненты можно устанавливать в слоты на вашем корабле с помощью {key-interact}. Узнайте о Компонентах"
tut-firstscan-tip: "Сканирование обнаруживает руды и другие ресурсы поблизости"
tut-enterbuild-tip: "Вы находитесь в зоне досягаемости Сборщика. Нажмите [b]НАЧАТЬ СТРОИТЕЛЬСТВО[/b] и выберите Сборщик, чтобы начать Строительство"
tut-firstbuild-tip: "Добро пожаловать в Строительство — здесь можно улучшать и изменять свой корабль. Нажмите, чтобы узнать, как начать работу со Строительством"
tut-itempickup-tip: "Предметы, плавающие рядом, можно подобрать с помощью {key-pickupitems}"
tut-enteredeva-tip: "В режиме ВКД вы можете делать многое: входить на другие корабли с помощью {key-enterexitvessel}, ремонтировать плитки и многое другое!"
tut-firstregiondiscovery-tip: "Вы открыли новый регион. Полёт вблизи регионов позволит узнать о них больше"
tut-missions-tip: "Похоже, в этой системе есть люди, которым нужна помощь — они разместили Задания на доске заданий {key-togglemissions}"
tut-trading-tip: "{key-interact} на предмет в инвентаре Торговца (слева), чтобы купить, или в вашем инвентаре (справа), чтобы продать"
tut-sysconflict-tip: "Вы только что вошли в систему в состоянии Конфликта. Участвуйте в [b]сражениях[/b] или помогайте тем, кто в [b]беде[/b], чтобы изменить расстановку сил. Нажмите, чтобы узнать больше"
tut-beacons-tip: "Маяки можно использовать для отметки важных мест. Установите его, нажав {key-actionsecondary}, удерживая над нужным местом в космосе"
tut-comp-assemblers-tip: "Сборщики используются для обновления или строительства новых кораблей. Узнайте о Сборщиках"
tut-comp-bridges-tip: "Мостики могут улучшать другие компоненты или добавлять новые способности. Узнайте о Мостиках"
tut-comp-cargobays-tip: "Грузовые отсеки используются для хранения предметов. Узнайте о Грузовых отсеках"
tut-comp-engines-tip: "Двигатели приводят корабль в движение и позволяют совершать варп-прыжки. Узнайте о Двигателях"
tut-comp-hangars-tip: "Ангары позволяют размещать другие корабли внутри и брать их с собой. Узнайте об Ангарах"
tut-comp-labs-tip: "Фабрикаторы позволяют перерабатывать ресурсы в полезные предметы. Узнайте о Фабрикаторах"
tut-comp-reactors-tip: "Реакторы обеспечивают энергией все остальные компоненты. Узнайте о Реакторах"
tut-comp-shields-tip: "Щиты защищают область от большинства видов оружия. Узнайте о Щитах"
tut-comp-weapons-tip: "Оружие позволяет уничтожать врагов или добывать ценные ресурсы. Узнайте об Оружии"
tut-building-mounts-tip: "Узнайте всё о редактировании креплений"
tut-building-comps-tip: "Узнайте всё о редактировании компонентов"
tut-building-tiles-tip: "Пора расширяться! Размещайте плитки с помощью {key-actionprimary}. Удаляйте плитки с помощью {key-actionsecondary}."
tut-building-paints-tip: "Добавьте красок! Красьте корабль с помощью {key-actionprimary}. Удаляйте краску с помощью {key-actionsecondary}."
tut-building-templates-tip: "Сохраняйте и загружайте собственные проекты кораблей или делитесь ими с другими игроками"
tut-enhancements-tip: "На вашем корабле теперь есть Улучшение. Улучшения могут усиливать другие компоненты или давать совершенно новые способности"
tut-weapongroups-tip: "Оружие стало трудно контролировать, или вы не хотите стрелять из всего сразу? Узнайте о группах оружия"
tut-hailing-tip: "Кто-то хочет с вами поговорить. Просматривайте входящие вызовы с помощью {key-viewhail} или сами вызывайте других с помощью {key-hail}"
tut-docking-tip: "Вы вошли в зону досягаемости Ангара. Узнайте, как пристыковывать корабли к другим кораблям"
tut-transittravel-tip: "Это регион с Прыжковыми воротами или Червоточиной. Летите к порталу на сканере и войдите в него, чтобы преодолеть огромные расстояния"
tut-sysproblems-tip: "В некоторых звёздных системах есть [b]Проблема[/b], которую нужно решить с вашей помощью. Узнайте о Проблемах"
