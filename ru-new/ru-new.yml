#FACTION TEXT
############################
fac-desc-lawless: "Область космоса, где ни человек, ни существо не имеет достаточного контроля, чтобы установить закон или порядок."

fac-desc-kalgiri: "Раса свирепых воинов-поэтов, Кал'Гири открыто враждебны, но их можно впечатлить подвигами силы, которые они запишут в свои саги."
fac-desc-ticeroy: "Якобы миротворцы — флот Тайсерой патрулирует большую часть цивилизованного космоса. Возглавляется Лордом Высшим Тайсероем, выборной пожизненной должностью."
fac-desc-sixiser: "Хорошо организованная (по сравнению с другими) пиратская группа, Пираты Сиксайзер — серьёзная угроза торговле везде, где они действуют."
fac-desc-drum: "Загадочная изоляционистская группа, Друминенс родом из кластера миров, закрытых для чужаков. Они предпочитают сначала стрелять. Однако значительными усилиями можно заслужить их слабое доверие."
fac-desc-gatecreators: "Неизвестная древняя раса, создавшая сеть прыжковых врат"
fac-desc-indtrader: "Ассоциация независимых торговцев. Не привязаны ни к кому, ищут только прибыли."
fac-desc-eu: "Сообщество учёных, исследователей и торговцев, Эксплорер Юнион стремится расширять знания и торговые контакты."
fac-desc-madd: "Малые, но эффективные, Мародёры Мэдда — группа наёмников, широко известная за нестандартную тактику и отсутствие официальной подотчётности. Их лидер и основатель Капитан Мэдд ведёт дела лично."
fac-desc-dim: "Иномирная био-механическая раса. Из-за редких встреч о этих внепространственных существах известно мало"
fac-desc-scrapper: "Сборщики металлолома галактики и общие торговцы утилем."
fac-desc-ticeroymutineers: "Группа мятежников, отвергнувшая клятвы служить во флоте Тайсерой."
fac-desc-forgottenrelics: "Загадочные древние реликвии давно ушедшей цивилизации."
fac-desc-musiciancollective: "Некоторые из лучших музыкантов галактики состоят в давнем коллективе музыкантов для общих интересов."
fac-desc-arkwright: "Один из богатейших торговцев вселенной; Аркрайт путешествует на сильно кастомизированном корабле, всегда готов заключить сделку."
