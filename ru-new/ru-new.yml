#Tutorial hint texts that popup once certain actions occur. Usually when clicked links to codex pages
tut-inventoryopen: "Предметы можно перемещать в инвентарях с помощью {key-interact}, и это только начало"
tut-manufactureopen: "С помощью Производства можно превращать руду в листы, а потом в компоненты. {key-interact} чтобы выбрать рецепт и изготовить"
tut-firstwarpout: "Добро пожаловать в WARP. Нажми {key-systemclickmove} или используй {key-moveforward} {key-rotatecounterclockwise} {key-moveback} {key-rotateclockwise}, чтобы исследовать вселенную"
tut-warphint: "Этот регион — ещё не всё. Нажми кнопку [b]WARP[/b] или {key-warp}, чтобы исследовать вселенную"
tut-pickupresource: "Руду можно [b]Производить[/b] на [b]Фабрикаторах[b] в листы, потом в компоненты и другие полезные предметы"
tut-firstcomponent-inventory: "Ты получил Компонент! Компоненты можно ставить в слоты твоего корабля с помощью {key-interact}. Узнать о Компонентах"
tut-firstcomponent-interact: "Ты заменил Компонент! Компоненты можно ставить в слоты твоего корабля с помощью {key-interact}. Узнать о Компонентах"
tut-firstscan: "Сканирование показывает руду и другие ресурсы поблизости"
tut-enterbuild: "Ты вошёл в зону действия Ассемблера. Нажми [b]НАЧАТЬ СТРОИТЕЛЬСТВО[/b] и выбери Ассемблер для начала Строительства"
tut-firstbuild: "Добро пожаловать в Строительство. Здесь можно улучшать и менять корабль. Кликни, чтобы узнать, как начать со Строительством"
tut-itempickup: "Предметы, плавающие рядом с тобой, можно подобрать с помощью {key-pickupitems}"
tut-enteredeva: "В EVA можно делать многое — заходить в другие корабли через {key-enterexitvessel}, чинить плитки и ещё больше!"
tut-hoverasteroid: Добывай астероиды, чтобы получать ресурсы для самых разных целей
tut-encounterhostile: Тебя взяли на прицел!! Стреляй по врагам через {key-actionsecondary}. Сканируй их жизненно важные компоненты у курсора через {key-actionprimary}
tut-firstregiondiscovery: "Ты открыл новый регион. Полёты рядом с регионами раскрывают о них больше"
tut-missions: "Похоже, в этой системе люди ищут помощь и разместили миссии на доске миссий {key-togglemissions}"
tut-trading: "{key-interact} по предмету в инвентаре Торговца (слева), чтобы купить, или в твоём (справа), чтобы продать"
tut-transitcreation: "Прыжковые врата — быстрый способ путешествовать на большие расстояния. Размести их через {key-actionsecondary} в WARP. Кликни, чтобы узнать больше и как их связывать"
tut-sysconflict: "Ты вошёл в систему в Конфликте. Завершай [b]битвы[/b] или помогай [b]бедствующим[/b], чтобы изменить баланс. Кликни, чтобы узнать больше"
tut-beacons: "Маяки можно использовать для пометки важных мест. Размести через {key-actionsecondary}, наведя на космос"
tut-comp-assemblers: "Ассемблеры используются для обновления или постройки новых кораблей. Узнать об Ассемблерах"
tut-comp-bridges: "Мостики могут усиливать другие компоненты или добавлять новые способности. Узнать о Мостиках"
tut-comp-cargobays: "Грузовые отсеки используются для хранения предметов. Узнать о Грузовых отсеках"
tut-comp-engines: "Двигатели заставляют корабль двигаться и позволяют входить в WARP. Узнать о Двигателях"
tut-comp-hangars: "Ангары можно использовать, чтобы хранить в них другие корабли и брать их с собой в путь. Узнать об Ангарах"
tut-comp-labs: "Фабрикаторы позволяют производить из ресурсов полезные предметы. Узнать о Фабрикаторах"
tut-comp-reactors: "Реакторы дают энергию всем остальным компонентам. Узнать о Реакторах"
tut-comp-shields: "Щиты защищают область от большинства видов оружия. Узнать о Щитах"
tut-comp-weapons: "Оружие может уничтожать врагов или добывать ценные ресурсы. Узнать об Оружии"
tut-building-mounts: "Узнать всё о редактировании слотов"
tut-building-comps: "Узнать всё о редактировании компонентов"
tut-building-tiles: "Узнать всё о редактировании плиток"
tut-building-paints: "Узнать всё о покраске плиток"
tut-building-templates: "Сохраняй/загружай свои конструкции кораблей или делись и загружай чужие"
tut-enhancements: "Твой корабль теперь имеет Улучшение. Улучшения могут усиливать другие компоненты или давать совершенно новые способности"
tut-weapongroups: "Оружия становится много, не хочется стрелять всем сразу? Узнать о группах оружия"
tut-hailing: "Кто-то хочет с тобой поговорить. Просматривай входящие вызовы через {key-viewhail} или вызывай других через {key-hail}"
tut-docking: "Ты вошёл в зону действия Ангара. Узнай, как стыковать корабли в другие корабли"
tut-transittravel: "Это регион Прыжковых врат / Червоточины. Лети к порталу, показанному на сканере, и войди в него для перемещения на большие расстояния"
tut-sysproblems: "В некоторых звёздных системах есть [b]Проблема[/b], которую нужно решить с твоей помощью. Узнать о Проблемах"

