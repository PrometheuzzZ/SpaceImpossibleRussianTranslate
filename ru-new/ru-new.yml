buildinged-lastcargobay-title: "ВНИМАНИЕ: УДАЛЕНИЕ ПОСЛЕДНЕГО ГРУЗОВОГО ОТСЕКА"
buildinged-lastcargobay-msg: "Ты собираешься удалить последний грузовой отсек. Это может затруднить дальнейшее строительство. Грузы будут сброшены в космос. Продолжить?"

buildinged-lastcargobayself-title: "ВНИМАНИЕ: ПОСЛЕДНИЙ ГРУЗОВОЙ ОТСЕК АССЕМБЛЕРА"
buildinged-lastcargobayself-msg: "Ты ведёшь самосборку и собираешься удалить последний грузовой отсек у этого Ассемблера. Это может затруднить строительство, и удалённые предметы будут сброшены в космос. Продолжить?"

buildinged-iscurrentassembler-title: "ВНИМАНИЕ: УДАЛЕНИЕ АССЕМБЛЕРА"
buildinged-iscurrentassembler-msg: "Ты ведёшь самосборку и пытаешься удалить текущий Ассемблер. Если продолжишь, ты больше не сможешь строить на этом корабле или с его помощью. \n[ff0000][b]Если это твоя единственная станция, настоятельно НЕ рекомендуется продолжать.[/b][-] \nТочно хочешь продолжить?"

buildinged-unpowerscurrentassembler-title: "ВНИМАНИЕ: АССЕМБЛЕР ОТКЛЮЧИТСЯ"
buildinged-unpowerscurrentassembler-msg: "Ты ведёшь самосборку и пытаешься удалить реактор, что отключит текущий Ассемблер. Без питания ты не сможешь использовать этот Ассемблер в будущем. Продолжить?"

buildinged-issplit-title: "ВНИМАНИЕ: У ОБЪЕКТА ЕСТЬ НЕСВЯЗАННЫЕ КУСКИ!"
buildinged-issplit-msg: "Ты пытаешься выйти из строительства, но есть куски объекта, не связанные с основной частью. Если продолжишь, все несвязанные плитки и компоненты вернутся в инвентарь Ассемблера. Продолжить?"

buildinged-notiles-title: "ВНИМАНИЕ: У ОБЪЕКТА НЕТ ПЛИТОК!"
buildinged-notiles-msg: "Ты пытаешься выйти из строительства, но у объекта нет плиток. Если продолжишь, ты будешь возвращён/выброшен в EVA-скафандр. Продолжить?"

buildinged-nobridges-title: "ВНИМАНИЕ: У ОБЪЕКТА НЕТ МОСТИКОВ!"
buildinged-nobridges-msg: "Ты пытаешься выйти из строительства, но у объекта нет слотов мостиков. Если продолжишь, ты будешь возвращён/выброшен в EVA-скафандр. Продолжить?"

buildinged-nomoreselfassemble-title: "КРИТИЧЕСКОЕ ВНИМАНИЕ: САМОСБОРКА ОБЪЕКТА!"
buildinged-nomoreselfassemble-msg: "Ты ведёшь самосборку и собираешься выйти из строительства, но объект, возможно, больше не поддерживает самосборку. Если продолжишь, ты больше не сможешь строить на этом корабле или с его помощью. \n[ff0000][b]Если это твоя единственная станция, настоятельно НЕ рекомендуется продолжать.[/b][-] \nТочно хочешь продолжить?"

buildinged-resizeerror-title: "ВНИМАНИЕ: РАЗМЕР МЕНЬШЕ КОРАБЛЯ"
buildinged-resizeerror-msg: "Ты пытаешься сделать размер меньше текущего, любые плитки, слоты и компоненты вне новой меньшей области вернутся в Ассемблер. Хочешь продолжить?"

buildinged-clearall-title: "ВНИМАНИЕ: ОЧИСТКА ВСЕГО"
buildinged-clearall-msg: "Уверен, что хочешь убрать все плитки, слоты и компоненты с этого корабля и вернуть их в инвентарь Ассемблера?"

buildinged-clearunconnected-title: "ВНИМАНИЕ: УДАЛЕНИЕ НЕСВЯЗАННЫХ КУСКОВ"
buildinged-clearunconnected-msg: "Уверен, что хочешь убрать любые плитки, слоты и компоненты с этого корабля, не связанные с основной частью (отмечены красным), и вернуть их в инвентарь Ассемблера?"

buildinged-removalmountunsupported-title: "ВНИМАНИЕ: УДАЛЕНИЕ СЛОТА"
buildinged-removalmountunsupported-msg: "Ты пытаешься удалить слот, который текущий Ассемблер не поддерживает. Ты не сможешь установить его обратно с этим Ассемблером. Продолжить?"

buildinged-resize-selfassemble-title: "ВНИМАНИЕ: РАЗМЕР МЕНЬШЕ КОРАБЛЯ"
buildinged-resize-selfassemble-msg: "Ты ведёшь самосборку и пытаешься уменьшить размер. Это действие удалит текущий Ассемблер, и ты не сможешь продолжить строительство. Хочешь продолжить?"

buildinged-clear-selfassemble-title: "ВНИМАНИЕ: ОЧИСТКА ВСЕГО"
buildinged-clear-selfassemble-msg: "Ты ведёшь самосборку и пытаешься очистить всё. Ты не сможешь продолжить строительство. Продолжить?"

buildinged-templateloadfail-title: "ВНИМАНИЕ: ПРОБЛЕМА С РАЗМЕЩЕНИЕМ ШАБЛОНА"
buildinged-templateloadfail-msg: "Другой объект мешает шаблону полностью загрузиться. Продолжение может привести к неполному кораблю. Продолжить?"

buildinged-pendingonexit-title: "ВНИМАНИЕ: ОЖИДАЮЩИЕ ПРАВКИ"
buildinged-pendingonexit-msg: "Ты пытаешься выйти из строительства, но есть незавершённые изменения. Если продолжишь, некоторые правки не завершатся. Продолжить?"


