version-gamename: "SPACE IMPOSSIBLE"

menu-ea-text: >
 Добро пожаловать, капитан
 \n
 Space Impossible сейчас находится в стадии [b][38FAA6]BETA[-][/b]. Это означает, что хотя многие фундаментальные возможности уже на месте, контент, баланс и более мелкие функции
 ещё постоянно дорабатываются. Сейчас есть очень базовое обучение. Возможны баги, краши, и хотя мы прилагаем все усилия, чтобы этого не случилось, сохранения могут быть потеряны в любой момент. Если у тебя
 проблема или ты считаешь, что нашёл баг, мы будем крайне благодарны,\n если ты сообщишь нам.\n\nМы надеемся, что ты как ранний пользователь знаешь и принимаешь эти риски, а также понимаешь, насколько ты и
 твои отзывы помогают формировать игру в её финальную форму.\n\nНаслаждайся путешествием, капитан!

