problem-default-extrasolarribbon-step3-summary: "Доставить детали несобранного дефлектора"
problem-default-extrasolarribbon-step3-desc: |
 [h1]Внесолнечная энергетическая лента[/h1]
 [h2]У учёных есть идея[/h2]
 Учёные наконец определили причину всего хаоса в системе. Не слишком далеко за пределами солнечной системы проходит внесолнечная лента, которая и вызывает все проблемы. Мы разработали стратегию по отражению излучения, но нужны умелые капитаны, чтобы собрать и смонтировать устройство. Нужно подобрать детали [em]Антигравитонного дефлектора[/em] из каждого [em]Пункта получения деталей[/em] и доставить их на [em]Площадку сборки антигравитонного дефлектора[/em]. После сборки этой машины она должна обеспечить защиту солнечной системы, пока энергетическая лента не уйдёт достаточно далеко обратно в межзвёздное пространство.

