 Ситуация в системе ухудшается всё быстрее. Странные энергетические показания появляются почти везде, повреждаются даже станции. Мы просим доступных капитанов помочь перевезти припасы из [em]Зоны помощи[/em] на [em]Нуждающиеся станции[/em].

