problem-default-rogueeugenics-step2-summary: "Принудить подозреваемых грязных копов сдаться для допроса"
problem-default-rogueeugenics-step2-desc: |
 [h1]Учёный-отступник выводит евгенические аберрации[/h1]
 [h2]Коррупция и взяточничество[/h2]
 Журналы данных станций ещё анализируются, но похоже, что все они были посещены несколькими местными космическими копами до того, как всё пошло наперекосяк. Мы подозреваем, что эти копы берут взятки и причастны к некоему правоприменению или другой нелегальной деятельности. Ты можешь помочь, доставив этих космокопов, патрулирующих под видом [em]Полицейский корабль[/em], для допроса.

problem-default-rogueeugenics-step2-opt-handin: Станция, у меня для вас есть несколько грязных копов.
problem-default-rogueeugenics-step2-suc: Спасибо, капитан. Мы докопаемся до сути.
problem-drum-rogueeugenics-step2-suc: BEGIN TRANSLATION --[ Заключённый принят. Спасибо, Капитан. ]-- END TRANSLATION
problem-default-rogueeugenics-step2-complete: Хорошая работа. Достаточно грязных копов задержано. Скоро мы их обработаем.

problem-default-rogueeugenics-step3-summary: "Найти и уничтожить био-механоидные чудовища"
problem-default-rogueeugenics-step3-desc: |
 [h1]Учёный-отступник выводит евгенические аберрации[/h1]
 [h2]Серьёзно и смертельно[/h2]
 Оказывается, эти космокопы и правда были грязными! Они брали взятки, чтобы смотреть в другую сторону, а порой даже доставляли запрещённые био-органические материалы, которые использовали учёные. Теперь мы подозреваем, что эти учёные «выводили» био-механоидные корабли. Один из этих криминальных копов смог рассказать нам о нескольких отдалённых астероидных регионах, которые могут использовать учёные. Вернись в [em]Исследовательские комплексы[/em], которые ты посещал ранее, и уничтожь любых чудовищ, которых найдёшь.

