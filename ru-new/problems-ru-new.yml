problem-default-piratelife-title: Пиратская жизнь
problem-default-piratelife-step1-summary: Уничтожить лолесские суда
problem-default-piratelife-step1-desc:  |
 [h1]Пиратская жизнь[/h1]
 Быть пиратом непросто. На этот менее ограниченный образ жизни постоянно нападают те, кто видит в нас паразитов. Но это неправда. Мы создаём свои возможности из окружающей вселенной. И мы никогда, ну, почти никогда, не нападаем друг на друга. Несколько кораблей отказались признать наши права на эту систему и вместо этого пытаются грабить нас! Из всего на свете. Помоги нам избавиться от этих неприятностей, уничтожая как можно больше $facbase:fac.lawless$[em]Лолесских кораблей[/em].

