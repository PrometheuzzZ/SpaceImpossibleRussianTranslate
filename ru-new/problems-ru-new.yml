problem-default-pirates-title: Проблемы с пиратами
problem-default-pirates-step1-summary: Уничтожить пиратские суда
problem-default-pirates-step1-desc:  |
 [h1]Проблемы с пиратами[/h1]
 Пираты Сиксайзер — обширная свободно организованная банда пиратов. У них нет никаких сомнений по поводу грабежа, мародёрства, кражи или «экспроприации». Они также промышляют рабами и наркотиками. Они везде, и стоит остановить одного, как кажется, что на его место сразу приходит другой. Сделай свой вклад и помоги остановить нескольких.

