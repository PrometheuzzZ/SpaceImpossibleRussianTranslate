problem-default-drugsmugglers-step3-desc: |
 [h1]Контрабандисты Сока[/h1]
 [h2]Химическая инженерия Сока[/h2]
 Дела идут неплохо, но мы ещё в одном крупном шаге от прекращения проблемы Сока в системе. После рейдов мы получили информацию о торговом маршруте, ведущем к месту производства. Найди его в [em]Секретной нарколаборатории[/em] и лиши их возможности производить ещё, уничтожив все [em]Прекурсоры химикатов[/em].

