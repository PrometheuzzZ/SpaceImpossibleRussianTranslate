problem-default-spacewasps-givebuff: Космоосы — не повод для шуток. С твоей помощью они истреблены, как и положено. Прими нашу благодарность.
problem-drum-spacewasps-givebuff: BEGIN TRANSLATION --[ Да, Капитан. Благодарность принимается. ]-- END TRANSLATION

#Rogue Scientist Breeding Eugenic Abherrations ==============================================================================================================
