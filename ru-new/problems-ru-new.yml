problem-completestep-subheader: "Система {sysstar}"

#Solar Problem ==============================================================================================================
problem-default-solar-title: "Солнечная буря"
problem-default-solar-step1-summary: "Помочь местным кораблям в бедствии"
problem-default-solar-step1-desc: |
 [h1]Солнечная буря[/h1]
 [h2]Корабли в бедствии[/h2]
 Местная звезда {sysstar} переживает период интенсивных колебаний. Это разрушительно сказывается на местных перевозках: солнечные вспышки бьют по едва защищённым компьютерным ядрам кораблей далеко за пределами их минимальных характеристик. Помоги местным кораблям, попавшим в [em]Бедствие[/em], запустить их вновь или перевези их пассажиров в безопасность ближайшей станции.

problem-default-solar-distress1: Мы в бедствии! Наши компьютерные ядра вышли из строя из-за солнечной активности, и нам нужна помощь!
problem-drum-solar-distress1: BEGIN TRANSLATION --[ Бедствие! Компьютерные ядра нарушены солнечной активностью. Помощь требуется! ]-- END TRANSLATION
problem-default-solar-distress1-opt-takepeople: Тебе повезло. Я могу доставить твоих пассажиров в безопасность.
problem-default-solar-distress1-peoplespawn: Спасибо! Мы запускаем EVA-скафандры. Подбери нас!
problem-drum-solar-distress1-peoplespawn: BEGIN TRANSLATION --[ Благодарность! Запуск EVA-скафандров. Подбери нас! ]-- END TRANSLATION
problem-default-solar-step1-opt-handin: Станция, я нашёл некоторых ваших людей, нуждавшихся в спасении. Готовьтесь принять их.
problem-default-solar-step1-suc: Капитан, пассажиры приняты. Медотсек сообщает, что они в хорошем состоянии. Спасибо за помощь.
problem-drum-solar-step1-suc: BEGIN TRANSLATION --[ Капитан, пассажиры приняты. Медотсек докладывает хорошее состояние. Спасибо за помощь. ]-- END TRANSLATION
problem-default-solar-step1-complete: Хорошая работа. Однако проблема ещё не решена. Продолжай работать с местными властями, чтобы завершить дело.
problem-drum-solar-step1-complete: BEGIN TRANSLATION --[ Хорошо. Проблема не решена. Работай с местными властями. ]-- END TRANSLATION
problem-default-solar-step2-complete-reqtractor: Мне нужен трактор, можете дать?
problem-default-solar-step2-complete-reqtractor-give: Да, вот трактор, должен подойти. Не забудь установить его на корабль.
problem-drum-solar-step2-complete-reqtractor-give: BEGIN TRANSLATION --[ Подтверждение, трактор предоставлен. Установить на корабль. ]-- END TRANSLATION

problem-default-solar-step2-summary: "Собрать и доставить данные с зондов"
problem-default-solar-step2-desc: |
 [h1]Солнечная буря[/h1]
 [h2]Вопрос данных[/h2]
 После помощи местным кораблям в бедствии непосредственная катастрофа миновала. Однако звезда грозит снова усилить активность в любой момент. Команда учёных работает над проблемой, но они до сих пор не получили данных со своих зондов. Этим учёным можно помочь: разыщи и собери данные с [em]Солнечных зондов[/em] в [em]Астероидных полях[/em] и доставь их на местную станцию для анализа.

problem-default-solar-solarprobe-header: "{vesselname}"
problem-default-solar-solarprobe-hail1: Солнечный зонд работал и непрерывно собирал данные. Буферы заполнены. Данные готовы к передаче.
problem-default-solar-solarprobe-opt-req: Зонд, подготовь данные к передаче по моей команде. Запускай.
problem-default-solar-solarprobe-give: Данные собраны и отправлены. Буферы очищены. Зонд отключается.
problem-default-solar-solarprobe-hail-done: Данные уже отправлены. Буферы очищены. Невозможно воссоздать записи.
problem-default-solar-step2-opt-handin: Станция, у меня данные с солнечных зондов готовы к передаче. Готовьтесь принять.
problem-default-solar-step2-suc: Спасибо, капитан. Данные получены. Мы немедленно передадим их учёным.
problem-drum-solar-step2-suc: BEGIN TRANSLATION --[ Спасибо. Капитан. Данные получить. Учёным передать немедленно. ]-- END TRANSLATION
problem-default-solar-step2-complete: Хорошая работа, капитан. Учёные сейчас изучают данные.
problem-drum-solar-step2-complete: BEGIN TRANSLATION --[ Хорошая работа. Капитан. Учёные изучают данные. ]-- END TRANSLATION

problem-default-solar-step3-summary: "Развернуть платформы солнечной модуляции"
problem-default-solar-step3-desc: |
 [h1]Солнечная буря[/h1]
 [h2]Решение найдено[/h2]
 Данные зондов дали отличные результаты в анализе активности звезды {sysstar}. Учёные предоставили наводки, которые инженеры используют для производства Платформ солнечной модуляции — устройств, которые будут находиться на высокой солнечной орбите и помогать сохранять звезду благоприятной для космической жизни. Помоги доставить эти платформы на каждую обозначенную [em]Точку солнечного зонда[/em], каждая должна быть размещена в специально определённом учёными месте. Неразвёрнутые платформы можно найти у станции [em]Фабрика солнечных зондов[/em].

problem-default-solar-solarplatform-handin1: Хорошая работа, капитан. Эта платформа на месте и готова к работе.
problem-drum-solar-solarplatform-handin1: BEGIN TRANSLATION --[ Хорошая работа. Капитан. Платформа на месте. Готова. ]-- END TRANSLATION
problem-default-solar-solarfactory-hail: Здравствуй, капитан. Мы можем поставить солнечные платформы для развёртывания. Их установка — твоя задача.
problem-drum-solar-solarfactory-hail: BEGIN TRANSLATION --[ Здравствуй. Капитан. Поставка солнечной платформы доступна. Развёртывание — твоя ответственность. ]-- END TRANSLATION
problem-default-solar-solarfactory-reqplatform: Станция, можете запустить ещё одну платформу? Я готов её буксировать.
problem-default-solar-solarfactory-reqplatform-granted: Понял, капитан. Запускаем платформу. Удачи.
problem-drum-solar-solarfactory-reqplatform-granted: BEGIN TRANSLATION --[ Понял. Капитан. Запуск платформы сейчас. Удачи. ]-- END TRANSLATION
problem-default-solar-solarfactory-reqplatform-denied: Отказано, капитан. У нас ограничены ресурсы. Поблизости уже есть доступная платформа.
problem-drum-solar-solarfactory-reqplatform-denied: BEGIN TRANSLATION --[ Отказано. Капитан. Ограниченные ресурсы. Платформа доступна рядом. ]-- END TRANSLATION
problem-default-solar-step3-complete: Потрясающе, капитан. Все платформы развёрнуты и работают! Звезда стабилизируется. Спасибо за помощь.
problem-drum-solar-step3-complete: BEGIN TRANSLATION --[ Потрясающе. Капитан. Все платформы развёрнуты. Работают! Звезда стабилизируется. Благодарность за помощь. ]-- END TRANSLATION

problem-default-solar-opt-getbuff: Станция, я готов получить награду.
problem-default-solar-givebuff: Конечно, капитан. Ещё раз спасибо за помощь со звездой.
problem-drum-solar-givebuff: BEGIN TRANSLATION --[ Да, Капитан. Благодарность принимается. ]-- END TRANSLATION

#Music Festival ==============================================================================================================
problem-default-musicfestival-title: "Музыкально-культурный фестиваль"
problem-default-musicfestival-step1-summary: "Подобрать и доставить ошибочно отправленные баннеры на станцию"
problem-default-musicfestival-step1-desc: |
 [h1]Музыкально-культурный фестиваль[/h1]
 [h2]Потерялись при доставке[/h2]
 С одобрения культурного совета подготовка к музыкально-культурному фестивалю идёт полным ходом. А значит — много еды, музыки, танцев и пантомимы. Минус: организация превращается в неразбериху. Последняя проблема: человек, заказавший баннеры для фестиваля, заболел, а его заместитель отправил баннеры не туда. Теперь дорогие баннеры лежат в грузовых капсулах где угодно, кроме нужного места. Помоги наладить дело — забери груз [em]Доставка для музыкального фестиваля[/em] на ближайших станциях и доставь его в нужное место.

problem-default-musicfestival-station: Ты пришёл помочь с музыкальным фестивалем? Ты в курсе всех новостей?
problem-default-musicfestival-step1-opt-handin: Я нашёл некоторые из ваших баннеров. Готовьтесь принять.
problem-default-musicfestival-step1-suc: Получилось. Один баннер найден и возвращён.
problem-default-musicfestival-step1-complete: Спасибо за помощь, капитан! Ты не представляешь, во сколько обошлась бы их замена.

problem-default-musicfestival-step2-summary: "Спасти застрявших музыкантов"
problem-default-musicfestival-step2-desc: |
 [h1]Музыкально-культурный фестиваль[/h1]
 [h2]Пропавшие музыканты[/h2]
 Какая катастрофа! Даже после решения проблемы с баннерами теперь оказалось, что у шаттлов музыкантов закончилось топливо. Это одни из лучших музыкантов в галактике, и они сидят в открытом космосе, медленно замерзая, — и всё ради этого мероприятия! Найди [em]Корабль с музыкантами[/em], помоги спасти этих людей и доставь их в безопасность тёплой станции с энергией.

problem-default-musicfestival-distress1: Помогите! У нас закончилось топливо по пути на музыкальный фестиваль. Мы здесь замерзаем! Можете помочь?
problem-default-musicfestival-distress1-opt-takepeople: Да, могу помочь. Готовьтесь к подбору.
problem-default-musicfestival-distress1-peoplespawn-header: Музыкант
problem-default-musicfestival-distress1-peoplespawn: Готовлюсь к выходу в космос. Не оставляй меня висеть.
problem-default-musicfestival-step2-opt-handin: У меня есть несколько музыкантов для вас. Они быстро согреются.
problem-default-musicfestival-step2-suc: Слегка замёрзший музыкант принят. Спасибо, капитан.
problem-default-musicfestival-step2-complete: Все пропавшие музыканты найдены. Наша благодарность тебе, капитан.

problem-default-musicfestival-step3-summary: "Уничтожить или откупиться от пиратов-контрафактчиков"
problem-default-musicfestival-step3-desc: |
 [h1]Музыкально-культурный фестиваль[/h1]
 [h2]Бутлегеры-бандиты[/h2]
 Может быть хуже!? Мы наконец сдвинули дело с мёртвой точки, и тут — пираты! Видимо, один из их трусливых сообщников протащил записывающее устройство на закрытые репетиции, и теперь они грозят продавать пиратские записи. Это разорит фестиваль экономически, ведь мы рассчитывали на продажу записей для покрытия расходов. Помоги найти [em]Пиратскую радиопередачу[/em] и останови эти контрафактные копии до того, как они смогут распространить записи.

problem-default-musicfestival-pirateradiostation: Что тебе нужно?
problem-default-musicfestival-pirateradiostation-opt1: Пиратская радиостанция. У вас записи, которые вам не принадлежат.
problem-default-musicfestival-pirateradiostation-station: Так они тебя послали? Готов заплатить [b][00ccff]Ⱡ{bribecost}[-][/b]?
problem-default-musicfestival-pirateradiostation-opt-bribe: Хорошо. Мне разрешено заплатить вам, чтобы контрафакт был уничтожен. Держи [Требуется: Ⱡ{bribecost}].
problem-default-musicfestival-pirateradiostation-opt-spaced: Катись в космос! Я не торгуюсь с пиратской мразью. Я снесу твою передачу силой.
problem-default-musicfestival-pirateradiostation-bribe-suc: Честная сделка. Видишь, не так уж больно было всех уважить.
problem-default-musicfestival-pirateradiostation-bribe-fail: Ты с ума сошёл? И это ты называешь взяткой?
problem-default-musicfestival-pirateradiostation-bribed: Я уничтожил контрафакт, теперь убирайся отсюда.
problem-default-musicfestival-step3-complete: Хорошая работа, капитан! С уничтожением контрафакта и при идущем фестивале это стало сокрушительным успехом! Огромное спасибо.

#music problem solved
problem-default-musicfestival-station-aftermath: Спасибо за всю помощь! Наслаждайся музыкальным фестивалем!
trader-musicfestival: Торговец фестиваля

problem-default-musicfestival-opt-getbuff: Станция, я готов получить награду.
problem-default-musicfestival-givebuff: Не можем нарадоваться твоей помощи в спасении музыкального фестиваля. Держи.
problem-drum-musicfestival-givebuff: BEGIN TRANSLATION --[ Да, Капитан. Благодарность принимается. ]-- END TRANSLATION

#Mutiny ==============================================================================================================
problem-default-mutiny-title: "Мятежный экипаж"
problem-default-mutiny-step1-summary: "Найти и проанализировать источники сигналов"
problem-default-mutiny-step1-desc: |
 [h1]Мятежный экипаж[/h1]
 [h2]Что это за сигналы?[/h2]
 В системе участились странные сигналы, пересекающие пространство. Добавь к этому, что они тщательно зашифрованы, и местное командование начинает хмуриться. Они хотят расследовать дело, прежде чем докладывать в Высшее командование Тайсерой. Последние известные позиции передач отмечены как [em]Точка сигнала[/em] — их следует проверить.
problem-default-mutiny-step1-proximity: "Заключено во льду? Попробуй извлечь его из ледяной оболочки, осторожно, не повреди."

problem-default-mutiny-freedbeacon-header: "{vesselname}"
problem-default-mutiny-freedbeacon-text: ОБНАРУЖЕН НЕСАНКЦИОНИРОВАННЫЙ ДОСТУП *bzzt* [i][cccccc]{vesselname} самоуничтожается, пока ты пытаешься его исследовать. Однако ты успел зафиксировать местоположение другого сигнала.[/i][-]
problem-default-mutiny-step1-complete: "Местное командование благодарит тебя за помощь. Скоро с тобой свяжутся."
problem-default-mutiny-step1-complete-reqtractor: Мне нужен трактор, можете дать?
problem-default-mutiny-step1-complete-reqtractor-give: Да, вот трактор, должен подойти. Не забудь установить его на корабль.

problem-default-mutiny-step2-summary: "Обездвижить и доставить корабли для допроса"
problem-default-mutiny-step2-desc: |
 [h1]Мятежный экипаж[/h1]
 [h2]Тревожные тенденции[/h2]
 Намеренно спрятанное передающее оборудование, скрытое в ледяных астероидах? Очень тревожно. Местное командование докладывает: несколько кораблей активны, но не реагируют на последние приказы. Возможно, они причастны ко всему этому. Найди эти [em]Несотрудничающие корабли[/em], при необходимости обездвижь их и доставь на буксире на базу для расследования.

problem-default-mutiny-step2-opt-handin: "У меня корабль, готовый к обработке."
problem-default-mutiny-step2-handin-start: "Отлично. Тащи его сюда для обработки."
problem-default-mutiny-step2-complete: "Все корабли учтены. Мы обработаем экипаж и докопаемся до истины."
problem-default-mutiny-step3-summary: "Перевезти и доставить космодесант"
problem-default-mutiny-step3-desc: |
 [h1]Мятежный экипаж[/h1]
 [h2]Так, до этого дошло[/h2]
 Мятеж! Только этим объясняется происходящее в системе. Наша собранная разведка указывает: несколько экипажей подняли мятеж и используют заброшенные шахтёрские аванпосты для сбора сил. Высшее командование Тайсерой проинформировано, и в ответ санкционировало использование космодесанта для штурма и казни любых мятежных экипажей на станциях. Подбери и доставь этих десантников из любой верной станции Тайсерой к [em]Скрытой базе[/em] и помоги покончить с этим мятежом раз и навсегда.

problem-default-mutiny-opt-reqmarines: "Я готов перевозить космодесант."
problem-default-mutiny-reqmarines-peoplespawn: "Космодесант готов к подбору."
problem-default-mutiny-reqmarines-hasmarines: "Извини, капитан, но похоже, у тебя уже есть десантники на борту."
problem-default-mutiny-step3-complete: "Отличная работа, капитан. Мятежные псы повержены. Местное командование благодарит."
problem-default-mutiny-abandonedship-hail-header: ЗАБРОШЕННОЕ СУДНО
problem-default-mutiny-abandonedship-hail: [i][cccccc]Канал связи открыт, но ответа нет. Похоже, корабль полностью покинут.[-][/i]
problem-default-mutiny-mutineersurrender-text: Ладно, ладно! Ты нас взял. Только не подрывай нас!
problem-default-mutiny-ship-handin1: Спасибо за доставку корабля. Будет обработан.
problem-default-mutiny-base-hail1: Что тебе нужно?
problem-default-mutiny-base-opt-sendmarines: Станция! Прекращайте сопротивление и готовьтесь к абордажу!
problem-default-mutiny-base-infilsuccess: Капитан. Мои люди и я успешно захватили станцию. Спасибо за подброс.
problem-default-mutiny-base-sendmarines-sent: Десант готов и начинает абордаж.

problem-default-mutiny-opt-getbuff: Станция, я готов получить награду.
problem-default-mutiny-givebuff: После того, как ты разобрался с мятежом, ты заслужил каждую частицу нашей благодарности.
problem-drum-mutiny-givebuff: BEGIN TRANSLATION --[ Да, Капитан. Благодарность принимается. ]-- END TRANSLATION

#Trade Gone Aray ==============================================================================================================
problem-default-tradesgoneawry-title: "Сорвавшиеся торговые переговоры"
problem-default-tradesgoneawry-step1-summary: "Связаться с неизвестными судами в астероидных полях"
problem-default-tradesgoneawry-step1-desc: |
 [h1]Сорвавшиеся торговые переговоры[/h1]
 [h2]Неизвестные гости[/h2]
 Губернатор системы недавно вёл торговые переговоры с соседней системой о крайне нужных правах на сырьё. Дела шли хорошо последние недели, как вдруг связь с торговой делегацией системы оборвалась. А в последние дни в нашей системе замечены неопознанные корабли с траекториями полёта со стороны соседней системы — они посещают астероидные поля. Нам нужна помощь, чтобы выяснить, связаны ли эти события. Помоги установить диалог с этими гостями, попытавшись связаться с ними. Связывайся с каждым [em]Неизвестным кораблём[/em], встреченным в [em]Астероидном поле[/em].

problem-default-tradesgoneawry-step1-complete: "Хорошая работа, капитан. Мы начинаем видеть закономерность в этих контактах."
problem-drum-tradesgoneawry-step1-complete: "BEGIN TRANSLATION --[ Хорошие результаты. Закономерность проявляется. ]-- END TRANSLATION"
problem-default-tradesgoneawry-unknownship-hail: *вспышка статики, они закрывают связь*

problem-default-tradesgoneawry-step2-summary: "Обездвижить неизвестные суда и арестовать экипаж"
problem-default-tradesgoneawry-step2-desc: |
 [h1]Сорвавшиеся торговые переговоры[/h1]
 [h2]Больше вопросов, чем ответов[/h2]
 Несмотря на наши попытки связаться с этими неизвестными кораблями, они избегают контакта. Кабинет губернатора требует ответов. Это прелюдия к вторжению? Были ли переговоры лишь тактикой, чтобы проверить нашу находчивость? Нам нужно разобраться. Нужно действовать жёстче и получить ответы. Помоги получить эти ответы — обездвиживай эти [em]Иностранные корабли[/em] и арестовывай их экипаж для допроса.


