problem-default-drugsmugglers-title: "Контрабандисты Сока"
problem-default-drugsmugglers-step1-summary: "Расследовать подозрительные корабли и запугать их"
problem-default-drugsmugglers-step1-desc: |
 [h1]Контрабандисты Сока[/h1]
 [h2]Сок — это проблема[/h2]
 Знаешь, что такое Сок? Это набирающий популярность наркотик. Шахтёры особенно к нему пристрастны, как и тусовщики, желающие гулять часами. Однако местная контора хочет это прекратить. Мы знаем, что наркотик производят пираты, но не уверены, как он попадает на станции. Новый подход: останавливать все грузовые корабли до их швартовки и разгрузки. Помоги в этом — перехватывай грузовые флоты и допрашивай любой [em]Подозрительный корабль[/em]. Посмотрим, удастся ли нам собрать разведданные.

problem-default-drugsmugglers-step1-complete: Контрабандисты Сока получили по заслугам. Хорошая работа.
problem-drum-drugsmugglers-step1-complete: BEGIN TRANSLATION --[ Контрабандисты Сока наказаны. Хорошая работа. ]-- END TRANSLATION

problem-default-drugsmugglers-step2-summary: "Найти и устроить рейд на известные точки наркоторговли в поясе"
problem-default-drugsmugglers-step2-desc: |
 [h1]Контрабандисты Сока[/h1]
 [h2]Доставка Сока[/h2]
 Предыдущая часть операции прошла успешно. С твоей помощью мы уничтожили ряд партий Сока и получили наводки на места производства этой дряни в системе. Следующий шаг — рейд на пункты распространения по наводкам с грузовиков. Космической полиции нужна помощь в проведении этих рейдов. Подбери агентов на [em]Станции[/em] и доставь их в [em]Известная точка наркоторговли[/em] для рейда на станции.

