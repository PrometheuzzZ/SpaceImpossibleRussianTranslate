 [h1]Внесолнечная энергетическая лента[/h1]
 [h2]Корабли, разбитые лентой[/h2]
 Сообщения о кораблях в бедствии резко участились. Местные власти не уверены в причине и просят помощи у местных капитанов. Посети [em]Сигналы бедствия[/em] и собери всю доступную разведданную.

