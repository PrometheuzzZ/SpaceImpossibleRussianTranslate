problem-default-rogueeugenics-step1-summary: "Связаться и забрать журналы данных станций"
problem-default-rogueeugenics-step1-desc: |
 [h1]Учёный-отступник выводит евгенические аберрации[/h1]
 [h2]Тишина на научном фронте[/h2]
 Несколько специализированных исследовательских станций недавно затихли. Это не совсем неслыханно, но даже их каналы обмена данными едва передают последние результаты, что необычно. Ты можешь помочь, посетив каждый [em]Исследовательский комплекс[/em] и забрав их журналы данных для анализа.

