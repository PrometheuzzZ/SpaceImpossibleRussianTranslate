#Ancient Relics ==============================================================================================================
problem-default-ancientrelics-title: "Древние реликвии войны"
problem-default-ancientrelics-step1-summary: "Уничтожить странно светящиеся астероиды"
problem-default-ancientrelics-step1-desc: |
 [h1]Древние реликвии войны[/h1]
 [h2]Случайное открытие[/h2]
 Известно, что мы не первый вид, обитающий в этом регионе космоса. Археологи годами находят их следы. Кто это был — мы не знаем точно, но знаем, что их давно нет. Оказывается, не все эти места — просто культурные диковинки. Недавняя добыча, по-видимому, активировала какой-то... отклик, что вызвало серьёзные повреждения от взрывов по всей системе. Мы идентифицировали ещё несколько таких вооружённых астероидов в наших [em]Шахтёрских аванпостах[/em], их нужно уничтожить, пока они не нанесли ещё больше вреда. Помоги уничтожить эти [em]Странно светящиеся астероиды[/em], пока никто больше не пострадал.


problem-default-ancientrelics-step1-complete: "Похоже, все проблемные астероиды нейтрализованы. Хорошая работа."
problem-drum-ancientrelics-step1-complete: "BEGIN TRANSLATION --[ Проблема с астероидами решена. Хорошая работа. ]-- END TRANSLATION"

problem-default-ancientrelics-step2-summary: "Перепрограммировать инопланетные аванпосты"
problem-default-ancientrelics-step2-desc: |
 [h1]Древние реликвии войны[/h1]
 [h2]От «удивления» к «тревоге»[/h2]
 Уничтожение опознанных заминированных астероидов сняло непосредственную угрозу. Однако усилилась активность в инопланетных диапазонах связи, которых мы раньше не видели. В долгое время считавшихся пустыми областях обнаружились инопланетные аванпосты, ретранслирующие этот сигнал. Их нужно остановить, пока не случилось то, что должно случиться. Помоги перепрограммировать эти [em]Древние ретрансляторы[/em], чтобы остановить их вещание.

problem-default-ancientrelics-step2-complete: "С остановленным вещанием это, надеюсь, отсечёт проблему до её ухудшения."
problem-drum-ancientrelics-step2-complete: "BEGIN TRANSLATION --[ Вещание остановлено. Проблема не ухудшилась. ]-- END TRANSLATION"

problem-default-ancientrelic-relay-hail1: "*короткий всплеск статики, за которым следуют повторяющиеся гудки*"
problem-default-ancientrelic-relay-opt-beginhack: --Передать встречный сигнал в старом двоичном стиле--
problem-default-ancientrelic-relay-hacksuc: "*короткое всплесковое сообщение затихает*. Ретрансляторная станция перепрограммирована. Ещё один успех."

problem-default-ancientrelics-step3-summary: "Уничтожить корабли-дроны"
problem-default-ancientrelics-step3-desc: |
 [h1]Древние реликвии войны[/h1]
 [h2]Что-то пробуждается[/h2]
 Ретрансляторные аванпосты успешно перепрограммированы. Они больше не вещают. Однако то, что они передавали, видимо, сработало: мы наблюдаем космический трафик там, где его никогда не было. Дальние сканы предполагают, что это корабли-дроны, долго спавшие, теперь активные. Они могут оказать опустошительное воздействие, чего мы не можем допустить. Помоги уничтожить [em]Древние корабли-дроны[/em], пока они не натворили бед в системе.

problem-default-ancientrelics-step3-complete: "Эти корабли точно дали бой. Нам повезло, что их создателей больше нет. Спасибо за помощь, капитан."
problem-drum-ancientrelics-step3-complete: "BEGIN TRANSLATION --[ Корабли дрались упорно. Повезло, создателей нет. Спасибо, Капитан. ]-- END TRANSLATION"

problem-default-ancientrelics-opt-getbuff: Станция, я готов получить награду.
problem-default-ancientrelics-givebuff: После всех бед, что натворили эти древние машины, мы рады это вручить.
problem-drum-ancientrelics-givebuff: BEGIN TRANSLATION --[ Да, Капитан. Благодарность принимается. ]-- END TRANSLATION

#Space Wasp Infestation ==============================================================================================================
problem-default-spacewasps-title: "Нашествие космических ос"
problem-default-spacewasps-step1-summary: "Найти и уничтожить космические ульи"
problem-default-spacewasps-step1-desc: |
 [h1]Нашествие космических ос[/h1]
 [h2]Что это за гул?[/h2]
 Поступают сообщения о странном гуле, резонирующем в производственном оборудовании и мешающем работе, как сообщают рабочие. Это проблема, ведь данный участок производства жизненно важен для поддержания выработки, установленной Управлением по добропорядочности и пропускной способности производства. Помоги обследовать [em]Производственные станции[/em] и, по возможности, устранить причину этого гула во всей системе.

problem-default-spacewasps-step1-complete: Эти заводские рабочие будут вечно благодарны. Никто не любит иметь дело с космическими осами.
problem-drum-spacewasps-step1-complete: BEGIN TRANSLATION --[ Рабочие счастливы. Ос нет. ]-- END TRANSLATION
problem-default-spacewasps-clearstation-header: Очищенная станция

problem-default-spacewasps-clearstation-header: Станция без ос
problem-default-spacewasps-clearstation-text: Спасибо, капитан. Ты не представляешь, какое это облегчение — избавиться от этих ос.

problem-default-spacewasps-step2-summary: "Победить рабочих и добыть желе"
problem-default-spacewasps-step2-desc: |
 [h1]Нашествие космических ос[/h1]
 [h2]Маточное желе — обязательно[/h2]
 Это не первый раз, когда космических ос замечают в этом квадранте. К сожалению, и не последний. Раз уж так — давай воспользуемся возможностью добыть Маточное желе. У этого желе странные биоморфные свойства, ради которых любой учёный готов отдать левую руку. Лети в любое [em]Астероидное поле[/em], найди немного этого желе, добудь его и доставь на ближайшую станцию.

problem-default-spacewasps-step2-opt-handin: У меня есть желе для сдачи.
problem-default-spacewasps-step2-suc: Желе принято. Выглядит вкусно.
problem-drum-spacewasps-step2-suc: BEGIN TRANSLATION --[ Желе принято. Выглядит хорошо. ]-- END TRANSLATION
problem-default-spacewasps-step2-complete: Хорошая работа, капитан. У нас желе хватит на годы работы.
problem-drum-spacewasps-step2-complete: BEGIN TRANSLATION --[ Капитан, хорошая работа. Желе на годы. ]-- END TRANSLATION

problem-default-spacewasps-step3-summary: "Уничтожить королеву и улей"
problem-default-spacewasps-step3-desc: |
 [h1]Нашествие космических ос[/h1]
 [h2]Королева в ярости[/h2]
 Королевы ос пришли в движение. Именно так. Их несколько. Наши специалисты предполагают, что они узнали о краже Маточного желе и теперь свирепствуют. Каждая королева, по сообщениям, движется на варпе со своими личными ульями и королевской свитой. Останови одну из них сейчас, пока она не нанесла необратимый ущерб.

problem-default-spacewasps-step3-complete: Спасибо за всю работу, капитан. Эти космические осы повержены. Надеюсь, они никогда не вернутся. Ох... ненавижу это жужжание.
problem-drum-spacewasps-step3-complete: BEGIN TRANSLATION --[ Спасибо, Капитан. Осы исчезли. Надеюсь, навсегда. Ненавижу жужжание. ]-- END TRANSLATION
problem-default-spacewasps-hail: [i][cccccc]Каналы связи открыты, но всё, что слышно, — интенсивный гул разъярённых космических ос[-][/i]

