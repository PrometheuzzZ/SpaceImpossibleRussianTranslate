distress-sixiser-case3-cantow: "Могу отбуксировать вас к ближайшей звёздной базе. Там позаботятся о вас. [Требуется оснащённый [url=codex://codex.intermediate.tractoring]Тяговый луч[/url]]"
distress-sixiser-case3-takepeople: "На борту есть место. Вам придётся выйти в EVA, но я вас подберу и доставлю домой."
distress-sixiser-case3-peoplespawn: "Мы покинули корабль и сейчас в режиме EVA. Пожалуйста, подберите нас."
distress-sixiser-case3-nohelp: "Надо было нанимать нормальный корабль. Сожалею, помочь не смогу."

#Случай 4
distress-sixiser-case4: "Бип-бип. Данный корабль испытывает критическую неисправность, из-за которой не может функционировать. Устраните неисправность или отбуксируйте корабль на ближайшую дружественную космическую станцию. Это автоматический сигнал бедствия. Активен 99 лет, 4 месяца, 6 дней, 12 часов и 32 минуты."
distress-sixiser-case4-cando: "Посмотрим, что можно сделать с этими ледяными плитами. Растоплю в два счёта."
distress-sixiser-case4-success1: "Биип. Система сигнала бедствия обнаружила, что корабль освобождён от внешних помех и способен работать на собственной тяге. Ожидайте оповещения экипажа...[долгая пауза] Экипаж не отвечает. Отбуксируйте корабль в ближайшее безопасное место и оповестите владельцев."
distress-sixiser-case4-cantow: "Отбуксирую, конечно."
distress-sixiser-case4-notow: "Не думаю, компьютер. Теперь этот корабль мой."
distress-sixiser-case4-shipturnin: "Отличная находка, Капитан. Сообщу владельцам о вашем участии."

#Случай 5
distress-sixiser-case5-header: "Корабль атакован"
distress-sixiser-case5: "Помогите! Нас атакуют! Здесь звёздный корабль {vesselname}. Капитан убит, и теперь нас атакует его семья."
distress-sixiser-case5-moreinfo: "Как погиб Капитан?"
distress-sixiser-case5-moreinfo2: "Капитан {captname} был военным преступником на нашей планете. Ему однажды удалось избежать правосудия, но на этот раз мы всё исправили. Однако он успел послать сигнал бедствия, и теперь нас атакуют! Пожалуйста, помогите!"
distress-sixiser-case5-attacker1: "Чего надо, мы заняты"
distress-sixiser-case5-attackerbribe: "На, возьми Ⱡ1000 в качестве компенсации и уходи. Эта драка не стоит затраченных усилий."
distress-sixiser-case5-attackerbribe-fail: "Ха, у тебя даже нет такой суммы"
distress-sixiser-case5-attackerbribe-success: "Ты прав, эта драка того не стоит. Ваша выплата с лихвой покрывает наши расходы."
distress-sixiser-case5-success: "Спасибо, что вытащили меня оттуда, Капитан! Вы поступили правильно и отстояли справедливость для нашей планеты. Возьмите это как знак нашей благодарности."

#Случай 6
distress-sixiser-case6: "Это сигнал бедствия. Наш корабль {vesselname} нуждается в помощи. Реактор похитили неизвестные пришельцы, и нам нужен {item-base:item.part.reactor} для продолжения пути."
