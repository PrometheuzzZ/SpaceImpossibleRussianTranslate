distress-ticeroy-case12-canhelp: "Не волнуйтесь, я помогу. У атакующих нет шансов."
distress-ticeroy-case12-nohelp: "Ты заслуживаешь всего, что тебя ждёт. Умри!"

#Случай 13
distress-ticeroy-case13: "Здесь корабль {vesselname} под командованием Капитана {name}. Во время отдыха мы следовали за кометой и оказались скованы льдом. Прошу оказать помощь."
distress-ticeroy-case13-cantow: "Могу помочь. Отбуксирую вас на ближайшую космическую станцию для дальнейшей помощи. [Требуется оснащённый [url=codex://codex.intermediate.tractoring]Тяговый луч[/url]]"
distress-ticeroy-case13-canhelp: "Вам повезло. Уберу этот лёд в два счёта."
distress-ticeroy-case13-attack: "Ты будешь отличной мишенью для тренировки. Готовься к встрече с открытым космосом."

#Случай 14
distress-ticeroy-case14: "Капитан, нужна ваша помощь. Здесь {vesselname} — у нас катастрофические проблемы с двигателем. Похоже, предыдущий владелец фальсифицировал журнал техобслуживания, и теперь мы за это расплачиваемся."
distress-ticeroy-case14-spareparts: "У меня есть запасные детали двигателя. [Требуется: {item-base:item.part.engine}]"
distress-ticeroy-case14-spareparts-success: "Это поможет временно справиться. Спасибо за помощь."

#Случай 15
distress-ticeroy-case15-header: "Сигнал бедствия"
distress-ticeroy-case15: "Здесь космическая станция {vesselname}. Мы получили серьёзные повреждения в результате неожиданного метеоритного шторма. Есть раненые, которых нужно доставить на любую ближайшую станцию. Поможете?"
distress-ticeroy-case15-takepeople: "Могу забрать ваших эвакуированных."
distress-ticeroy-case15-peoplespawn: "Мы покинули корабль и сейчас в режиме EVA. Пожалуйста, подберите нас."
distress-ticeroy-case15-crewgone: "[i][cccccc]Канал связи открыт, но они слишком заняты ремонтом, чтобы ответить[-][/i]"

#Случай 16
distress-ticeroy-case16: "Привет, Капитан. Здесь станция {vesselname}. Мы лишились оружия из-за перегрузки питания. У вас есть лишний {item-base:item.part.weapon}?"
distress-ticeroy-case16-weaponparts: "Могу дать запчасти для оружия. [Требуется: 1 x {item-base:item.part.weapon}]"
distress-ticeroy-case16-partthanks: "Спасибо за детали. Они подойдут."
distress-ticeroy-case16-plunder: "Ты только что признался, что беззащитен. Заплати Ⱡ100, иначе проверим прочность твоего корпуса."
distress-ticeroy-case16-vesselhandin: "Спасибо, Капитан, за доставку корабля. Позаботимся о нём."
distress-ticeroy-case16-prisonershandin: "Хорошая работа. Ещё один корабль отбит у пиратов — ещё один плюс в безопасности системы."

#Жертва Левиафана
distress-default-leviathan: "Помогите! Наконец-то корабль! Я застрял здесь уже давно. Можете показать путь к выходу?"
distress-default-leviathan-moreinfo: "Что случилось?"
distress-default-leviathan-moreinfo2: "Я просто следовал по обычному торговому маршруту, понимаете? Всё было нормально, пока на радаре не появилась странная засветка. Не успел я разобраться, как над кораблём нависла огромная тень — словно ниоткуда. Прежде чем я понял, что происходит, я уже застрял здесь и не мог уйти в варп."
distress-default-leviathan-cantow: "Могу отбуксировать вас на ближайшую космическую станцию за помощью. [Требуется оснащённый Тяговый луч]"
distress-default-leviathan-takepeople: "Могу забрать ваш экипаж отсюда."
distress-default-leviathan-peoplespawn: "Мы в режиме EVA. Можете забрать нас?"
distress-default-leviathan-nohelp: "Извините, я сосредоточен на собственном побеге."