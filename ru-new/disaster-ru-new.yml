distress-indtrad-requestbribe1: "Как жаль. Если не заплатите мне Ⱡ100 в течение минуты — покончу с вами."
distress-indtrad-aipaybribe1: "Сволочь... Ладно. Вот деньги. Теперь убирайся."
distress-indtrad-attack1: "Не беспокойтесь, вы ничего не почувствуете. Обещаю. *Зарядить оружие*"
distress-indtrad-canhelp1: "Не волнуйтесь, я их отобью."
distress-indtrad-nohelp2: "Ты заслуживаешь всего, что тебя ждёт. Умри!"
distress-indtrad-being-towed: "Ожидаем буксировки на звёздную базу."

#Случай 1
distress-indtrad-case1: "Капитан, здесь {vesselname}. Только что пришлось подавить мятеж. К сожалению, экипаж успел нанести серьёзный ущерб кораблю, выведя из строя реактор. Нужна буксировка или запасные детали реактора, чтобы снова встать на ход."
distress-indtrad-case1-reactorparts: "Думаю, у меня есть запасные детали реактора для вас. [Требуется: 1 x {item-base:item.part.engine}]"
distress-indtrad-case1-partthanks: "Именно то, что нужно. Буду на ходу через мгновение, как только установка завершится."

#Случай 3
distress-indtrad-case3: "Помогите! Здесь корабль {vesselname}. Наш пилот погиб — АвтоМед отказал во время ионного шторма."
distress-indtrad-case3-moreinfo: "Как погиб пилот?"
distress-indtrad-case3-moreinfo2: "АвтоМед загорелся, и когда пилот пошла тушить огонь — оказалась в ловушке пожара. Мы едва спаслись, но застряли в грузовом отсеке. Пожалуйста, помогите!"
distress-indtrad-case3-cantow: "Могу отбуксировать вас к ближайшей звёздной базе. Там позаботятся о вас. [Требуется оснащённый [url=codex://codex.intermediate.tractoring]Тяговый луч[/url]]"
distress-indtrad-case3-takepeople: "На борту есть место. Вам придётся выйти в EVA, но я вас подберу и доставлю домой."
distress-indtrad-case3-peoplespawn: "Мы покинули корабль и сейчас в режиме EVA. Пожалуйста, подберите нас."
distress-indtrad-case3-nohelp: "Надо было нанимать нормальный корабль. Сожалею, помочь не смогу."

#Случай 4
distress-indtrad-case4: "Бип-бип. Данный корабль испытывает критическую неисправность, из-за которой не может функционировать. Устраните неисправность или отбуксируйте корабль на ближайшую дружественную космическую станцию. Это автоматический сигнал бедствия. Активен 99 лет, 4 месяца, 6 дней, 12 часов и 32 минуты."
distress-indtrad-case4-cando: "Посмотрим, что можно сделать с этими ледяными плитами. Растоплю в два счёта."
distress-indtrad-case4-success1: "Биип. Система сигнала бедствия обнаружила, что корабль освобождён от внешних помех и способен работать на собственной тяге. Ожидайте оповещения экипажа...[долгая пауза] Экипаж не отвечает. Отбуксируйте корабль в ближайшее безопасное место и оповестите владельцев."
distress-indtrad-case4-cantow: "Отбуксирую, конечно."
distress-indtrad-case4-notow: "Не думаю, компьютер. Теперь этот корабль мой."
distress-indtrad-case4-shipturnin: "Отличная находка, Капитан. Сообщу владельцам о вашем участии."

#Случай 5
distress-indtrad-case5-header: "Корабль атакован"
distress-indtrad-case5: "Помогите! Нас атакуют! Здесь звёздный корабль {vesselname}. Капитан убит, и теперь нас атакует его семья."
distress-indtrad-case5-moreinfo: "Как погиб Капитан?"
distress-indtrad-case5-moreinfo2: "Капитан {captname} был военным преступником на нашей планете. Ему однажды удалось избежать правосудия, но на этот раз мы всё исправили. Однако он успел послать сигнал бедствия, и теперь нас атакуют! Пожалуйста, помогите!"
distress-indtrad-case5-attacker1: "Чего надо, мы заняты"
distress-indtrad-case5-attackerbribe: "На, возьми Ⱡ1000 в качестве компенсации и уходи. Эта драка не стоит затраченных усилий."
distress-indtrad-case5-attackerbribe-fail: "Ха, у тебя даже нет такой суммы"
distress-indtrad-case5-attackerbribe-success: "Ты прав, эта драка того не стоит. Ваша выплата с лихвой покрывает наши расходы."
distress-indtrad-case5-success: "Спасибо, что вытащили меня оттуда, Капитан! Вы поступили правильно и отстояли справедливость для нашей планеты. Возьмите это как знак нашей благодарности."

#Случай 6
distress-indtrad-case6: "Это сигнал бедствия. Наш корабль {vesselname} нуждается в помощи. Реактор похитили неизвестные пришельцы, и нам нужен {item-base:item.part.reactor} для продолжения пути."
distress-indtrad-case6-tractorresp: "Как жаль, Капитан. Могу скоро отбуксировать вас к ближайшей звёздной базе. [Требуется оснащённый [url=codex://codex.intermediate.tractoring]Тяговый луч[/url]]"
distress-indtrad-case6-parts: "Вам повезло, Капитан. У меня есть нужные детали. Приготовьтесь к приёму. [Требуется: 1 x {item-base:item.part.reactor}]"
distress-indtrad-case6-partthanks: "Именно то, что нужно, Капитан. Скоро выдвинемся. {vesselname} конец связи."

#Случай 7
distress-indtrad-case7: "С.О.С.! Здесь корабль {vesselname}. Меня зовут {name}, экипаж мёртв или пропал! Мы застряли на борту!"
distress-indtrad-case7-moreinfo1: "Что случилось?"
distress-indtrad-case7-moreinfo2: "Похоже, непоседливый ребёнок Капитана разгерметизировал грузовой отсек, когда внутри была большая часть экипажа. Все они погибли в космосе. Мы понятия не имеем, как управлять кораблём. Можете доставить нас на ближайшую станцию?"
distress-indtrad-case7-cantow: "Конечно, могу отбуксировать. [Требуется оснащённый [url=codex://codex.intermediate.tractoring]Тяговый луч[/url]]"
distress-indtrad-case7-takepeople: "Могу перевезти ваших людей. Прошу на борт."
distress-indtrad-case7-peoplespawn: "Мы покинули корабль и сейчас в режиме EVA. Пожалуйста, подберите нас."

#Случай 8
distress-indtrad-case8: "Здесь {vesselname}. На борту произошёл взрыв. Капитан и инженер мертвы. Нужна помощь."
distress-indtrad-case8-cantow: "Как жаль, Капитан. Могу скоро отбуксировать вас к ближайшей звёздной базе. [Требуется оснащённый [url=codex://codex.intermediate.tractoring]Тяговый луч[/url]]"

#Случай 9
distress-indtrad-case9: "Здесь корабль {vesselname}. После столкновения мы застряли в астероиде. Манёвр невозможен, требуется извлечение. Помогите."
distress-indtrad-case9-cando: "Сделаем. Освобожу вас в два счёта."
distress-indtrad-case9-success: "Отлично, Капитан. Спасибо за помощь. Вот запасные детали, которые могут пригодиться."

#Случай 10
distress-indtrad-case10: "Здесь тюремный корабль {vesselname}. Перевозим нескольких буйных пассажиров — они попытались поднять бунт. Корабль выведен из строя, просим доставить заключённых на ближайшую станцию для дальнейшего разбирательства."
distress-indtrad-case10-takepeople: "{vesselname}, могу перевезти ваших заключённых. Отправляйте."
distress-indtrad-case10-peoplespawn: "Заключённые выброшены и готовы к подбору"

#Случай 11
distress-indtrad-case11: "Капитан! Хорошо, что вы появились. Рядом произошла катастрофа, а мне нужно возвращаться. Трюм полон выжившими — можете доставить их на ближайшую звёздную базу?"
distress-indtrad-case11-takepeople: "{vesselname}, я возьму выживших."
distress-indtrad-case11-peoplespawn: "Вот они, удачи!"
distress-indtrad-case11-attackresp: "Что? Нет! Мы мирный корабль. Пожалуйста!"

#Случай 12
distress-indtrad-case12-header: "Корабль атакован"
distress-indtrad-case12: "Тревога! Здесь {vesselname} — исследовательский корабль. Нас атакуют неизвестные агрессоры. Помогите!"
distress-indtrad-case12-canhelp: "Не волнуйтесь, я помогу. У атакующих нет шансов."
distress-indtrad-case12-nohelp: "Ты заслуживаешь всего, что тебя ждёт. Умри!"

#Случай 13
distress-indtrad-case13: "Здесь корабль {vesselname} под командованием Капитана {name}. Во время отдыха мы следовали за кометой и оказались скованы льдом. Прошу оказать помощь."
distress-indtrad-case13-cantow: "Могу помочь. Отбуксирую вас на ближайшую космическую станцию для дальнейшей помощи. [Требуется оснащённый [url=codex://codex.intermediate.tractoring]Тяговый луч[/url]]"
distress-indtrad-case13-canhelp: "Вам повезло. Уберу этот лёд в два счёта."
distress-indtrad-case13-attack: "Ты будешь отличной мишенью для тренировки. Готовься к встрече с открытым космосом."

#Случай 14
distress-indtrad-case14: "Капитан, нужна ваша помощь. Здесь {vesselname} — у нас катастрофические проблемы с двигателем. Похоже, предыдущий владелец фальсифицировал журнал техобслуживания, и теперь мы за это расплачиваемся."
distress-indtrad-case14-spareparts: "У меня есть запасные детали двигателя. [Требуется: {item-base:item.part.engine}]"
distress-indtrad-case14-spareparts-success: "Это поможет временно справиться. Спасибо за помощь."

#Случай 15
distress-indtrad-case15-header: "Сигнал бедствия"
distress-indtrad-case15: "Здесь космическая станция {vesselname}. Мы получили серьёзные повреждения в результате неожиданного метеоритного шторма. Есть раненые, которых нужно доставить на любую ближайшую станцию. Поможете?"
distress-indtrad-case15-takepeople: "Могу забрать ваших эвакуированных."
distress-indtrad-case15-peoplespawn: "Мы покинули корабль и сейчас в режиме EVA. Пожалуйста, подберите нас."
distress-indtrad-case15-crewgone: "[i][cccccc]Канал связи открыт, но они слишком заняты ремонтом, чтобы ответить[-][/i]"

#Случай 16
distress-indtrad-case16: "Привет, Капитан. Здесь станция {vesselname}. Мы лишились оружия из-за перегрузки питания. У вас есть лишний {item-base:item.part.weapon}?"
distress-indtrad-case16-weaponparts: "Могу дать запчасти для оружия. [Требуется: 1 x {item-base:item.part.weapon}]"
distress-indtrad-case16-partthanks: "Спасибо за детали. Они подойдут."
distress-indtrad-case16-plunder: "Ты только что признался, что беззащитен. Заплати Ⱡ100, иначе проверим прочность твоего корпуса."
distress-indtrad-case16-vesselhandin: "Спасибо, Капитан, за доставку корабля. Позаботимся о нём."
distress-indtrad-case16-prisonershandin: "Хорошая работа. Ещё один корабль отбит у пиратов — ещё один плюс в безопасности системы."

