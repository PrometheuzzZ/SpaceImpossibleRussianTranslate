#Случай 1
distress-default-case1: "Капитан, здесь {vesselname}. Только что пришлось подавить мятеж. К сожалению, экипаж успел нанести серьёзный ущерб кораблю, выведя из строя реактор. Нужна буксировка или запасные детали реактора, чтобы снова встать на ход."
distress-default-case1-reactorparts: "Думаю, у меня есть запасные детали реактора для вас. [Требуется: 1 x {item-base:item.part.engine}]"
distress-default-case1-partthanks: "Именно то, что нужно. Буду на ходу через мгновение, как только установка завершится."

#Случай 3
distress-default-case3: "Помогите! Здесь корабль {vesselname}. Наш пилот погиб — АвтоМед отказал во время ионного шторма."
distress-default-case3-moreinfo: "Как погиб пилот?"
distress-default-case3-moreinfo2: "АвтоМед загорелся, и когда пилот пошла тушить огонь — оказалась в ловушке пожара. Мы едва спаслись, но застряли в грузовом отсеке. Пожалуйста, помогите!"
distress-default-case3-cantow: "Могу отбуксировать вас к ближайшей звёздной базе. Там позаботятся о вас. [Требуется оснащённый [url=codex://codex.intermediate.tractoring]Тяговый луч[/url]]"
distress-default-case3-takepeople: "На борту есть место. Вам придётся выйти в EVA, но я вас подберу и доставлю домой."
distress-default-case3-peoplespawn: "Мы покинули корабль и сейчас в режиме EVA. Пожалуйста, подберите нас."
distress-default-case3-nohelp: "Надо было нанимать нормальный корабль. Сожалею, помочь не смогу."

#Случай 4
distress-default-case4: "Бип-бип. Данный корабль испытывает критическую неисправность, из-за которой не может функционировать. Устраните неисправность или отбуксируйте корабль на ближайшую дружественную космическую станцию. Это автоматический сигнал бедствия. Активен 99 лет, 4 месяца, 6 дней, 12 часов и 32 минуты."
distress-default-case4-cando: "Посмотрим, что можно сделать с этими ледяными плитами. Растоплю в два счёта."
distress-default-case4-success1: "Биип. Система сигнала бедствия обнаружила, что корабль освобождён от внешних помех и способен работать на собственной тяге. Ожидайте оповещения экипажа...[долгая пауза] Экипаж не отвечает. Отбуксируйте корабль в ближайшее безопасное место и оповестите владельцев."
distress-default-case4-cantow: "Отбуксирую, конечно."
distress-default-case4-notow: "Не думаю, компьютер. Теперь этот корабль мой."
distress-default-case4-shipturnin: "Отличная находка, Капитан. Сообщу владельцам о вашем участии."

#Случай 5
distress-default-case5-header: "Корабль атакован"
distress-default-case5: "Помогите! Нас атакуют! Здесь звёздный корабль {vesselname}. Капитан убит, и теперь нас атакует его семья."
distress-default-case5-moreinfo: "Как погиб Капитан?"
distress-default-case5-moreinfo2: "Капитан {captname} был военным преступником на нашей планете. Ему однажды удалось избежать правосудия, но на этот раз мы всё исправили. Однако он успел послать сигнал бедствия, и теперь нас атакуют! Пожалуйста, помогите!"
distress-default-case5-attacker1: "Чего надо, мы заняты"
distress-default-case5-attackerbribe: "На, возьми Ⱡ1000 в качестве компенсации и уходи. Эта драка не стоит затраченных усилий."
distress-default-case5-attackerbribe-fail: "Ха, у тебя даже нет такой суммы"
distress-default-case5-attackerbribe-success: "Ты прав, эта драка того не стоит. Ваша выплата с лихвой покрывает наши расходы."
distress-default-case5-success: "Спасибо, что вытащили меня оттуда, Капитан! Вы поступили правильно и отстояли справедливость для нашей планеты. Возьмите это как знак нашей благодарности."

#Случай 6
distress-default-case6: "Это сигнал бедствия. Наш корабль {vesselname} нуждается в помощи. Реактор похитили неизвестные пришельцы, и нам нужен {item-base:item.part.reactor} для продолжения пути."
distress-default-case6-tractorresp: "Как жаль, Капитан. Могу скоро отбуксировать вас к ближайшей звёздной базе. [Требуется оснащённый [url=codex://codex.intermediate.tractoring]Тяговый луч[/url]]"
distress-default-case6-parts: "Вам повезло, Капитан. У меня есть нужные детали. Приготовьтесь к приёму. [Требуется: 1 x {item-base:item.part.reactor}]"
distress-default-case6-partthanks: "Именно то, что нужно, Капитан. Скоро выдвинемся. {vesselname} конец связи."

#Случай 7
distress-default-case7: "С.О.С.! Здесь корабль {vesselname}. Меня зовут {name}, экипаж мёртв или пропал! Мы застряли на борту!"
distress-default-case7-moreinfo1: "Что случилось?"
distress-default-case7-moreinfo2: "Похоже, непоседливый ребёнок Капитана разгерметизировал грузовой отсек, когда внутри была большая часть экипажа. Все они погибли в космосе. Мы понятия не имеем, как управлять кораблём. Можете доставить нас на ближайшую станцию?"
distress-default-case7-cantow: "Конечно, могу отбуксировать. [Требуется оснащённый [url=codex://codex.intermediate.tractoring]Тяговый луч[/url]]"
distress-default-case7-takepeople: "Могу перевезти ваших людей. Прошу на борт."
distress-default-case7-peoplespawn: "Мы покинули корабль и сейчас в режиме EVA. Пожалуйста, подберите нас."

#Случай 8
distress-default-case8: "Здесь {vesselname}. На борту произошёл взрыв. Капитан и инженер мертвы. Нужна помощь."
distress-default-case8-cantow: "Как жаль, Капитан. Могу скоро отбуксировать вас к ближайшей звёздной базе. [Требуется оснащённый [url=codex://codex.intermediate.tractoring]Тяговый луч[/url]]"

#Случай 9
distress-default-case9: "Здесь корабль {vesselname}. После столкновения мы застряли в астероиде. Манёвр невозможен, требуется извлечение. Помогите."
