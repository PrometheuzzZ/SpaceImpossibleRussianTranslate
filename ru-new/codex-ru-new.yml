codex-basics-vesseloverlay-body: |
 [h1]Осмотр[/h1]
 
 Наведите курсор на корабль и удерживайте {key-actionprimary}, чтобы открыть панель осмотра. В ней отображается название корабля, инвентарь, характеристики, доступные действия и активируется [i]Оверлей корабля[/i]. Свой корабль можно осмотреть с помощью {key-toggleinventory}. Панель вашего корабля находится справа, а другого — слева.
 
 [h2]Оверлей корабля[/h2]
 [img]moddata://base/art/codex/paperdoll.png[/img]
 Оверлей корабля отображается поверх корабля. Он показывает текущие [url=codex://codex.basics.components]Компоненты[/url], [url=codex://codex.basics.mounts]Крепления[/url] и зоны действия $weap$Оружия, $shield$Щитов, $hangar$Ангаров и $assembl$Сборщиков. Главная функция оверлея — возможность менять Компоненты в Креплениях без необходимости использовать $assembl$[url=codex://codex.components.assembler]Сборщик[/url].
 
 [h2]Просмотр крупных кораблей[/h2]
 Управляя крупным кораблём, может понадобиться перемещать камеру для лучшего обзора. При открытом осмотре и активном оверлее удерживайте {key-leftctrl} и перетаскивайте вид с помощью {key-mouse0} — это особенно полезно при крупном масштабе и размещении компонентов. Отпустив {key-leftctrl}, камера вернётся к центру корабля.
 
 [h2]Управление оверлеем[/h2]
 В верхней части соответствующего инвентаря находятся переключатели, позволяющие управлять отображением оверлея.
 
 [img]moddata://base/art/codex/astralcontrols.png[/img]
 Слева направо:
 [list]
 [*]Центр масс: отображает центр масс — полезен при строительстве и помогает понять, почему корабль летит неровно
 [*]Центр тяги: отображает средний центр тяги; если он сильно смещён от центра масс, корабль не полетит прямо
 [*]Индикаторы дальности: переключает видимость зон оружия, щитов и т.д. Три режима: Выкл, Всегда и Авто — показывает только актуальные зоны
 [*]Оверлей питания: переключает видимость оверлея питания. Три режима: Выкл, Всегда и Авто — только при наведении на реакторы
 [/list]
 
 Подробнее в [url=codex://codex.basics.equippingcomponents]Установка компонентов[/url].

codex-basics-locatemanufacturing-body: |
 [h1]Поиск производства[/h1]
 Получили первую руду или другой ресурс? Пора пустить его в дело.
 
 Для производства кораблю необходим $lab$[url=codex://codex.components.labs]Фабрикатор[/url]. В начале игры молодому капитану, скорее всего, придётся пользоваться фабрикатором ближайшей станции.
 
 Наличие фабрикатора легко проверить, осмотрев корабль — ищите фиолетовый молоток.
 [img]moddata://base/art/codex/manubutton.png[/img]
 Нажмите на него, чтобы открыть Производство.
 
 Подробнее в [url=codex://codex.basics.manufacturing]Основы производства[/url]

codex-basics-firstwarp-body: |
  [h1]Покидаем регион[/h1]
  Впереди вас ждёт куда больше, чем этот маленький уголок космоса. Чтобы путешествовать на большие расстояния, вам понадобится варп.
  
  Нажмите кнопку «ВАРП» или клавишу {key-warp}, чтобы начать подготовку варп-двигателей к прыжку. Как только подготовка завершится, корабль автоматически уйдёт в варп.
  
  ПРИМЕЧАНИЕ: Если во время подготовки к прыжку корабль потеряет одну или несколько плиток, процесс будет прерван.
  
  Подробнее в [url=codex://codex.basics.systemview]Варп и навигация по звёздной системе[/url].

codex-basics-equippingcomponents-body: |
 [h1]Установка и замена компонентов[/h1]
 
 [img]moddata://base/art/codex/inventorycodex1.png[/img]
 
 [h3]Установка[/h3]
 Чтобы установить компонент в крепление, сначала возьмите его курсором (например, из инвентаря). Затем удерживайте {key-interact} над нужным креплением на оверлее. Если компонент подходит (и у вас есть соответствующий Доступ), он будет установлен в крепление и начнёт работать.
 
 [h3]Извлечение[/h3]
 Чтобы извлечь компонент из крепления, наведите курсор на крепление и удерживайте {key-interact}. Компонент окажется на курсоре. Его можно поместить в инвентарь, другое крепление или распорядиться иначе. {?scheme:Удерживая {key-leftshift} и нажав {key-interact} над креплением|Нажав {key-transfer} с выбранным креплением;} вы переместите компонент прямо в грузовой отсек вашего корабля (при наличии места).
 
 [h3]Замена[/h3]
 Компоненты можно менять напрямую, не опустошая крепление предварительно — при условии, что на курсоре находится только один компонент нужного типа; тогда компонент из крепления окажется на курсоре.
 
 [h3]Быстрая установка[/h3]
 Удерживая {key-leftctrl} и нажав {key-mouse0} на компоненте в любом инвентаре, вы поместите его в первое подходящее пустое крепление на вашем корабле. Если подходящих креплений нет, компонент останется в инвентаре.
 
 Сводка по компонентам — в [url=codex://codex.basics.components]Компоненты[/url].
 
 Информация о добыче компонентов — в [url=codex://codex.intermediate.componentrecovery]Восстановление компонентов[/url].

codex-intermediate-componentrecovery-body: |
 [h1]Восстановление компонентов[/h1]
 [img]moddata://base/art/codex/recovery.png[/img]
 На некоторых кораблях с ограниченным доступом или вне $assembl$Сборщика единственный способ извлечь компоненты — это Восстановление. Удерживайте {key-interact} на компоненте — процесс может занять несколько секунд. Будьте осторожны: это необратимо. Есть шанс, что компонент будет успешно освобождён, но есть и шанс, что он будет сломан и вы получите лишь его части.
 
 Сводка по компонентам — в [url=codex://codex.basics.components]Компоненты[/url].
 
 Основы установки — в [url=codex://codex.basics.equippingcomponents]Установка компонентов[/url].

codex-intermediate-combat-body: | 
 [h1]Продвинутый бой[/h1]
 Помимо знания [url=codex://codex.basics.combat]основ[/url], капитан может использовать ряд продвинутых боевых приёмов.
 
 [h2]Боевой сканер[/h2]
 Чтобы быстро найти ключевые компоненты врага, наведите курсор на его корабль и нажмите {key-actionprimary} — это откроет расположение всех важных компонентов в радиусе вокруг курсора.
 [img]moddata://base/art/codex/quickscan.png[/img]
 
 [h2]Разделённый экран прицеливания[/h2]
 Удерживая {key-leftshift} и нажав {key-actionprimary} на объекте, вы откроете его в режиме разделённого экрана прицеливания.
 [img]moddata://base/art/codex/splitscreen.png[/img]
 Разделённый экран удобен при атаке быстро движущихся или далёких целей — цель всегда остаётся на экране.
 
 Чем дальше враг, тем ниже качество захвата цели; при достижении нуля захват теряется и окно закрывается.
 
 Размер окна регулируется его рамкой; чтобы закрыть осмотр, нажмите X на рамке (обведён фиолетовым).
 
 Режим можно использовать совместно с Осмотром.

codex-intermediate-manufacturing-body: |
 [h1]Производство в деталях[/h1]
 
 [img]moddata://base/art/codex/manuwindow.png[/img]
 
 Интерфейс производства разделён на четыре основные секции сверху вниз:
 [list]
 [*][00ff4e]Выбор фабрикатора[-]
 [*][0cdaff]Выбор входа и выхода[-]
 [*][dd3f3f]Список рецептов текущего фабрикатора[-]
 [*][fffc00]Информация о выбранном рецепте[-]
 [*][c000ff]Выбор количества[-]
 [/list]
 
 [h2]Выбор фабрикатора[/h2]
 [img]moddata://base/art/codex/lablist.png[/img]
 В верхней части окна производства можно выбрать один из доступных фабрикаторов корабля с помощью {key-interact}. Если фабрикатор платный, отображается зелёный символ валюты [00ff33]Ⱡ[-]. При возникновении проблемы появится [ff0000]$exclaim$[-].
 
 [h2]Фабрикатор в работе[/h2]
 После запуска рецепта фабрикатор некоторое время обрабатывает задание (больше при большом количестве) и блокирует ввод до завершения.
 
 [img]moddata://base/art/codex/activelab.png[/img]
 
 [h3]Проблемы производства[/h3]
 [list]
 [*][ff0000]ОШИБКА: НЕДОСТАТОЧНО ЭНЕРГИИ[-]: Фабрикатор потерял питание и не может продолжать работу. Добавьте или замените реакторы для увеличения энергии.
 [*][ff0000]ОШИБКА: СЛОМАННОЕ КРЕПЛЕНИЕ[-]: Под фабрикатором недостаточно плиток. Восстановите их с помощью $assembl$Сборщика.
 [/list]
 ПРИМЕЧАНИЕ: Если выходной инвентарь заполнится во время работы фабрикатора, изготовленные предметы выпадут в космос рядом с кораблём.
 [h2]Выбор рецепта[/h2]
 При выборе фабрикатора список рецептов отображает все рецепты, доступные в нём.
 
 [img]moddata://base/art/codex/recipelist.png[/img]
 
 Нажмите {key-interact}, чтобы выбрать рецепт — его информация появится в нижней части окна. Запустить рецепт можно кнопкой [i]ИЗГОТОВИТЬ[/i] или двойным кликом. {?scheme: |Количество можно изменить с помощью {key-navigateh};}
 
 Список рецептов фильтруется строкой поиска или жёлтой кнопкой $manu$ — только те рецепты, которые можно изготовить прямо сейчас из имеющихся материалов.
 
 [h2]Информация о рецепте[/h2]
 Выбор рецепта отображает его информацию в нижней части окна.
 
 [img]moddata://base/art/codex/recipeinfo.png[/img]
 
 Здесь показаны необходимые входные материалы и получаемые результаты. Наведите курсор на предметы, чтобы узнать подробности. Если требуется оплата, она отображается на кнопке [i]ИЗГОТОВИТЬ[/i].
 
 Основы — в [url=codex://codex.basics.manufacturing]Основы производства[/url].

codex-intermediate-notes-body: |
 [h1]Заметки[/h1]
 
 [img]moddata://base/art/codex/notes.png[/img]
 
 Заметки — это личные текстовые записи, сохраняемые для каждого капитана. Можно написать несколько предложений: напоминание, пометку или всё, что может пригодиться в будущем.
 
 К заметке можно привязать систему и регион — те, где находится капитан в момент создания.
 
 Заметки можно редактировать и удалять.
 
 Другие капитаны не видят ваши заметки.

codex-intermediate-camlock-body: |
 [h1]Фиксация камеры[/h1]
 
 [img]moddata://base/art/codex/camlock.png[/img]
 
 Фиксация камеры привязывает вращение игровой камеры к вращению корабля капитана. Это может облегчить работу с [url=codex://codex.basics.vesseloverlay]Оверлеем корабля[/url]. Однако иногда это визуально неудобно, поэтому каждый капитан сам решает, что ему больше подходит.

codex-intermediate-flotsam-body: |
 [h1]Обломки[/h1]
 
 [img]moddata://base/art/codex/flotsam.png[/img]
 
 Обломки образуются, когда буксируемые объекты случайно теряются во время варп-прыжка. Их можно вернуть из этого временного региона, войдя в него и повторно захватив объект тракторным лучом.

codex-intermediate-access-body: |
 [h1]Доступ[/h1]
 
 [img]moddata://base/art/codex/access.png[/img]
 
 Каждый объект имеет настройки Доступа. Они определяют, что другие игроки или члены команды могут и не могут делать с этим объектом. Доступ актуален только в многопользовательском режиме.
 
 Для настройки доступа сначала необходимо получить владение объектом — обычно через кнопку «Взять во владение». Затем каждую категорию можно изменить.
 
 [h2]Категории[/h2]
 
 Управление — кто может брать управление и пилотировать объект (при наличии мостика)
 
 Строительство — можно ли вносить изменения в конструкцию
 
 Компоненты — можно ли добавлять или удалять компоненты
 
 Производство — можно ли использовать фабрикаторы для производства
 
 Инвентарь — можно ли получать доступ к инвентарю
 
 Стыковка — может ли этот объект (при наличии ангаров) принимать и отпускать другие объекты
 
 Сборщик — можно ли использовать Сборщик(и) объекта для строительства
 
 [h2]Настройки[/h2]
 Владелец — только владелец объекта может это делать
 
 Фракция — только связанная фракция может это делать, обычно для объектов ИИ
 
 Команда — только команда владельца (если есть) может это делать
 
 Публично — любой может это делать
 
 [h2]Отказ от владения[/h2]
 Если по какой-либо причине вы хотите отказаться от владения объектом (например, передать корабль другу), можно воспользоваться функцией [b]Отказаться от владения[/b]. После этого любой другой игрок сможет взять объект во владение.

codex-intermediate-teams-body: |
 [h1]Команды[/h1]
 
 Команды доступны в многопользовательском режиме. Они позволяют игрокам объединяться, делить ресурсы и проще находить друг друга во вселенной.
 
 Команда может присягнуть на верность фракции. Присяга даёт всем членам небольшой бонус к отношениям с этой фракцией на всё время членства в команде.
 
 [img]moddata://base/art/codex/teams1.png[/img]
 
 Чтобы создать команду, откройте панель Команды через кнопки в правом верхнем углу и нажмите «СОЗДАТЬ КОМАНДУ». Команде необходимо дать публичное имя; пароль — по желанию.
 
 После создания команды отображаются её данные и состав.
 
 [img]moddata://base/art/codex/teams2.png[/img]
 
 Имя и пароль команды можно изменить. Владелец команды может исключать игроков при необходимости.
 
 Чтобы покинуть команду, нажмите кнопку «ПОКИНУТЬ КОМАНДУ».
 
 Передача владения командой невозможна.

codex-assembly-tilecomponentlimits-body: |
 [h1]Лимиты плиток и креплений компонентов[/h1]
 [img]moddata://base/art/codex/buildlimits.png[/img]
 У каждого Сборщика есть ограничения: максимальное количество плиток, оружейных и неоружейных креплений компонентов. Крепления без установленных компонентов тоже учитываются.
 
 [h2]Советы по размещению[/h2]
 [list]
 [*]Плитки, крепления и краску можно размещать перетаскиванием{?scheme:\n[*]Удерживайте {key-leftshift} при размещении и перетаскивании для ровной линии| ;}
 [*]Удерживая {key-picker} и нажав {key-interact} на плитке/креплении, можно «подобрать» этот элемент в зависимости от текущего режима. В режиме краски будет выбран совпадающий цвет под курсором (при наличии этого цвета в инвентаре).
 [*]Для симметричных конструкций можно включить режим зеркального отражения кнопкой или клавишей {key-mirror}. Режимы: без зеркала, горизонтальное, вертикальное и оба.
 [/list]
 [h2]Увеличение размера[/h2]
 Не хватает места на сетке? Увеличьте её размер с помощью выпадающего списка слева:
 [list]
 [*]Микро 7x7
 [*]Маленький 15x15
 [*]Средний 31x31
 [*]Большой 63x63
 [*]Гигантский 127x127
 [/list]
 ПРИМЕЧАНИЕ: Если лишнее пространство не нужно, рекомендуется использовать меньший размер сетки для лучшей производительности.
