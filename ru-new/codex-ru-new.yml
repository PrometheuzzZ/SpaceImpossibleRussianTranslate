codex-basics: "Основы"
codex-basics-itempickup-title: "Подбор предметов"
codex-basics-itempickup-body: |
  [h1]Подбор предметов[/h1]
  [img]moddata://base/art/codex/itempickup.png[/img]
  Когда плитки разрушаются при добыче (или по другим причинам), предметы выпадают в открытый космос. Чтобы подобрать эти предметы, нужно находиться в радиусе досягаемости, затем нажать {key-pickupitems}. Это переместит ближайшие предметы в $cargo$[url=codex://codex.components.cargobay]Грузовые отсеки[/url] вашего корабля. Предметы, которые не вмещаются в грузовые отсеки, останутся в космосе.
  
  Радиус подбора предметов можно увеличить с помощью определённых [url=codex://codex.intermediate.enhancements]Улучшений[/url]
  
  
codex-basics-inventory-title: "Основы инвентаря"
codex-basics-inventory-body: |
  [h1]Основы инвентаря[/h1]
  [h2]Основы[/h2]
  Любой объект или корабль, имеющий хотя бы один $cargo$[url=codex://codex.components.cargobays]Грузовой отсек[/url], будет иметь Инвентарь. Инвентарь состоит из всех $cargo$Грузовых отсеков на этом корабле. Содержимое каждого $cargo$Грузового отсека можно просматривать отдельно, выбрав его из [00ff4e]верхней строки[-]. Выбор $cargo$Грузового отсека отобразит все [dd3f3f]Ячейки груза[-]. Ячейка груза может содержать до одного стека одного типа предмета.
  
  [img]moddata://base/art/codex/cargodisplay.png[/img]
  
  [h2]Перемещение предметов[/h2]
  Чтобы переместить предметы между ячейками груза, выделите предмет и нажмите {key-interact}. Это подберёт весь стек. Чтобы переместить стек с курсора в ячейку груза, нажмите {key-interact}, наведя курсор на нужную ячейку. Нажатие {key-split} при наведении на ячейку груза перенесёт один предмет из стека в ячейку. Если в ячейке уже есть предметы того же типа, они добавятся вплоть до максимального размера стека для данного предмета.
  
  Предметы можно перемещать между ячейками:
  [list]
  [*]Внутри одного Грузового отсека
  [*]В другие Грузовые отсеки того же корабля
  [*]В груз другого проверяемого в данный момент корабля.
  [/list]
  Предметы можно добавить напрямую в $cargo$Грузовой отсек, не переключаясь на него, перетащив стек предметов на кнопку грузового отсека.
  
  [h3]Разделение[/h3]
  Стек предметов можно разделить пополам, нажав {key-split} над стеком в инвентаре. При этом половина предметов из стека окажется на курсоре.
  
  [h3]Быстрые действия[/h3]
  {?scheme:Удерживая {key-leftshift} и нажав {key-mouse0} над стеком предметов|Нажатие {key-transfer} при выделенном стеке предметов;} переместит его напрямую в первую доступную ячейку инвентаря другого корабля. Это значит, что если действие выполнено над Инвентарём проверяемого корабля — предмет переместится на ваш корабль, а если над предметом в вашем Инвентаре — то в Грузовые отсеки проверяемого корабля.{?scheme: Нажатие {key-mouse1} при удержании {key-leftshift} сделает то же самое, но только с одним предметом из стека под курсором.| ;}
  
  [h3]Выброс в космос[/h3]
  Предметы на курсоре можно выбросить в космос в позиции курсора с помощью {key-actionprimary}.
  
  
codex-basics-paperdoll-title: "Основы осмотра/Бумажная кукла"
codex-basics-paperdoll-body: |
  [h1]Осмотр[/h1]
  
  Наведя курсор на корабль, нажмите и удерживайте {key-actionprimary}, чтобы открыть панель Осмотра. Она отображает название корабля, Инвентарь, ряд характеристик корабля, доступные действия и активирует наложение [i]Бумажной куклы[/i]. Также можно осмотреть свой текущий корабль с помощью {key-toggleinventory}. Панель вашего корабля находится справа, панель другого корабля — слева.
  
  [h2]Наложение Бумажной куклы[/h2]
  [img]moddata://base/art/codex/paperdoll.png[/img]
  Наложение Бумажной куклы отображается поверх корабля. Оно показывает текущие [url=codex://codex.basics.components]Компоненты[/url], [url=codex://codex.basics.mounts]Установки[/url] и радиусы действия $weap$Оружия, $shield$Щитов, $hangar$Ангаров и $assembl$Сборщиков. Важнейшая функция наложения — возможность менять Компоненты в Установках без использования $assembl$[url=codex://codex.components.assembler]Сборщика[/url].
  
  [h2]Установка и замена компонентов[/h2]
  
  [img]moddata://base/art/codex/inventorycodex1.png[/img]
  
  [h3]Установка[/h3]
  Чтобы установить компонент в установку, сначала возьмите его курсором (например, из Инвентаря). Затем нажмите и удерживайте {key-interact} над нужной установкой на наложении. Если компонент подходит (и у вас есть соответствующий доступ), он будет помещён в установку и станет доступен для использования.
  
  [h3]Извлечение[/h3]
  Чтобы извлечь компонент из установки, наведите курсор на установку и нажмите и удерживайте {key-interact}. Компонент окажется на курсоре. Его можно поместить в Инвентарь, другую установку или иначе распорядиться им. {?scheme:Удержание {key-leftshift} при нажатии {key-interact} над установкой|Нажатие {key-transfer} при выбранной установке;} переместит компонент напрямую в грузовой отсек вашего корабля (если есть место).
  
  [h3]Восстановление[/h3]
  [img]moddata://base/art/codex/recovery.png[/img]
  На некоторых кораблях с ограниченным доступом, или вне $assembl$Сборщика, единственный способ извлечь компоненты — Восстановление. Нажмите и удерживайте {key-interact} на компоненте, это может занять несколько секунд. Есть шанс, что компонент будет освобождён, но также есть шанс, что он будет сломан и в результате выпадут только запчасти.
  
  [h3]Замена[/h3]
  Компоненты можно напрямую заменять, не опустошая установку, при условии, что на курсоре находится только один компонент подходящего типа — компонент из установки окажется на курсоре.
  
  [h3]Быстрая установка[/h3]
  Удержание {key-leftctrl} и нажатие {key-mouse0} над компонентом в любом инвентаре поместит его в первую подходящую пустую установку на вашем текущем корабле. Если подходящих установок нет, компонент останется в инвентаре.
  
  [h2]Просмотр крупных кораблей[/h2]
  Управляя крупным кораблём, бывает удобно передвигать камеру для лучшего обзора. При открытом Осмотре и активном наложении Бумажной куклы можно удерживать {key-leftctrl} и перетаскивать вид с помощью {key-mouse0} — это особенно удобно при увеличении и размещении компонентов. Отпустив {key-leftctrl}, вид вернётся к центру корабля.
  
  [h2]Управление наложением[/h2]
  В верхней части соответствующего инвентаря есть несколько переключателей для управления отображением на наложении Бумажной куклы.
  
  [img]moddata://base/art/codex/astralcontrols.png[/img]
  Слева направо:
  [list]
  [*]Центр масс: Показывает центр масс — полезно при строительстве, помогает понять, почему корабль кажется несбалансированным
  [*]Центр тяги: Показывает средний центр тяги; если он далеко от Центра масс, корабль не будет лететь прямо
  [*]Индикаторы радиуса: Переключает видимость радиусов оружия, щитов и т.д. Три режима: Выкл, Показать все и Авто (только актуальные радиусы)
  [*]Наложение питания: Переключает видимость наложения питания. Три режима: Выкл, Всегда показывать и Авто (только при наведении на реакторы)
  [/list]
codex-basics-mining-title: "Основы добычи"
codex-basics-mining-body: |
  [h1]Добыча[/h1]
  Астероиды — основной источник сырья. Можно добывать с астероидов ресурсы, подлетев в радиус действия $weap$[url=codex://codex.components.weapons]Оружия[/url] и нажав {key-actionsecondary} для прицеливания в плитку. Удержание {key-actionsecondary} позволяет оружию прицеливаться прямо на курсор.
  [img]moddata://base/art/codex/mining.png[/img]
  Когда [url=codex://codex.basics.tile]Плитка[/url] разрушается, она выбрасывает ресурс в зависимости от своего типа: это может быть камень, лёд или более ценные руды и другие материалы, используемые в [url=codex://codex.basics.manufacturing]Производстве[/url]. Подробнее о переносе предметов в инвентарь — в разделе [url=codex://codex.basics.itempickup]Подбор предметов[/url].
  [img]moddata://base/art/codex/resourceitems.png[/img]
  Различные области и регионы галактики содержат разные виды ресурсов. Путешествуйте в разные места и к дальним звёздным системам, чтобы найти материалы для более продвинутых рецептов.
codex-basics-manufacturing-title: "Основы производства"
codex-basics-manufacturing-body: |
  [h1]Основы производства[/h1]
  [img]moddata://base/art/codex/manubutton.png[/img]
  Нажмите кнопку Производство на вашем корабле или в инвентаре проверяемого корабля, чтобы открыть окно Производства. В нём можно использовать $lab$[url=codex://codex.components.labs]Фабрикатор[/url] для обработки ресурсов и производства новых [url=codex://codex.basics.components]Компонентов[/url] и [url=codex://codex.basics.tiles]Плиток[/url].
  
  Окно производства разделено на четыре основных раздела сверху вниз:
  [list]
  [*][00ff4e]Выбор фабрикатора[-]
  [*][0cdaff]Выбор входных и выходных данных[-]
  [*][dd3f3f]Список рецептов для текущего фабрикатора[-]
  [*][fffc00]Информация о выбранном рецепте[-]
  [*][c000ff]Выбор количества[-]
  [/list]
  
  [img]moddata://base/art/codex/manuwindow.png[/img]
  
  [h3]Краткое руководство по производству[/h3]
  Для производства по рецепту:
  [list]
  1. Выберите фабрикатор в разделе Выбор фабрикатора
  2. Установите нужные входные и выходные параметры.
  3. Выберите рецепт в Списке рецептов
  4. Выберите количество выходных предметов
  5. Нажмите [i]ПРОИЗВОДИТЬ[/i] для начала выполнения рецепта
  6. Дождитесь завершения производства
  7. Произведённые предметы будут добавлены в инвентарь корабля, выбранного в качестве Выхода.
  [/list]
  
  [h2]Выбор фабрикатора[/h2]
  [img]moddata://base/art/codex/lablist.png[/img]
  В верхней части окна Производства можно выбрать один из доступных Фабрикаторов на этом корабле с помощью {key-interact}. Если для использования фабрикатора требуется оплата, отобразится зелёный символ валюты [00ff33]Ⱡ[-]. Если в работе фабрикатора возникла проблема, появится [ff0000]$exclaim$[-].
  
  [h2]Фабрикатор в процессе работы[/h2]
  После того как Фабрикатор начал выполнение рецепта, это займёт некоторое время (больше при большом количестве), а ввод будет заблокирован до завершения процесса.
  
  [img]moddata://base/art/codex/activelab.png[/img]
  
  [h3]Проблемы производства[/h3]
  [list]
  [*][ff0000]ОШИБКА: НЕДОСТАТОЧНО ЭНЕРГИИ[-]: Фабрикатор потерял питание и не может продолжать работу. Добавьте или замените реакторы для увеличения доступной мощности.
  [*][ff0000]ОШИБКА: СЛОМАННАЯ УСТАНОВКА[-]: Фабрикатор потерял слишком много плиток под собой. Восстановите недостающие плитки с помощью $assembl$Сборщика.
  [/list]
  ПРИМЕЧАНИЕ: Если выходное пространство заполнится во время работы фабрикатора, произведённые предметы выплеснутся в космос рядом с кораблём фабрикатора.
  [h2]Выбор рецепта[/h2]
  При выборе фабрикатора в списке выбора рецептов отображаются все рецепты, доступные для производства на данном фабрикаторе.
  
  [img]moddata://base/art/codex/recipelist.png[/img]
  
  Нажатие {key-interact} выбирает рецепт и отображает его информацию в разделе Информация о рецепте в нижней части окна. Выбранный рецепт можно запустить кнопкой [i]ПРОИЗВОДИТЬ[/i], или двойным нажатием на рецепт. {?scheme: |Количество рецептов можно регулировать с помощью {key-navigateh};}
  
  Список рецептов можно фильтровать через поле поиска или кнопкой $manu$ для отображения только рецептов, которые можно сделать сразу из имеющихся материалов.
  
  [h2]Информация о рецепте[/h2]
  При выборе рецепта его информация отображается в нижней части окна производства.
  
  [img]moddata://base/art/codex/recipeinfo.png[/img]
  
  В разделе Выбранный рецепт отображается информация о необходимых входных предметах и создаваемых выходных предметах. В этом окне можно навести курсор на выходные (и входные) предметы для получения подробной информации о создаваемом. Если требуется оплата, она будет отображена на кнопке [i]ПРОИЗВОДИТЬ[/i].
codex-basics-systemview-title: "Варп (Системный вид)"
codex-basics-systemview-body: |
  [h1]Варп[/h1]
  [h2]Управление[/h2]
  Путешествие на варпе позволяет перемещаться внутри звёздных систем и между ними. В режиме варпа можно двигаться клавишами {key-moveforward} {key-rotatecounterclockwise} {key-moveback} {key-rotateclockwise} или нажимая (удерживая) {key-systemclickmove} для перемещения корабля к курсору.
  
  Скорость на варпе определяется ╠ Варп-фактором корабля — значением, основанным на суммарном Варп-рейтинге всех $engine$[url=codex://codex.components.engines]Двигателей[/url] и массе корабля. Текущая скорость также зависит от расстояния курсора от корабля при управлении мышью. Приближайте курсор к кораблю, чтобы замедлиться для более точных манёвров.
  
  [h2]Регионы[/h2]
  [img]moddata://base/art/codex/warpengage.png[/img]
  Звёздные системы состоят из посещаемых Астероидных полей, Станций, Сигналов бедствия и Флотов, а также непосещаемых фоновых звёзд, планет и лун. Всё это называется [i]Регионами[/i]; войти в них можно, нажав {key-engage} в радиусе досягаемости. Вход в регион выведет ваш корабль из варпа в соответствующей точке внутри региона.
  
  [h2]Перелёт в другие системы[/h2]
  [img]moddata://base/art/codex/sysedge.png[/img]
  Для поиска лучших ресурсов и снаряжения рано или поздно потребуется покинуть первую Звёздную систему. Чтобы перелететь в другую систему, нужно выйти за пределы основного гравитационного поля звезды и воспользоваться опцией «Покинуть систему» или добраться до края звёздной системы. После этого можно выбрать следующую систему для посещения.
  
codex-basics-combat-title: "Основы боя"
codex-basics-combat-body: |
  [h1]Основы боя[/h1]
  Вселенная — не самое дружелюбное место, и рано или поздно придётся сражаться, чтобы выжить. Основы боя схожи с [url=codex://codex.basics.mining]Добычей[/url]: нужно прицеливаться во вражеские плитки с помощью {key-actionsecondary} и разрушать их. Однако стратегия и эффекты зависят от того, какие [url=codex://codex.basics.tiles]Плитки[/url] уничтожаются и в каком порядке.
  
  [h2]Прицеливание по компонентам[/h2]
  Для победы в бою необходимо лишить противника возможности использовать [url=codex://codex.basics.components]Компоненты[/url] против вас. Уничтожение плиток, на которых находится компонент, уничтожит сам компонент и лишит врага его преимуществ:
  [list]
  [*][b]$weap$ Оружие[/b]: Уничтожение оружия лишит противника возможности использовать его против вас, открывая брешь в их обороне.
  [*][b]$engine$ Двигатели[/b]: Уничтожение двигателя снизит манёвренность врага, позволяя вам догнать или не дать ему уйти. Это может нарушить центр тяги, осложнив управление кораблём.
  [*][b]$shield$ Щиты[/b]: Уничтожение щита лишит его защиты жизненно важных компонентов.
  [*][b]$reactor$ Реакторы[/b]: Уничтожение реактора вызовет мощный взрыв, разрушающий соседние плитки. Также будет убрана вся энергия реактора, что может оставить другие компоненты без питания.
  [*][b]$cargo$ Грузовые отсеки[/b]: Уничтожение грузового отсека выбросит всё его содержимое — если вам нужна только добыча, это быстрый способ её получить.
  [/list]
  Важнейший компонент/установка в бою — [b]$bridge$ Мостик[/b]. После уничтожения всех мостиков корабль потеряет управление и будет считаться «уничтоженным»; его можно свободно мародёрствовать или обращаться с ним как с любым другим бесхозным объектом.
  
  Если нужен конкретный компонент противника, уничтожайте плитки компонентов осторожно — это с высокой вероятностью уничтожит сам компонент и выронит только запчасти. Может быть выгоднее попытаться отколоть этот кусок или уничтожить все мостики.
  
  [h2]Боевой сканер[/h2]
  Для быстрого просмотра ключевых компонентов противника наведите на него курсор и нажмите {key-actionprimary} — это откроет расположение всех жизненно важных компонентов в радиусе вокруг курсора.
  [img]moddata://base/art/codex/quickscan.png[/img]
  
  [h2]Окно прицеливания[/h2]
  Удерживая {key-leftshift} и нажав {key-actionprimary} на противнике, откроется окно прицеливания.
  [img]moddata://base/art/codex/targetwindow.png[/img]
  Окно прицеливания полезно при атаке быстро движущихся или далёких целей — позволяет стрелять по плиткам (нажимая {key-actionsecondary}) с фиксированным видом.
  Однако чем дальше противник, тем ниже качество захвата цели; при нуле захват теряется и окно закрывается.
codex-basics-eva-title: "ВКД"
codex-basics-eva-body: |
  [h1]Внекорабельная деятельность (ВКД)[/h1]
  Нажатие {key-enterexitvessel} позволяет перейти в режим ВКД — полёт в скафандре с выполнением различных задач.
  [img]moddata://base/art/codex/eva1.png[/img]
  
  [h2]Передвижение в режиме ВКД[/h2]
  {key-suitmoveup} {key-suitmoveleft} {key-suitmovedown} {key-suitmoveright} — тяга вверх, влево, вниз и вправо относительно экрана. Скафандр всегда направлен к курсору.
  
  [h2]Система жизнеобеспечения[/h2]
  [img]moddata://base/art/codex/lifesupport.png[/img]
  Скафандры имеют ограниченный запас кислорода, отображаемый синей полосой над панелью действий. Следите за запасом кислорода — если он закончится, вы погибнете и окажетесь в открытом космосе.
  
  [h2]Возможности ВКД[/h2]
  [h3]Смена корабля[/h3]
  Одна из главных задач ВКД — смена корабля. Находясь в режиме ВКД, можно войти на другие корабли, не находящиеся под чьим-либо управлением и доступные вам, подлетев к ним вплотную и нажав {key-enterexitvessel}.
  
  [h3]Ремонт[/h3]
  [img]moddata://base/art/codex/evarepair1.png[/img]
  В режиме ВКД можно ремонтировать повреждённые плитки. Для этого выберите инструмент ремонта на панели действий или нажмите {key-hotbarslot2}.
  [img]moddata://base/art/codex/evarepairicon.png[/img]
  Выбрав инструмент ремонта, наведите его на нуждающуюся в ремонте плитку и удерживайте {key-actionsecondary}.
  
  [h3]Инструменты взлома[/h3]
  [img]moddata://base/art/codex/evahack1.png[/img]
  В режиме ВКД можно использовать инструмент взлома для обхода блокировок и захвата кораблей, которые иначе недоступны (включая те, что без $bridge$[url=codex://codex.components.bridges]Мостиков[/url]). Обратите внимание, что полный доступ к кораблю (смена компонентов, инвентарь и т.д.) может потребовать дополнительной помощи извне.
  [img]moddata://base/art/codex/evahackicon.png[/img]
  Выбрав инструмент взлома, наведите его на плитку корабля и удерживайте {key-actionsecondary}. Оставайтесь рядом с кораблём на протяжении всего взлома, и управление перейдёт к вам автоматически по завершении. Если взломанный объект не имеет $bridge$[url=codex://codex.components.bridges]Мостика[/url], к кораблю будет добавлена новая [url=codex://codex.basics.tiles]Плитка[/url] с Мостиком.

  
  [h3]Сборка новых кораблей[/h3]
  Создайте новый корабль с нуля в режиме ВКД, подлетев к $assembl$[url=codex://codex.components.assemblers]Сборщику[/url] и нажав кнопку [b]НАЧАТЬ СТРОИТЕЛЬСТВО[/b].
  
codex-basics-hailing-title: "Вызов и диалог"
codex-basics-hailing-body: |
  [h1]Вызов и диалог[/h1]
  [h2]Входящие вызовы[/h2]
  В ходе путешествий вас будут вызывать дружественные и не очень корабли. При получении вызова на интерфейсе появится кнопка Входящих вызовов и стрелка на экране, указывающая на источник.
  
  [img]moddata://base/art/codex/hailui.png[/img]
  
  Чтобы ответить на входящий вызов, нажмите эту кнопку или {key-viewhail}. Важные входящие вызовы появятся автоматически. Все неотвеченные вызовы отображаются в списке при нажатии кнопки входящих вызовов.
  
  [h2]Вызов других[/h2]
  Нередко требуется вызвать другой корабль — для торговли, передачи предмета в рамках [url=codex://codex.intermediate.sysproblems]Проблемы[/url] или просто чтобы сказать им что-нибудь. Чтобы вызвать корабль, осмотрите его (удерживая {key-actionprimary}) и нажмите кнопку вызова, или наведите курсор на корабль и нажмите {key-hail}.
  
  {?scheme:[h2]Советы по диалогу[/h2][list]
  [*]Нажатие {key-leftshift} и соответствующей цифровой клавиши выберет этот вариант ответа
  [/list]| ;}
codex-basics-navscanner-title: "Навигационный сканер"
codex-basics-navscanner-body: |
  [h1]Навигационный сканер[/h1]
  
  Навигационный сканер отображается кольцом вокруг корабля в виде полос, направленных от него в разные стороны и окрашенных в различные цвета. У сканера два основных режима: постоянно работающий активный сканер и активируемый сканер руды.
  
  [img]moddata://base/art/codex/navscanner1.png[/img]
  
  [h2]Активный сканер[/h2]
  Активный сканер отображается синими (и красными) полосами. Они представляют сканируемый сигнал мощности ближайших кораблей. Чем длиннее полоса, тем сильнее сигнал.
  
  Сигнал корабля определяется совокупностью его [url=codex://codex.basics.tiles]Плиток[/url], [url=codex://codex.basics.components]Компонентов[/url] и их текущей активностью. Сигнал также ослабевает с расстоянием, поэтому крупный сложный корабль вдали может выглядеть так же, как небольшой корабль поблизости.
  
  На варпе активный сканер отображает регионы вместо отдельных кораблей или объектов.
  
  [h3]Индикатор угрозы[/h3]
  Корабли, активно нацелившиеся на вас, вызовут звуковой сигнал тревоги и отображаются красными полосами на сканере, пока остаются вашей целью.
  
  [h2]Сканер руды[/h2]
  {?scheme:Нажатие {key-scan} или кнопки у панели действий|Нажатие и удержание {key-interact} над пустым пространством;} запускает сканирование руды — оно отображается как мгновенные оранжевые полосы, представляющие пассивный сигнал ближайших объектов; рудные плитки имеют наибольший пассивный сигнал. Это полезно для поиска рукотворных объектов, спрятанных в обломках или скоплениях астероидов, а также для нахождения самых богатых целей для добычи.
  
codex-basics-tiles-title: "Плитки"
codex-basics-tiles-body: |
  [h1]Плитки[/h1]
  [img]moddata://base/art/codex/tiles.png[/img]
  Плитки — строительные блоки всего во вселенной. Существует множество видов плиток: от простого Камня и жизненно важных Руд до рукотворных Корпусов — каждый со своими свойствами и применением.
  
  [h2]Прочность[/h2]
  Каждая плитка имеет значение прочности: сколько урона она может выдержать до уничтожения.
  
  [h2]Тип[/h2]
  Плитки делятся на два основных типа:
  [list]
  [*]Добыча — включает камень, руду и «природные» плитки в целом
  [*]Бой — включает все Корпуса, Стекло и большинство рукотворных плиток
  [/list]
  Эти типы определяют, сколько урона наносит им то или иное оружие. Например, Горнодобывающий лазер наносит значительно больше урона плитке Камня, чем плитке Корпуса, а Луч утилизации — наоборот. Эти характеристики урона указаны в подсказке каждого $weap$[url=codex://codex.components.weapons]Оружия[/url].
  
  [h2]Добыча[/h2]
  Когда прочность плитки достигает нуля (0), она может выронить предмет (или несколько) в зависимости от типа плитки и свойств оружия, нанёсшего последний удар. Например, Плитка камня выронит Камень при уничтожении обычной Частотной пушкой, два (2) Камня — при уничтожении Горнодобывающим лазером (с множителем добычи 2x), но ничего — при уничтожении Лучом утилизации.
  
  [h2]Масса[/h2]
  Все плитки имеют разную массу. Масса плитки добавляется к общей массе объекта, которому она принадлежит. Чем массивнее объект, тем труднее двигать его или управлять им с помощью Двигателей — поэтому при выборе плиток для строительства важно принимать это во внимание.
  
  [h2]Врождённая мощность[/h2]
  Некоторые плитки обладают редкими врождёнными свойствами мощности. Такие плитки обеспечивают некоторое количество энергии без необходимости в $reactor$[url=codex://codex.components.reactors]Реакторе[/url].
codex-basics-mounts-title: "Установки"
codex-basics-mounts-body: |
  [h1]Установки[/h1]
  [img]moddata://base/art/codex/mounts.png[/img]
  Установки размещаются на [url=codex://codex.basics.tiles]Плитках[/url] и позволяют устанавливать [url=codex://codex.basics.components]Компоненты[/url]. Сами по себе установки не дают никаких функций, однако их расположение может иметь решающее значение. Установки можно размещать только в процессе строительства.
  
  [h2]Совместимость компонентов[/h2]
  Только определённые компоненты подходят к определённым установкам — это указано в подсказках компонентов. Общее правило: тип и размер компонента должны совпадать. Например, Большое оружие подходит к Большой установке для оружия.
  
  [h2]Размеры[/h2]
  Установки выпускаются разных размеров и занимают разные площади плиток:
  [img]moddata://base/art/codex/mountsizes.png[/img]
  [list]
  [*]Малый: 1 плитка
  [*]Средний: 2 x 2 плитки
  [*]Большой: 3 x 3 плитки
  [*]Гигантский: 4 x 4 плитки
  [/list]
  Как правило, в установках большего размера устанавливаются более мощные компоненты, но не всегда.
  
  [h2]Питание[/h2]
  [url=codex://codex.intermediate.power]Мощность[/url], которую установка передаёт компоненту, равна [b]сумме мощности всех её плиток[/b]
  [img]moddata://base/art/codex/mountpower.png[/img]
  
  [h2]Сломанные установки[/h2]
  Установки, занимающие более одной плитки (например, Большая установка), могут стать [i]Сломанными[/i] при уничтожении любой из занимаемых ими плиток.
  [img]moddata://base/art/codex/brokemount.png[/img]
  Сломанная установка оказывает ряд негативных эффектов на компонент, а при уничтожении более 50% плиток выбросит установленный компонент в космос.
  
  Некоторые эффекты сломанной установки:
  [list]
  [*]Двигатели будут работать со всё меньшей тягой по мере повреждения установки
  [*]Оружие перестанет функционировать
  [*]Щиты рухнут и перестанут функционировать
  [*]Фабрикаторы и Сборщики прекратят работу
  [*]Из грузовых отсеков выпадут предметы
  [*]Корабли, находящиеся в Ангарах, могут получить повреждения
  [*]Реакторы взорвутся
  [/list]
  Подробнее о том, что происходит с компонентами в сломанных установках, можно узнать на их отдельных страницах кодекса.
codex-basics-components-title: "Компоненты"
codex-basics-components-body: |
  [h1]Компоненты[/h1]
  [img]moddata://base/art/codex/components.png[/img]
  Компоненты устанавливаются в [url=codex://codex.basics.mounts]Установки[/url] и обеспечивают всю функциональность корабля.
  
  [h2]Масса[/h2]
  Компоненты могут увеличивать массу объекта при установке. Учитывайте это при выборе компонентов. Большое мощное оружие может выглядеть заманчиво, но сделает ваш корабль менее манёвренным.
  
  [h2]Требования к питанию[/h2]
  Большинству компонентов для работы требуется [url=codex://codex.intermediate.power]Мощность[/url]. Компонент получает питание от установки, в которую он вставлен. Если компоненту не хватает необходимой мощности, его функции будут ограничены или он вообще не будет работать.
  
  [h2]Уничтожение и добыча[/h2]
  Компоненты, находящиеся в Установке при её уничтожении, имеют небольшой шанс выпасть; в большинстве случаев они уничтожаются и выпадают только Запчасти. Исключение: в боях Игрок против Игрока компоненты кораблей под управлением игроков выпадают в 100% случаев.
  
  [h2]Функциональность[/h2]
  Подробности о функциях компонентов — на их отдельных страницах:
  [list]
  [*]$assembl$ [url=codex://codex.components.assemblers]Сборщики[/url]
  [*]$bridge$ [url=codex://codex.components.bridges]Мостики[/url]
  [*]$cargo$ [url=codex://codex.components.cargobays]Грузовые отсеки[/url]
  [*]$engine$ [url=codex://codex.components.engines]Двигатели[/url]
  [*]$hangar$ [url=codex://codex.components.hangars]Ангары[/url]
  [*]$lab$ [url=codex://codex.components.labs]Фабрикаторы[/url]
  [*]$reactor$ [url=codex://codex.components.reactors]Реакторы[/url]
  [*]$shield$ [url=codex://codex.components.shields]Щиты[/url]
  [*]$weap$ [url=codex://codex.components.weapons]Оружие[/url]
  [/list]
  
codex-intermediate: "Продвинутые темы"
codex-intermediate-inventory-title: "Продвинутый инвентарь"
codex-intermediate-inventory-body: |
  [h1]Продвинутый инвентарь[/h1]
  
  [h2]Перенос[/h2]
  [img]moddata://base/art/codex/ico_transfer.png[/img]
  {?scheme:Все предметы из инвентаря целиком можно перенести в другой открытый инвентарь кнопкой переноса. То же самое действует для всех предметов одного Грузового отсека.|Нажатие и удержание {key-transfer} переместит все предметы из одного грузового отсека в другой инвентарь; более долгое удержание {key-transfer} переместит все предметы из всего инвентаря.;} При попытке перенести все предметы в слишком маленький целевой инвентарь перенесутся только те, что вмещаются, остальные останутся на месте.
  
  [h2]Сортировка[/h2]
  [img]moddata://base/art/codex/ico_sort.png[/img]
  Инвентари можно сортировать — как отдельные Грузовые отсеки, так и весь инвентарь целиком. Выберите нужный метод из выпадающего меню. Сортировка также позволяет объединять одинаковые предметы в минимальное количество стеков с помощью опции [i]Стек[/i].
  
  [h2]Фильтрация/Поиск[/h2]
  Инвентарь можно фильтровать для отображения предметов, соответствующих введённым критериям.
  [img]moddata://base/art/codex/filterinv.png[/img]
  Введите критерий поиска в [00ff06]поле поиска[-]. При фильтрации отображение ячеек грузового отсека сменится на [ffd220]отфильтрованный набор [i]Результатов[/i][-] из всех грузовых отсеков, показывающий все подходящие предметы.
  
  Отфильтрованными предметами можно пользоваться как обычно, но помните: отображаемые предметы могут превышать максимальный размер стека — при взятии такого предмета на курсор попадёт не более максимального стека.
  
  Помещать предметы в отфильтрованный инвентарь НЕЛЬЗЯ.
  
  Чтобы снять активный фильтр, нажмите {?scheme:X в строке поиска|{key-close};} или выберите грузовой отсек для просмотра.
codex-intermediate-discovery-title: "Исследование"
codex-intermediate-discovery-body: |
  [h1]Исследование[/h1]
  Путешествуя по вселенной, вы будете узнавать о ней всё больше. Перемещение по Звёздным системам в режиме варпа откроет новые регионы. Регионы будут раскрываться, когда вы окажетесь в радиусе сканера.
  
  [img]moddata://base/art/codex/sysscanrange.png[/img]
  
  Радиус системного сканера можно увеличить с помощью [url=codex://codex.intermediate.enhancements]Улучшений[/url].
  
  Информацию об исследованиях также можно получить, разговаривая с определёнными торговцами или выполняя определённые задания.
  
  [h2]Состояния исследования[/h2]
  Различную информацию о регионах можно открывать по отдельности, но в целом она делится на три основных состояния: Неизвестен, Отсканирован, Посещён.
  
  [h3]Неизвестен[/h3]
  Неизвестный регион — регион, который вы ещё не открыли. Он отображается значком [b]?[/b] или иногда вовсе не отображается.
  
  [img]moddata://base/art/codex/unknownplanet.png[/img]
  
  [h3]Отсканирован[/h3]
  Регион, попавший в радиус вашего сканера, становится [i]Отсканированным[/i], открывая его название и тип.
  
  [h3]Посещён[/h3]
  Регион, в котором вы уже побывали, отмечается как [i]Посещённый[/i]. Посещённый регион отображает своё название и тип, а также ряд значков, сообщающих известную о нём информацию: фракцию-владельца, наличие торговцев и т.д.
  
  [img]moddata://base/art/codex/sysregiondisc.png[/img]
  
  Первый значок — фракция, остальные могут быть одним или несколькими из следующих:
  [list]
  [*][63FC93]Ⱡ[-] - В регионе есть хотя бы один Торговец
  [*][00C38B]🏠[-] - Регион является вашим домом
  [*][CA9F00]$build$[-] - В регионе есть корабли со сборщиками
  [*][B32872]$manu$[-] - В регионе есть корабли с производственными мощностями
  [*][BC003A]$battle$[-] - В регионе идёт сражение
  [*][FF154A]$boss$[-] - В регионе потенциально опасная встреча
  [/list]
codex-intermediate-factions-title: "Фракции"
codex-intermediate-factions-body: |
  [h1]Фракции[/h1]
  [img]moddata://base/art/codex/factions.png[/img]
  
  Вселенная полна Фракций, борющихся за власть или просто пытающихся выжить. Ваши отношения с каждой из них могут существенно повлиять на вашу судьбу в жестокой тьме космоса.
  
  У каждой фракции есть отношение к вам — [i]Репутация у фракции[/i]. Её можно увидеть в панели Списка фракций {key-togglefactions}, где также есть другая полезная информация. В панели отображаются только крупные фракции.
  
  [img]moddata://base/art/codex/facentry.png[/img]
  
  Существует 5 уровней репутации: от низшего — Ненавидят — до высшего — Союзник. Посередине находится Нейтральный. Отдельные фракции ведут себя по-разному на каждом уровне: некоторые более щедры при нейтральных отношениях. Каждый уровень репутации постепенно меняет такие параметры, как ценовые модификаторы.
  
  [h2]Повышение репутации[/h2]
  Репутацию у фракции можно поднять, помогая решать [url=codex://codex.intermediate.sysproblems]Проблемы системы[/url]. Однако многие проблемы могут негативно сказаться на отношениях с другими фракциями. Например, уничтожение базы пиратов для Тисероев повысит репутацию у них, но пираты будут недовольны. Ответ на Сигналы бедствия — также возможность повысить (или понизить) репутацию.
  
  При достаточно высокой репутации у Фракции, помимо поддержки в бою, многие Фракции откроют доступ к своим объектам: строительным верфям, более дешёвому ремонту или улучшенным ценам на покупку и продажу. Некоторые фракции могут даже позволить бесплатный доступ к инвентарям без последствий. Другие бонусы включают:
  [list]
  [*]Свободный доступ к бесхозным кораблям
  [*]Доступ к ангарным отсекам
  [/list]
  [h2]Потеря репутации[/h2]
  Репутация у фракции теряется при выполнении определённых Миссий, а также в следующих случаях (в порядке возрастания негативного эффекта):
  [list]
  [*]Уничтожение плиток на корабле фракции
  [*]Уничтожение Мостиков на корабле фракции
  [*]Полное уничтожение корабля Торговца фракции
  [*]Кража инвентаря с корабля или из контейнера фракции
  [/list]
  Низкая репутация у фракции сделает её враждебной: корабли будут преследовать и атаковать вас при виде, а доступ к торговле и другим объектам будет закрыт.
codex-intermediate-tractoring-title: "Буксировка"
codex-intermediate-tractoring-body: |
  [h1]Буксировка[/h1]
  Буксир — особый вид оружия, позволяющий прикрепиться к другому кораблю и тянуть его за собой. Для буксировки нужно установить Буксировочный луч в Установку для оружия — после этого на панели действий появится новая кнопка.
  [img]moddata://base/art/codex/tractortoggle.png[/img]
  Нажатие {?scheme:кнопки переключения буксира или {key-toggletractorbeam}|{key-hotbaraction} + {key-toggletractorbeam};} включает/выключает все установленные буксировочные лучи.
  
  [h2]Прикрепление[/h2]
  Чтобы прикрепить буксировочный луч, либо выстрелите им как обычным оружием, либо наведите курсор на целевой корабль и нажмите {?scheme:{key-toggletractorbeam}|{key-hotbaraction} + {key-toggletractorbeam};}.
  
  Буксировочные лучи имеют ограничение по массе. Каждый установленный буксир вносит вклад в общее ограничение по массе, так как одновременно можно буксировать только одну цель. Например, два буксировочных луча с индивидуальным лимитом массы по 10 дают суммарный лимит 20.
  
  [img]moddata://base/art/codex/tractoring.png[/img]
  
  Прикрепление к кораблю свяжет его с вашим на фиксированном расстоянии, и он будет следовать за вами. Прикреплённые корабли можно брать в варп и в другие регионы и системы.
  
  Однако буксир отсоединится автоматически если:
  [list]
  [*]Другой корабль окажется между вашим кораблём и буксируемым
  [*]Буксировочные лучи вашего корабля потеряют питание или будут уничтожены
  [*]Буксировочные лучи вашего корабля будут сняты
  [/list]
  [h2]Отсоединение[/h2]
  Чтобы отсоединить активный буксир, нажмите {?scheme:{key-toggletractorbeam}|{key-hotbaraction} + {key-toggletractorbeam};}.
  
codex-intermediate-weapgroups-title: "Группы оружия"
codex-intermediate-weapgroups-body: |
  [h1]Группы оружия[/h1]
  Слишком много оружия стреляет одновременно? Хотите больше стратегического контроля над тем, какое оружие стреляет и когда? Группировка оружия — это то, что нужно.
  
  [h2]Что такое Группы оружия[/h2]
  Группировка оружия позволяет включать и выключать определённое оружие с помощью панели действий или связанных с ней клавиш. Каждая группа оружия отображается как слот на панели действий и может управлять несколькими видами оружия.
  [img]moddata://base/art/codex/ctrlgroups1.png[/img]
  
  [h2]Редактирование / Создание группы[/h2]
  
  {?scheme:Для редактирования группы оружия нажмите кнопку «Переключить редактирование групп оружия».
  [img]moddata://base/art/codex/ctrlgroups-toggle1.png[/img]
  После активации выберите номер слота оружия на панели действий, чтобы сделать его текущей группой оружия.
  [img]moddata://base/art/codex/flashgrps.png[/img]|
  Для редактирования группы оружия сначала выберите её через радиальное меню {key-hotbarradial} и нажмите {key-snapaim};}
  В режиме редактирования оружие из этой группы будет мигать с синей подсветкой
  [img]moddata://base/art/codex/ctrlgroups2.png[/img]
  
  Чтобы добавить или убрать оружие из группы, наведите курсор на его установку и нажмите {key-interact}
  
  Чтобы завершить редактирование группы оружия, нажмите кнопку {key-close}{?scheme: или нажмите {key-mouse0} на кнопке «Переключить редактирование групп оружия».|.;}
codex-intermediate-trading-title: "Основы торговли"
codex-intermediate-trading-body: |
  [h1]Торговля[/h1]
  По всей вселенной есть капитаны, готовые заниматься одним из древнейших занятий: Торговлей. Чтобы начать торговлю, [url=codex://codex.basics.hailing]Свяжитесь[/url] с их кораблём и выберите ответ о торговле. Большинство крупных Грузовых кораблей будут готовы торговать своими товарами при достаточной [url=codex://codex.intermediate.factions]Репутации[/url], но учтите — если капитан не хочет торговать, соответствующего ответа может не оказаться.
  
  [h2]Окно торговли[/h2]
  При начале торговли откроются инвентарь Торговца и ваш. Вверху отображаются количество Космических монет у вас и вашего торгового партнёра. Нельзя купить больше, чем позволяют ваши средства, и продать Торговцу больше, чем есть у него.
  
  [img]moddata://base/art/codex/trade1.png[/img]
  
  ПРИМЕЧАНИЕ: Торговые инвентари работают точно так же, как обычные — можно просматривать несколько грузовых отсеков, [b]однако[/b] предметы НЕЛЬЗЯ перемещать.
  
  [h2]Покупка[/h2]
  [img]moddata://base/art/codex/butslot.png[/img]
  Чтобы купить предмет у торговца, выделите нужный предмет и нажмите {key-interact} — откроется окно торговли:
  
  [img]moddata://base/art/codex/tradepopup.png[/img]
  
  В окне торговли можно выбрать количество покупаемых предметов с помощью ползунка или кнопок + и -. Ниже отображаются количество, цена за единицу и отношение цены к ГСЦ (Галактической стандартной цене).
  
  Для покупки нажмите кнопку [i]КУПИТЬ[/i] — итоговая сумма указана как [i]Итого[/i]. Если средств не хватает, Торговец сообщит об этом.
  
  [h3]Быстрая покупка[/h3]
  
  Предметы можно покупать быстрее, выделив нужный предмет {?scheme:и удерживая {key-leftshift} при нажатии {key-mouse0} для покупки всего стека или {key-mouse1} для покупки одного предмета|и нажав {key-transfer} для покупки всего стека;}.
  
  Цена за единицу отображается в подсказке, % — отношение к ГСЦ:
  
  [00ff33]КУПИТЬ ЗА: Ⱡ100([808080]■0 %[-])[-][-]
  
  [h2]Продажа[/h2]
  [img]moddata://base/art/codex/sellslot.png[/img]
  Чтобы продать предмет торговцу, наведите курсор на предмет в вашем инвентаре и нажмите {key-interact} — откроется окно торговли, аналогичное окну покупки, где можно выбрать точное количество продаваемых предметов.
  
  Для продажи нажмите кнопку [i]ПРОДАТЬ[/i] — получаемая сумма указана как [i]Итого[/i]. Если сделка не устроит Торговца, продажа будет отменена и он сообщит об этом.
  
  [h3]Быстрая продажа[/h3]
  
  Предметы можно продавать быстрее, наведя курсор на нужный предмет {?scheme:и удерживая {key-leftshift} при нажатии {key-mouse0} для продажи всего стека или {key-mouse1} для продажи одного предмета|и нажав {key-transfer} для продажи всего стека;}.
  
  Цена продажи за единицу отображается в подсказке, % — отношение к ГСЦ:
  
  [00ff33]ПРОДАТЬ ЗА: Ⱡ100([808080]■0 %[-])[-][-]
  
  [h2]Ограничения[/h2]
  Для покупки или продажи определённых предметов может потребоваться достаточная репутация у [url=codex://codex.intermediate.factions]Фракции[/url] Торговца. Если предмет ограничен, при наведении он будет выделен красным, а в подсказке укажется необходимый уровень репутации.
  
  [h2]Влияние фракции[/h2]
  Ваша репутация у фракции торговца влияет на цены покупки и продажи. Некоторые торговцы продают предметы только лицам с определённым уровнем репутации.
  
  [h2]Обновление запасов торговца[/h2]
  Торговцы обновляют свои запасы и Космические монеты каждые 20 минут. Просто спросите Торговца — он сообщит оставшееся время до пополнения запасов.
  
codex-intermediate-transit-travel-title: "Путешествие через Прыжковые ворота"
codex-intermediate-transit-travel-body: |
  [h1]Прыжковые ворота[/h1]
  Прыжковые ворота встречаются по всей вселенной. Эти порталы позволяют перемещаться на огромные расстояния, перенося вошедших через несколько систем сразу.
  
  [img]moddata://base/art/codex/jumpgate.png[/img]
  
  [h2]Путешествие[/h2]
  Для использования Прыжковых ворот корабль должен находиться в их апертуре (круговая область с сильными визуальными искажениями). Когда корабль окажется внутри, над панелью действий появится кнопка [i]ВОЙТИ В ПРЫЖКОВЫЕ ВОРОТА[/i].
  
  [img]moddata://base/art/codex/enterwormholebtn.png[/img]
  
  Нажатие {?scheme:кнопки [i]ВОЙТИ В ПРЫЖКОВЫЕ ВОРОТА[/i]|{key-centeralt}+{key-entertransit};} откроет карту вселенной для выбора системы назначения.
  
  [img]moddata://base/art/codex/transit-pick.png[/img]
  
  Допустимой системой назначения является:
  [list]
  [*]Система с воротами, которые вы ранее [b]посетили[/b]
  [*]Система, связанная с посещёнными воротами и [b]разблокированная[/b]
  [/list]
  
  После выбора назначения корабль начнёт разгон двигателей для прыжка. Прогресс разгона отображается полосой на кнопке; его можно отменить в любой момент до завершения, снова нажав кнопку. Разгон принудительно прервётся если:
  [list]
  [*]Корабль получит любое повреждение плиток
  [*]Корабль начнёт другой разгон варпа
  [*]Корабль покинет апертуру червоточины/ворот
  [/list]
  После завершения разгона корабль пройдёт через червоточину/ворота и через короткое время выйдет на другом конце.
  
  [h2]Заблокированные/неактивные ворота[/h2]
  Иногда встречаются неактивные или заблокированные прыжковые ворота. Их можно активировать, решив проблему ворот — зачастую это нехватка материалов. Можно связаться с Прыжковыми воротами, чтобы узнать подробности.
  
codex-intermediate-beacons-title: "Маяки"
codex-intermediate-beacons-body: |
  [h1]Маяки[/h1]
  Маяки — предметы, которые можно размещать в космосе для отметки интересных точек для последующего возвращения или для других игроков. С предметом-маяком на курсоре, наведя курсор на пустое пространство, нажмите {key-actionsecondary}. Маяк будет размещён под текущим кораблём. Маяки можно устанавливать из инвентаря в регионе или на варпе.
  
  [img]moddata://base/art/codex/usebeacon.png[/img]
  
  [h2]Панель маяков[/h2]
  Просмотр, редактирование и удаление маяков осуществляется через Панель маяков {key-togglebeacons}. Верхняя часть панели показывает Ближайшие маяки — все маяки в текущей Звёздной системе, размещённые вами или публичные маяки других игроков и фракций. Нижняя часть — ваша Библиотека маяков: список всех маяков, размещённых или добавленных вами в закладки по всей вселенной.
  
  Каждая запись маяка содержит:
  [list]
  1. Переключатель отображения навигационной стрелки к маяку
  2. Текст маяка
  3. Местоположение маяка
  4. Видимость маяка для других: Личный — только вы видите; Публичный — видят все поблизости
  5.
  [/list] a. Если маяк ваш — кнопка Редактирования (см. ниже)
   b. Если маяк чужой — переключатель закладок для отслеживания/снятия с отслеживания маяка
  
  [img]moddata://base/art/codex/beaconentry.png[/img]
  
  [h3]Редактирование маяка[/h3]
  Если маяк размещён вами, его можно редактировать, нажав Переключатель редактирования — запись расширится, позволяя изменить название, значок, видимость и т.д. Чтобы сохранить изменения, снова нажмите Переключатель редактирования. Для безвозвратного удаления маяка нажмите кнопку Корзины.
  
  [img]moddata://base/art/codex/beaconedit.png[/img]

codex-intermediate-sysconflict-title: "Конфликты в звёздных системах"
codex-intermediate-sysconflict-body: |
  [h1]Системный конфликт[/h1]
  В путешествиях по вселенной можно столкнуться с системами, охваченными конфликтом. Достаточно приложив усилия, можно склонить чашу весов и помочь завоевать или защитить систему от нападающих.
  
  [img]moddata://base/art/codex/sysconflictstart.png[/img]
  
  [h2]Разрешение конфликта[/h2]
  После начала конфликта в системе начнутся изменения: вспыхнут сражения, а нападающие будут совершать набеги на ближайшие станции.
  Помощь одной из двух враждующих фракций приближает её к победе. Баланс сил виден из вида системы в виде двух противоположных полос.
  
  [img]moddata://base/art/codex/sys-inconflict.png[/img]
  
  Первая фракция, заполнившая полосу прогресса конфликта, считается победителем.
  
  Помочь в конфликте можно несколькими способами:
  [list]
  [*]Уничтожение вражеских кораблей
  [*]Зачистка боевых регионов от всех врагов
  [*]Помощь союзникам по сигналам бедствия
  [/list]
  
  [h2]Восстановление[/h2]
  После урегулирования конфликта победившая сторона возьмёт систему под контроль и начнётся восстановление. В этот период регионы начнут преобразовываться: либо под нового владельца, либо возвращаясь в прежнее состояние. Победившая фракция предложит улучшенные торговые условия, и в системе появятся несколько новых торговцев. В период восстановления новый конфликт невозможен.

codex-intermediate-enhancements-title: "Улучшения"
codex-intermediate-enhancements-body: |
  [h1]Улучшения[/h1]
  [img]moddata://base/art/codex/enhancedicon.png[/img]
  Улучшения — набор эффектов, дающих бонусы, штрафы и/или дополнительные возможности всему кораблю. При применении улучшения (обычно через установку Мостика) оно задействует несколько эффектов.
  
  Все активные Улучшения корабля можно просмотреть в Панели улучшений, открываемой кнопкой Улучшения рядом с нужным инвентарём.
  
  [img]moddata://base/art/codex/enhancebutton.png[/img]
  
  В этом окне отображаются все активные улучшения; каждую запись можно навести курсором для получения дополнительной информации об эффектах.
  
  [img]moddata://base/art/codex/enhancementswindow.png[/img]
  
  [h2]Суммирование улучшений[/h2]
  Улучшения одного и того же типа не суммируются — действует только одно. Например, два мостика с Перегрузкой оружия Мк. 1 дадут эффект только одного. Однако Перегрузка оружия Мк. 1 и Мк. 2 будут применены оба.
  
  [h2]Эффекты улучшений[/h2]
  [h3]Эффекты усиления/ослабления компонентов[/h3]
  Эффекты, изменяющие компоненты, применяют бонусы и штрафы ко всем компонентам указанного типа по всему кораблю. Эти изменения могут быть фиксированными или процентными — как положительными, так и отрицательными.
  
  Пример: [i]Перегрузка двигателя Мк. 1[/i] даёт следующие эффекты ко ВСЕМ Двигателям:
  [list]
  [*]Требуемая мощность +10% [Процентный]
  [*]Сигнатура сканера +10 [Фиксированный]
  [*]Тяга +10% [Процентный]
  [*]Варп-рейтинг +2% [Процентный]
  [/list]
  [b]ФИКСИРОВАННЫЙ[/b] модификатор добавляет или вычитает это значение из характеристик компонента. [i]Например, двигатель с сигнатурой 200 и фиксированным модификатором сигнатуры +10 даст сигнатуру 210.[/i]
  [b]ПРОЦЕНТНЫЙ[/b] модификатор изменяет характеристику относительно базового значения. [i]Например, двигатель с тягой 10 и процентным модификатором тяги +10% даст тягу 11.[/i]
  
  Изменённые характеристики компонента выделяются в подсказке значком улучшения и окрашиваются в фиолетовый:
  
  [img]moddata://base/art/codex/enh-engtooltip.png[/img]
  
  [h3]Маскировка[/h3]
  Маскировка — эффект Улучшения, позволяющий кораблю стать практически незаметным для других. При экипировке появится кнопка переключения маскировки рядом с панелью действий:
  
  [img]moddata://base/art/codex/cloakbutton.png[/img]
  
  Нажатие кнопки переключения или {key-togglecloak} включает/выключает маскировку. Однако маскировка не скрывает корабль на 100% — при слишком близком сближении вас обнаружат.
  
  Маскировка имеет ограничения и отключится при любом из следующих событий:
  [list]
  [*]Любая плитка получила урон
  [*]Выстрел из любого оружия
  [*]Корабль начинает разгон для варпа
  [/list]
  
  [h3]Транспортёры[/h3]
  Транспортёры — эффект Улучшения, изменяющий порядок входа и выхода через ВКД. При активном эффекте транспортёра нажатие {key-enterexitvessel} выведет вас из корабля в точке курсора, а не рядом с кораблём — для быстрой эвакуации или дистанционной ВКД-деятельности.
  
  [img]moddata://base/art/codex/transport-distance.png[/img]
  
  Корабли с активным Транспортёром также позволяют входить с большого расстояния, а не только вплотную.
  
  [h2]Временные улучшения[/h2]
  Некоторые улучшения временные и действуют только в течение определённого времени. Они часто доступны после конфликта или системной проблемы и могут быть весьма мощными.
codex-intermediate-power-title: "Питание"
codex-intermediate-power-body: |
  [h1]Питание[/h1]
  [img]moddata://base/art/codex/powericon.png[/img]
  Мощность♦ создаётся реакторами и необходима для работы почти всех [url=codex://codex.basics.components]Компонентов[/url].
  
  [h2]Обеспечение мощностью[/h2]
  Все плитки корабля имеют значение мощности: мощность, поставляемую ближайшими реакторами, или врождённую мощность типа плитки. Распределение мощности на корабле видно при размещении реакторов или ручном включении/выключении наложения.
  
  [img]moddata://base/art/codex/power1.png[/img]
  
  На изображении выше Материальный реактор обеспечивает мощностью окружающие плитки в круге; более яркие плитки получают больше мощности.
  Не все Реакторы распределяют мощность одинаково — например, серия [i]Поясной синтез[/i] обеспечивает полосой мощности (см. ниже).
  
  [img]moddata://base/art/codex/powerpattern2-unrot.png[/img]
  
  Реакторы можно поворачивать, что влияет на паттерн мощности. При повороте Поясного синтеза на 90° распределение мощности изменится.
  
  [img]moddata://base/art/codex/powerpattern2_rot.png[/img]
  
  Размещение нескольких перекрывающихся реакторов СУММИРУЕТ мощность в точках перекрытия, увеличивая её для этих плиток.
  
  [img]moddata://base/art/codex/power2.png[/img]
  
  [h2]Питание компонентов[/h2]
  Компонент получает столько мощности, сколько доступно на занимаемых им плитках. Если доступная мощность превышает требуемую, компонент получит питание и будет нормально функционировать.
  
  [img]moddata://base/art/codex/singlecomppower.png[/img]
  
  Мощность для компонентов, занимающих несколько плиток, равна СУММЕ мощности всех этих плиток.
  
  [img]moddata://base/art/codex/mountpower.png[/img]
  
  Если компоненту не хватает мощности, появится значок молнии ([ff0000]♦[-]). Подробнее об эффектах низкой мощности — на странице кодекса каждого компонента.
  
  [img]moddata://base/art/codex/notenoughpowerweap.png[/img]
  
  [h2]Дренаж мощности[/h2]
  Некоторые виды оружия, например Магнетронное, могут вызывать дренаж мощности — истощая её из Плиток, что может привести к отрицательным значениям.
  
  [img]moddata://base/art/codex/powerdrain-norm.png[/img]
  
  Отрицательная мощность отображается белым на наложении питания.
  
  [img]moddata://base/art/codex/powerdrain.png[/img]
  
  Дренаж мощности — мощный тактический инструмент, на короткое время лишающий определённые компоненты функциональности. Один из способов противостоять дренажу — иметь избыток Мощности, чтобы корабль мог выдержать дренаж и компоненты продолжали работать.
  
  [h2]Наложение питания[/h2]
  Наложение питания видно при размещении реакторов во время строительства. Его также можно увидеть на [url=codex://codex.basics.paperdoll]Бумажной кукле[/url]. Видимость наложения питания переключается соответствующими кнопками и имеет три состояния:
  
  [img]moddata://base/art/codex/powertogglestates.png[/img]
  [list]
  [*]Авто: отображается только при редактировании реакторов или установок
  [*]Вкл: отображается всегда, пока видно наложение Бумажной куклы
  [*]Выкл: не отображается даже при редактировании реакторов[/list]
codex-intermediate-docking-title: "Стыковка"
codex-intermediate-docking-body: |
  [h1]Стыковка[/h1]
  Корабли можно стыковать и отстыковывать от $hangar$[url=codex://codex.components.hangars]Ангаров[/url], позволяя более крупным кораблям нести лёгкие, небольшие суда.
  
  [h2]Как пристыковаться[/h2]
  Для стыковки подлетите в радиус действия Ангара:
  
  [img]moddata://base/art/codex/hangarrange.png[/img]
  
  Оказавшись в радиусе Ангара, нажмите кнопку [i]НАЧАТЬ СТЫКОВКУ[/i], которая появится над панелью действий. Также можно нажать кнопку Стыковки рядом с инвентарём проверяемого корабля.
  
  [img]moddata://base/art/codex/dockingbutton.png[/img]
  
  [h3]Выбор ангара[/h3]
  {?scheme:Нажатие кнопки [i]НАЧАТЬ СТЫКОВКУ[/i]|{key-centeralt}+{key-enterdocking};} скроет интерфейс и выделит все Ангары в радиусе.
  
  [img]moddata://base/art/codex/hangarpicker.png[/img]
  
  Выбор Ангара с зелёной кнопкой{?scheme: | и нажатие {key-interact};} начнёт стыковку. Если кнопка не зелёная, в этот Ангар пристыковаться нельзя — рядом будет указана причина.
  
  [h3]Позиционирование[/h3]
  После начала стыковки отобразится пол Ангара и схема стыкующегося корабля над ним.
  
  Стыкующийся корабль можно перемещать {?scheme:просто перемещая курсор — корабль всегда будет центрирован на нём|с помощью {key-navigateh}{key-navigatev};}.
  
  [img]moddata://base/art/codex/dock1.png[/img]
  
  Стыкующийся корабль можно поворачивать с шагом 90° нажатием {key-rotatecw} (по часовой стрелке) или {key-rotateccw} (против часовой). Удержание {key-place} и перетаскивание в кардинальном направлении повернёт стыкующийся корабль в эту сторону.
  
  [img]moddata://base/art/codex/dock2.png[/img]
  
  [h3]Размещение[/h3]
  Перемещайте корабль по полу ангара, пока он не окажется в допустимой позиции. Корабль находится в недопустимой позиции если:
  [list]
  [*]Любые плитки корабля выходят за пределы пола ангара
  [*]Любые плитки корабля перекрывают заблокированные части пола ангара (показаны чёрным)
  [*]Любые плитки корабля перекрывают другие пристыкованные корабли
  [/list]
  Красная граница вокруг стыкующегося корабля означает недопустимую позицию; проблемные плитки выделяются красной штриховкой.
  
  В допустимой позиции корабль выделяется зелёной границей и может быть размещён нажатием {key-place}.
  
  [img]moddata://base/art/codex/dock3.png[/img]
  
  После размещения позицию можно изменить кнопкой {key-interact} или [i]ПЕРЕМЕСТИТЬ[/i]. Удовлетворившись размещением, завершите стыковку кнопкой [i]ПОДТВЕРДИТЬ ПОЗИЦИЮ СТЫКОВКИ[/i].
  
  [img]moddata://base/art/codex/dock4-btns.png[/img]
  
  Если при подтверждении стыковки отображается и активен флажок [i]АВТОМАТИЧЕСКИ ПЕРЕЙТИ НА ПРИНИМАЮЩИЙ КОРАБЛЬ[/i], вы перейдёте под управление корабля, к которому происходит стыковка.
  
  [h2]Как отстыковаться[/h2]
  Для отстыковки корабля из существующего Ангара сначала осмотрите родительский Корабль (удерживайте {key-actionprimary}). Затем нажмите кнопку просмотра ангаров сбоку от инвентаря:
  [img]moddata://base/art/codex/undockbtn.png[/img]
  При нажатии кнопки просмотра интерфейс скроется и все Ангары на этом корабле будут выделены. {?scheme:Нажатие кнопки ангара|Выделение ангара и нажатие {key-interact};} откроет пол этого ангара и покажет все пристыкованные там корабли.
  [img]moddata://base/art/codex/browsehanagar.png[/img]
  Наведение на пристыкованный корабль и нажатие {key-interact} выберет его. Выбранный корабль можно проверить кнопкой [i]ОСМОТРЕТЬ[/i]; также можно дважды кликнуть {key-mouse0}.
  Инвентарь и компоненты можно только ПРОСМАТРИВАТЬ — изменять ничего нельзя во время стыковки.
  
  Выбранный корабль можно отстыковать кнопкой [i]ОТСТЫКОВАТЬ ВЫБРАННЫЙ[/i].
  
  [img]moddata://base/art/codex/undockbtns.png[/img]
  
  Если при подтверждении отстыковки отображается и активен флажок [i]АВТОМАТИЧЕСКИ ПЕРЕЙТИ НА ОТСТЫКОВАННЫЙ КОРАБЛЬ[/i], вы перейдёте под управление отстыкованного корабля.
  
  [h2]Ограничения и корабли внутри кораблей[/h2]
  Корабли с Ангарами, в которых есть пристыкованные суда, МОГУТ быть пристыкованы, однако существует стандартный лимит вложенных кораблей в 64 (задаётся sv_maxhangarchildren) и жёсткий лимит игры в 1024.
codex-components: "Компоненты"
codex-components-assemblers-title: "Сборщики"
codex-components-assemblers-body: |
  [h1]Сборщики[/h1]
  [img]moddata://base/art/codex/assemblers.png[/img]
  Компоненты-Сборщики используются для [url=codex://codex.assembly.basics]строительства и модернизации кораблей[/url].
  
  [h2]Характеристики[/h2]
  [h3]Лимит плиток[/h3]
  Каждый сборщик имеет определённый лимит плиток. Этот лимит определяет максимальное количество плиток корабля или объекта, которые можно успешно спустить со Сборщика.
  [h3]Лимит компонентов-оружия[/h3]
  Сборщики допускают только фиксированное максимальное количество установок для оружия для успешного запуска.
  [h3]Лимит прочих компонентов[/h3]
  Компонентные установки, отличные от Оружия, учитываются в этой категории. Должны быть ниже максимума для запуска.
  [h3]Радиус[/h3]
  К Сборщикам можно обращаться на расстоянии. [b]Радиус[/b] определяет, как далеко от Сборщика должен находиться Корабль для его использования.
  [h3]Доступные установки[/h3]
  Установки не требуют материалов для строительства, однако доступные типы установок определяются типом Сборщика. Как правило, лучшие сборщики дают доступ к установкам большего размера.
  
  [h2]♦ Низкое питание[/h2]
  При низком/нулевом уровне питания Сборщики не могут использоваться для Строительства.
  
  [h2]Сломанное состояние[/h2]
  В сломанном состоянии Сборщики не могут использоваться для Строительства.
codex-components-bridges-title: "Мостики"
codex-components-bridges-body: |
  [h1]Мостики[/h1]
  [img]moddata://base/art/codex/bridges.png[/img]
  Установки Мостика критически важны для управления кораблём. Установленные компоненты предоставляют [url=codex://codex.intermediate.enhancements]Улучшения[/url] всему Кораблю. Улучшения и их эффекты видны в подсказке:
  
  [img]moddata://base/art/codex/enh-bridge-tooltip.png[/img]
  
  [h2]Управление[/h2]
  Для управления Кораблём необходима хотя бы одна Установка Мостика — она может оставаться пустой и всё равно обеспечит управление. После уничтожения всех мостиков управление будет потеряно, а корабль будет считаться «мёртвым».
  
  [h2]Характеристики[/h2]
  [h3]Применяемые улучшения[/h3]
  Компонент Мостика при установке может предоставлять ряд [url=codex://codex.intermediate.enhancements]Улучшений[/url] — от усиления существующих компонентов до новых способностей, таких как Маскировка.
  
  [h2]♦ Низкое питание[/h2]
  При низком/нулевом уровне питания Мостики перестают предоставлять свои Улучшения.
  
  [h2]Сломанное состояние[/h2]
  В сломанном состоянии Мостики перестают предоставлять свои Улучшения.
codex-components-cargobays-title: "Грузовые отсеки"
codex-components-cargobays-body: |
  [h1]Грузовые отсеки[/h1]
  [img]moddata://base/art/codex/cargobays.png[/img]
  Компоненты Грузового отсека добавляют [url=codex://codex.basics.inventory]Ячейки инвентаря[/url] кораблю, позволяя ему перевозить больше предметов.
  
  [h2]Характеристики[/h2]
  [h3]Вместимость[/h3]
  Вместимость Грузового отсека — максимальное количество ячеек инвентаря в нём.
  [h3]Модификатор массы предметов[/h3]
  Большинство предметов имеют ⌂Массу, которая видна при наведении на ячейку и равна суммарной массе для этой ячейки.
  [img]moddata://base/art/codex/itemmass.png[/img]
  Предметы в Инвентаре добавляют свою Массу к общей массе Корабля. Модификатор массы предметов Грузового отсека уменьшает этот эффект для предметов в данном отсеке. Например, предмет с массой 10 в Грузовом отсеке с Модификатором массы -10% добавит к общей массе Корабля только 9.
  
  [h2]♦ Низкое питание[/h2]
  Низкое питание не влияет на Грузовые отсеки.
  
  [h2]Сломанное состояние[/h2]
  Сломанное состояние не влияет на Грузовые отсеки, однако по мере разрушения из них будут выпадать предметы в космос.
codex-components-engines-title: "Двигатели"
codex-components-engines-body: |
  [h1]Двигатели[/h1]
  [img]moddata://base/art/codex/engines.png[/img]
  Компоненты Двигателя обеспечивают движение Корабля, создавая тягу в направлении своей ориентации. Некоторые двигатели также включают [url=codex://codex.basics.systemview]╠Варп[/url] и влияют на скорость перемещения на ╠Варпе.
  
  [h2]Движение и направление[/h2]
  Влияние двигателя на движение зависит от направления поворота Установки (задаётся при Строительстве). Направления задаются относительно строительной сетки:
  [list]
  [*]Вверх: движение Вперёд({key-moveforward}) с тягой 100%. Назад({key-moveback}) с тягой 10%.
  [*]Вниз: движение Назад({key-moveback}) с тягой 100%. Вперёд({key-moveforward}) с тягой 10%.
  [*]Влево: движение Вправо({key-moveright}) с тягой 100%. Влево({key-moveleft}) с тягой 10%.
  [*]Вправо: движение Влево({key-moveleft}) с тягой 100%. Влево({key-moveright}) с тягой 10%.
  [/list]
  Двигатели, направленные влево и вправо, помимо движения по горизонтали, также активируются при вращении корабля. Это зависит от их положения относительно Центра масс корабля (ЦМ). Например, двигатель, направленный влево и находящийся выше ЦМ, будет вращать корабль по часовой стрелке (с тягой 100%).
  
  [h2]Характеристики[/h2]
  [h3]Тяга[/h3]
  Максимальная сила, создаваемая Двигателем. Учтите: с ростом массы корабля тяга должна увеличиваться, чтобы поддерживать ту же скорость. Также включает крутящий момент от двигателя.
  [h3]Ускорение[/h3]
  Время в секундах, за которое Двигатель достигает максимальной тяги. Быстрое ускорение удобно для манёвров, но может означать меньшую максимальную тягу.
  [h3]Варп-рейтинг[/h3]
  У многих двигателей есть [i]Варп-рейтинг[/i]. Хотя бы один двигатель должен иметь Варп-рейтинг выше 0, чтобы Корабль мог войти в Варп. Чем выше Варп-рейтинг Двигателя, тем сильнее его влияние на общий ╠[i]Варп-фактор[/i] корабля.
  [h3]Время раскрутки варпа[/h3]
  У многих двигателей есть время раскрутки варпа. Оно определяет, сколько времени требуется кораблю для входа в варп после активации капитаном. Время раскрутки корабля определяется средним временем раскрутки всех двигателей (исключая тягачи и прочие).
  [h3]Время остывания варпа[/h3]
  Время остывания двигателей после выхода из варпа. Определяется средним временем остывания всех двигателей (исключая тягачи и прочие).
  
  [h2]♦ Низкое питание[/h2]
  При низком/нулевом питании Двигатель продолжит работу, но лишь с 10% от максимальной тяги.
  
  [h2]Сломанное состояние[/h2]
  В сломанном состоянии тяга Двигателя снижается пропорционально количеству оставшихся плиток под Установкой; при менее чем 50% оставшихся плиток тяга составит 10%.
codex-components-labs-title: "Фабрикаторы"
codex-components-labs-body: |
  [h1]Фабрикаторы[/h1]
  [img]moddata://base/art/codex/labs.png[/img]
  Компоненты Фабрикатора позволяют [url=codex://codex.basics.manufacturing]Производить[/url] предметы из других предметов. Например, перерабатывать Руду в Листы, а затем в Компоненты.
  
  [h2]Характеристики[/h2]
  [h3]Множитель ввода[/h3]
  У Фабрикаторов может быть Множитель ввода — он изменяет количество предметов, необходимых для того же рецепта.
  [h3]Множитель вывода[/h3]
  У Фабрикаторов может быть Множитель вывода — он изменяет количество создаваемых предметов для того же рецепта.
  
  [h2]♦ Низкое питание[/h2]
  При низком/нулевом питании Фабрикатор приостановит производство текущих или новых рецептов до восстановления питания.
  
  [h2]Сломанное состояние[/h2]
  В сломанном состоянии Фабрикатор приостановит производство текущих или новых рецептов до починки плиток и выхода из сломанного состояния.
codex-components-hangars-title: "Ангары"
codex-components-hangars-body: |
  [h1]Ангары[/h1]
  [img]moddata://base/art/codex/hangars.png[/img]
  Компоненты Ангара позволяют [url=codex://codex.intermediate.docking]Стыковать[/url] другие Корабли внутри родительского корабля. Пристыкованные корабли добавляют свою массу к массе компонента Ангара.
  
  [h2]Характеристики[/h2]
  [h3]Планировка[/h3]
  У каждого Ангара есть Планировка — она показывает форму ангара и пространство для размещения кораблей, где каждый квадрат соответствует одной Плитке.
  
  [img]moddata://base/art/codex/floorplan.png[/img]
  [h3]Автоматическая стыковка[/h3]
  Некоторые Ангары имеют возможность Автоматической стыковки, позволяющей дистанционно стыковать неуправляемые корабли. Ангары без автостыковки допускают стыковку только при управлении кораблём в радиусе стыковки.
  [h3]Радиус стыковки[/h3]
  Ангары имеют определённый радиус, в котором корабль должен находиться для стыковки.
  
  [h2]♦ Низкое питание[/h2]
  При низком/нулевом питании Ангар не может принимать или отпускать корабли при стыковке.
  
  [h2]Сломанное состояние[/h2]
  В сломанном состоянии Ангар не может принимать новые операции стыковки. Корабли внутри Ангара при повреждении плиток сами получат урон в зависимости от расположения внутри Ангара. При достаточном уровне повреждений корабли могут быть принудительно отстыкованы.
codex-components-reactors-title: "Реакторы"
codex-components-reactors-body: |
  [h1]Реакторы[/h1]
  [img]moddata://base/art/codex/reactors.png[/img]
  Компоненты Реактора обеспечивают [url=codex://codex.intermediate.power]Мощностью[/url] все прочие компоненты.
  
  [h2]Характеристики[/h2]
  [h3]Паттерн мощности[/h3]
  Реакторы распределяют мощность по Плиткам и Установкам на них по определённому паттерну. Паттерн мощности показывает распределение мощности, где каждый квадрат соответствует одной плитке, а яркость квадрата — доле Максимальной мощности для этого квадрата. Белый квадрат — центр, место расположения самого реактора.
  
  [img]moddata://base/art/codex/powerpattern.png[/img]
  
  Поворот установки, в которой находится Реактор, определяет ориентацию паттерна мощности.
  [h3]Максимальная мощность[/h3]
  Реактор может обеспечивать максимальное значение мощности каждой плитке в зависимости от паттерна мощности.
  [h3]Урон от взрыва[/h3]
  При любом повреждении Реактора он взорвётся. Наносимый урон определяется значением урона от взрыва реактора. Как правило, чем выше мощность реактора, тем сильнее взрыв.
  
  [h2]♦ Низкое питание[/h2]
  Реакторы создают мощность, поэтому не могут находиться в состоянии низкого питания.
  
  [h2]Сломанное состояние[/h2]
  При уничтожении Плитки установки Реактора тот взорвётся.
  
  
codex-components-shields-title: "Щиты"
codex-components-shields-body: |
  [h1]Щиты[/h1]
  [img]moddata://base/art/codex/shields.png[/img]
  
  Компоненты Щита защищают корпус корабля от оружия — лазеров, торпед и т.п. — создавая временный защитный барьер. При наличии щитов их можно переключать {?scheme:через панель действий или с помощью {key-toggleshields}|с помощью {key-hotbaraction}+{key-toggleshields};}.
  
  [img]moddata://base/art/codex/shieldinaction.png[/img]
  
  Барьер щита поглощает урон извне, расходуя внутренние запасы энергии. Запасы восполняются со временем, однако при получении достаточного урона щит рухнет. Когда щит рухнет, защитный барьер отключится. Рухнувший щит оставляет корабль уязвимым на время восстановления. Обратите внимание: только что установленным щитам требуется время для зарядки до максимума.
  
  Щиты могут перекрываться или накапливаться.
  
  Существует два типа щитов: [b]Энергетический щит[/b] и [b]Защита от снарядов[/b].
  
  [h3]Энергетический щит[/h3]
  Категория Энергетических щитов блокирует все виды энергетического оружия — от лазеров до плазменных снарядов. Как правило, у них есть максимальное значение поглощаемого урона; при достижении порога щит рухнет и потребует время для перезарядки.
  
  ПРЕДУПРЕЖДЕНИЕ: Энергетические щиты НЕ защищают от оружия, выпущенного изнутри них, или от оружия со способностью пробивать щиты.
  
  [h3]Защита от снарядов[/h3]
  Категория Защиты от снарядов перехватывает входящие снаряды. После уничтожения снаряда щиту требуется время перезарядки для следующего перехвата. К таким снарядам относятся физические ракеты — торпеды, а также энергетические снаряды Плазменных пушек.
  
  [h2]Характеристики[/h2]
  [h3]Радиус[/h3]
  Радиус — зона покрытия щита, измеряемая в плитках от края установки. Пример: Радиус 3 на однотайловом щите покроет область 7 x 7 плиток, центрированную на установке.
  [img]moddata://base/art/codex/shieldradius.png[/img]
  [h3]Максимальная прочность[/h3]
  У каждого щита есть максимальная прочность; достигнув её, щит перестаёт восстанавливаться.
  [h3]Скорость восстановления[/h3]
  Активные щиты непрерывно восстанавливают прочность до максимума. Чем выше скорость восстановления, тем быстрее это происходит.
  [h3]Время перезарядки[/h3]
  После того как щит рухнул, его нельзя снова включить в течение определённого времени — это называется Временем перезарядки.
  
  [h2]♦ Низкое питание[/h2]
  При низком/нулевом питании Щиты отключаются и не могут использоваться до восстановления питания.
  
  [h2]Сломанное состояние[/h2]
  В сломанном состоянии установки Щиты отключаются и не могут использоваться до восстановления плиток.
  
codex-components-weapons-title: "Оружие"
codex-components-weapons-body: |
  [h1]Оружие[/h1]
  [img]moddata://base/art/codex/weapons.png[/img]
  Компоненты Оружия могут выполнять различные функции, однако в основном используются для [url=codex://codex.basics.mining]Добычи[/url] и [url=codex://codex.basics.combat]Боя[/url].
  
  [h2]Специальные типы[/h2]
  Большинство видов оружия наносят урон — лучом или очередью снарядов. Характеристики могут сильно различаться, но есть и специализированные типы. Вот некоторые из них:
  
  [h3]Пусковые установки снарядов[/h3]
  Пусковые установки снарядов запускают снаряды из вашего инвентаря в направлении цели.
  [img]moddata://base/art/codex/fireprojectile.png[/img]
  При выстреле каждая пусковая установка использует первый предмет боеприпасов в инвентаре корабля и направляет его к курсору; если боеприпасов нет, установка не стреляет.
  
  Боеприпасы бывают разных типов и выполняют различные функции:
  [list]
  [*]Торпеда — летит прямо и наносит урон при попадании
  [*]Мина — остаётся на месте после запуска, но взрывается при приближении другого корабля
  [*]Самонаводящаяся ракета — нацеливается на ближайшие сигнатуры и взрывается при попадании
  [*]Массовый якорь — летит прямо, при попадании прикрепляется к кораблю, увеличивая его массу и затрудняя управление
  [/list]
  [h3]Буксировочные лучи[/h3]
  Буксировочные лучи позволяют прикрепиться к другому кораблю и тянуть его за собой — можно даже брать его в варп и в другие регионы. [url=codex://codex.intermediate.tractoring]Подробнее о буксировочных лучах[/url]
  
  [h2]Характеристики (общие)[/h2]
  Из-за разнообразия оружия не все характеристики применимы ко всем видам. Ниже описаны наиболее распространённые.
  
  [h3]Угол обстрела[/h3]
  Угол (в градусах), в котором оружие может стрелять, центрированный на установке. При попытке стрелять за пределами этого угла оружие перейдёт в режим перезарядки.
  [img]moddata://base/art/codex/anglearc_comp.png[/img]
  [h3]Дальность[/h3]
  Максимальное расстояние от установки, на которое достигает оружие.
  [img]moddata://base/art/codex/range1.png[/img]
  [h3]Перезарядка[/h3]
  Время (в секундах) восстановления перед следующим выстрелом. Оружие на перезарядке отображается над панелью действий.
  [img]moddata://base/art/codex/cooldowns.png[/img]
  [h3]Время зарядки[/h3]
  Время, необходимое оружию для зарядки перед выстрелом.
  [img]moddata://base/art/codex/chargeup.png[/img]
  [h3]Скорость[/h3]
  Скорость, с которой оружие достигает своей максимальной дальности. Оружие с бесконечной скоростью достигает дальности мгновенно.
  [h3]Длительность[/h3]
  Время активности оружия до перехода в режим перезарядки. Если длительность не указана, эффекты попадания применяются за один тик (см. Эффекты попадания).
  [h3]Игнорирует щиты[/h3]
  Оружие игнорирует щиты и проходит сквозь них.
  
  [h3]Эффекты попадания[/h3]
  Значения эффектов попадания указаны как скорость «/т» — «за тик». Тик происходит каждые 1/5 секунды, пока оружие активно и не на перезарядке. [list]
  [*]Урон [Добыча]: Наносит урон плиткам типа Добыча, таким как Камень и Руды
  [*]Урон [Бой]: Наносит урон плиткам типа Бой, таким как Корпус
  [*]Ремонт [Бой]: Восстанавливает плитки типа Бой, такие как Корпус
  [*]Урон [Щиты]: Наносит урон Щитам
  [*]Дренаж мощности: Истощает мощность из Плиток вокруг точки попадания
  [*]Сила притяжения: Притягивает поражённый объект к оружию
  [*]Сила отталкивания: Отталкивает поражённый объект от оружия
  [/list]
  [h3]Добыча[/h3]
  Добыча описывает вероятность и множители количества выпадения предметов из Плиток, поражённых этим оружием, по типу Плитки.
  [img]moddata://base/art/codex/loottooltip.png[/img]
  
  [b]% Процент[/b] — модификатор вероятности; например, 100% означает, что плитка всегда выронит предметы при наличии шанса. 20% означает, что только в 20% случаев уничтоженная плитка выронит свои предметы; проценты свыше 100% увеличивают шанс выпадения более редких предметов.
  
  [b]x Множитель[/b] — модификатор количества выпадающих предметов из Плитки. Например, если Плитка обычно выбрасывает 1 Руду, при множителе добычи x2 она выбросит 2 Руды.
  
  [h3]Количество отражений[/h3]
  Количество рикошетов отражающего оружия перед остановкой.
  
  [h3]Случайный/упорядоченный залп[/h3]
  Оружие стреляет несколькими выстрелами в залпе, а не одним лучом/выстрелом.
  [img]moddata://base/art/codex/salvo1.png[/img]
  Дополнительные параметры:[list]
  [*][b]Количество[/b]: Число залпов, например 2 означает 2 пули
  [*][b]Разброс[/b]: Угол в градусах.
    -[i]Случайный[/i]: каждый выстрел под случайным углом до этого значения, центрированным относительно «желаемого» направления
    -[i]Упорядоченный[/i]: выстрелы равномерно распределены в пределах этого угла вокруг «желаемого»
  [*][b]Время между выстрелами[/b]: Время между выстрелами в залпе. 0 означает одновременный залп.
  [/list]
  [h3]Запускает снаряд[/h3]
  Запускает снаряд без расхода боеприпасов. Характеристики запускаемых снарядов перечислены ниже.
  
  [h2]♦ Низкое питание[/h2]
  При низком/нулевом питании Оружие отключается и не может использоваться до восстановления питания.
  
  [h2]Сломанное состояние[/h2]
  В сломанном состоянии установки Оружие отключается и не может использоваться до восстановления плиток.
  
  
codex-assembly: "Строительство"
codex-assembly-enter-title: "Начало строительства"
codex-assembly-enter-body: |
  [h1]Вход в режим строительства[/h1]
  Для входа в режим строительства Корабль должен находиться в радиусе $assembl$[url=codex://codex.components.assemblers]Сборщика[/url]. Радиус действия $assembl$Сборщика виден через [url=codex://codex.basics.paperdoll]Наложение Бумажной куклы[/url].
  [img]moddata://base/art/codex/assemblrange.png[/img]
  
  Находясь в радиусе $assembl$Сборщика и управляя Кораблём, в нижней центральной части экрана появится кнопка [i]НАЧАТЬ СТРОИТЕЛЬСТВО[/i]. Если это корабль не под вашим управлением, кнопка появится в панели Осмотра.
  
  [img]moddata://base/art/codex/buildbutton.png[/img]
  
  [h2]Выбор Сборщика[/h2]
  {?scheme:Нажатие кнопки [i]НАЧАТЬ СТРОИТЕЛЬСТВО[/i]|Нажатие {key-centeralt}+{key-enterbuild};} скроет интерфейс и выделит все Сборщики в радиусе.
  
  [img]moddata://base/art/codex/picker.png[/img]
  
  Выбор зелёного Сборщика{?scheme: | и нажатие {key-interact};} начнёт редактирование Корабля. Если Сборщик не зелёный, он недоступен для строительства — будет указана причина.
  
  [h2]Быстрый ремонт[/h2]
  Большинство сборщиков предлагают быстрый ремонт — восстановление всех повреждённых, но ещё существующих плиток.
  
  [h2]Платное строительство[/h2]
  Большинство коммерческих космопортов или верфей позволяют использовать свои $assembl$Сборщики за плату. Плата вносится один раз за визит и действует всё время пребывания капитана в регионе, позволяя несколько визитов при точной настройке корабля.

codex-assembly-basics-body: 
codex-assembly-basics-title: "Основные концепции и лимиты плиток/компонентов"
codex-assembly-basics-body: |
  [h1]Основы строительства[/h1]
  Строительство позволяет создавать новые корабли, улучшать существующие или просто придать им новый облик.
  
  [h2]Основы[/h2]
  Корабль состоит из 3 частей:
  [list]
  [*][b]Плитки[/b]: строительные блоки, составляющие основную часть конструкции корабля. Плитки необходимы для размещения Установок — без Плитки нет Установки. [url=codex://codex.basics.tiles]Подробнее о плитках[/url]
  [*][b]Установки[/b]: слоты для размещения компонентов. Установка должна размещаться поверх плиток; у неё нет собственной прочности или структуры. [url=codex://codex.basics.mounts]Подробнее об установках[/url]
  [*][b]Компоненты[/b]: обеспечивают функциональность корабля. Компоненты размещаются в Установках; если Установка уничтожена, Компонент выпадет в космос. Компоненты также можно менять вне строительства без Сборщика. [url=codex://codex.basics.components]Подробнее о компонентах[/url]
  [/list]
  Интерфейс строительства разделён на несколько основных разделов:
  [list]
  1. [3ce238]Информация о корабле[-]: Показывает текущие характеристики; нажав на синий баннер, можно изменить название корабля.
  2. [fffc00]Основные функции[-]: Выбор между Редактированием плиток или Редактированием компонентов, ремонт повреждённых плиток, очистка всего, очистка несвязанных, работа с шаблонами и Запуск готового корабля.
  3. [c000ff]Строительная сетка[-]: Отображает корабль, его плитки, установки и компоненты; здесь можно добавлять/удалять/редактировать плитки, установки и компоненты.
  4. [00aeff]Источник[-]: Управляет тем, откуда берутся плитки и компоненты. Варианты: «Мой Инвентарь» (корабль под управлением игрока), Инвентарь Сборщика (инвентарь корабля Сборщика), Инвентарь Цели (при редактировании другого корабля) и Локальный космос (рядом плавающие предметы).
  5. [ffa200]Выбор режима[-]: Определяет режим добавления/удаления плиток, установок, компонентов или покраски плиток.
  6. [ff7b7b]Доступные предметы[-]: В зависимости от выбранного режима, здесь отображаются доступные плитки, краски, установки или компоненты.
   [/list]
  [img]moddata://base/art/codex/buildui.png[/img]
  
  [h2]Редактирование корабля[/h2]
  Основной процесс редактирования:
  [list]
  1. Выберите Источник.
  2. Выберите Режим (редактирование плиток/компонентов и т.д.)
  3. Выберите предмет для размещения из списка выбора. ПРИМЕЧАНИЕ: предметы должны быть доступны перед входом в Строительство.
  4. Разместите его на строительной сетке, наведя курсор на квадрат и нажав или перетащив {key-place}.
  5. Нажатие или перетаскивание {key-remove} по сетке удаляет Плитки/Установки с сетки в зависимости от текущего режима и вкладки.
  [/list]
  Подробнее — в разделах [url=codex://codex.assembly.edittiles]Редактирование плиток[/url] и [url=codex://codex.assembly.editmounts]Редактирование установок и компонентов[/url].
  
  Вид сетки можно масштабировать {key-scroll} и перемещать {key-navigateh}{key-navigatev}.
  
  [h2]Лимиты плиток и компонентных установок[/h2]
  [img]moddata://base/art/codex/buildlimits.png[/img]
  Каждый Сборщик имеет ограничение по количеству плиток, оружия и неоружейных компонентных установок. Установки без компонентов всё равно учитываются в лимите.
  
  [h2]Продвинутые советы по размещению[/h2]
  [list]
  [*]Можно размещать несколько Плиток / Установок / Красок перетаскиванием{?scheme:\n[*]Удержание {key-leftshift} при размещении и перетаскивании сохраняет прямую линию| ;}
  [*]Удержание {key-picker} и нажатие {key-interact} над Плиткой/Установкой позволяет «подобрать» этот предмет в зависимости от текущего режима. В режиме Покраски будет выбран цвет краски под курсором — при наличии этой краски у вас.
  [*]Для симметричных конструкций можно включить режим зеркального отражения кнопкой или {key-mirror}. Режим циклически переключается между: без зеркала, горизонтальное, вертикальное и оба направления.
  [/list]
  [h2]Увеличение размера[/h2]
  Не помещается новый грандиозный проект на Сетке? Для увеличения сетки используйте выпадающий список слева для выбора одного из следующих размеров:
  [list]
  [*]Микро 7x7
  [*]Малый 15x15
  [*]Средний 31x31
  [*]Большой 63x63
  [*]Гигантский 127x127
  [/list]
  ПРИМЕЧАНИЕ: Если дополнительное пространство не нужно, настоятельно рекомендуется использовать меньший размер сетки для улучшения производительности.
  
  Для продвинутых советов по Строительству см. [url=codex://codex.assembly.advanced]Продвинутое строительство[/url].
  
  [h2]Запуск[/h2]
  Когда строительство завершено, можно выйти из режима строительства и запустить корабль кнопкой «ЗАПУСК».
  
codex-assembly-edittiles-title: "Редактирование плиток"
codex-assembly-edittiles-body: |
  [h1]Редактирование плиток[/h1]
  Нажмите [i]РЕДАКТИРОВАТЬ ПЛИТКИ[/i] на левой панели действий. Это переключит панель выбора справа в режим Плиток. Режим плиток разделён на РАЗМЕСТИТЬ и ПОКРАСИТЬ.
  [h2]Размещение плиток[/h2]
  При установке вкладки выбора на [i]РАЗМЕСТИТЬ[/i] отобразятся все Плитки, доступные для используемого Сборщика (только инвентарь корабля Сборщика).
  
  Чтобы разместить Плитку, выберите её из списка с помощью {key-interace}, затем поместите на сетку нажатием {key-place}. Правила размещения:
  [list]
  [*]Плитки ДОЛЖНЫ размещаться рядом с существующей плиткой (кроме начала нового корабля). Стороны должны соприкасаться — диагональные соседи не считаются.
  [*]Новая Плитка не должна превышать лимит плиток.
  [*]Плитки нельзя размещать там, где находится другой корабль или объект.
  [/list]
  Плитки можно заменять другим типом. Выбрав новую Плитку курсором, нажмите {key-place} над существующей плиткой. ПРИМЕЧАНИЕ: Если новый тип плитки можно покрасить, существующий цвет краски сохранится — это может быть не очевидно.
  
  Чтобы удалить существующую Плитку, наведите курсор на неё и нажмите {key-remove}. Плитка вернётся в инвентарь Сборщика. Если предмет не помещается в инвентарь Сборщика, он будет выброшен в космос рядом со Сборщиком.
  
  Удаление Плиток может создать [b]Разрозненные части[/b] — они выделены красным. Если запустить корабль с Разрозненными частями, выделенные Плитки вернутся в Сборщик вместе с Установками/Компонентами на них.
  
  [h2]Покраска плиток[/h2]
  При установке вкладки выбора на ПОКРАСИТЬ отобразятся все доступные цвета краски для Плиток. Используйте краски для уникального оформления кораблей без изменения свойств плиток.
  
  Для покраски выберите цвет из списка с помощью {key-interact}, затем наведите курсор на нужную Плитку на сетке и нажмите {key-place}.
  
  Чтобы удалить краску и вернуть Плитке естественный цвет, наведите курсор на Плитку и нажмите {key-remove}.
  
  ПРИМЕЧАНИЕ: Не все Плитки можно покрасить. Красить можно только Корпуса и другие рукотворные Плитки.
  
  [h2]Размер[/h2]
  Количество размещаемых или окрашиваемых плиток можно изменять клавишами {key-brushsizedown} и {key-brushsizeup}.
  
codex-assembly-editmounts-title: "Редактирование установок и компонентов"
codex-assembly-editmounts-body: |
  [h1]Редактирование установок и компонентов[/h1]
  Нажмите [i]РЕДАКТИРОВАТЬ КОМПОНЕНТЫ[/i] на левой панели действий — панель выбора справа переключится в режим Компонентов. Режим компонентов разделён на УСТАНОВКА и КОМПОНЕНТ.
  
  [h2]Размещение установок[/h2]
  При вкладке УСТАНОВКА отображаются все [url=codex://codex.basics.mounts]Установки[/url], доступные для размещения текущим Сборщиком. Обратите внимание: Установки НЕ являются предметами и ограничены только типом текущего Сборщика, а не Инвентарём.
  
  Чтобы разместить Установку, выберите её из разнообразных типов и размеров с помощью {key-interact}, затем разместите на сетке нажатием {key-place}. Установку можно разместить ТОЛЬКО если:
  [list]
  [*]Все квадраты сетки под ней заняты Плитками
  [*]Ни одна часть установки не выходит за край сетки
  [/list]
  Чтобы удалить Установку, наведите курсор на неё и нажмите {key-remove}. При удалении компонент из установки вернётся в инвентарь Сборщика или, если не помещается, выпадет в космос.
  
  Некоторые типы установок можно поворачивать — они отображают стрелку направления:
  [list]
  [*]$weap$Оружие: с шагом 15°, определяет направление оружия
  [*]$engine$Двигатели: с шагом 90°, определяет направление тяги
  [*]$reactor$Реакторы: с шагом 90°, определяет ориентацию паттерна мощности
  [/list]
  Чтобы повернуть установку, наведите курсор и нажмите {key-rotatecw} для поворота по часовой, {key-rotateccw} — против часовой.{?scheme: Нажатие {key-uparrow} {key-downarrow} {key-leftarrow} {key-rightarrow} при наведении повернёт установку в соответствующую сторону.| ;}
  
  [h2]Размещение компонентов[/h2]
  При вкладке КОМПОНЕНТ отображаются все компоненты в инвентаре Сборщика. [url=codex://codex.basics.components]Компоненты[/url] можно устанавливать и вне строительства, но также и внутри него.
  
  [img]moddata://base/art/codex/comppicker.png[/img]
  
  Чтобы разместить компонент, выберите тип из верхнего списка — отобразятся все компоненты этого типа в инвентаре Сборщика. Выберите нужный компонент с помощью {key-interact}, затем наведите на подходящую установку и нажмите {key-place}.
  
  Для установки компонента он должен:
  [list]
  [*]Быть правильного типа (Мостик, Оружие и т.д.)
  [*]Соответствовать установке (см. «Подходит для установки» в подсказке)
  [/list]
  Чтобы удалить компонент, наведите на него курсор и нажмите {key-remove} — он вернётся в инвентарь Сборщика или, если не помещается, выпадет в космос.

codex-assembly-templates-title: "Сохранение/загрузка шаблонов"
codex-assembly-templates-body: |
  [h1]Шаблоны строительства[/h1]
  Если вы потратили много времени на проектирование корабля или хотите поделиться им с другими капитанами, сохраните корабль как Шаблон.
  
  [h2]Сохранение[/h2]
  В режиме строительства текущий корабль можно сохранить как шаблон кнопкой [i]СОХРАНИТЬ ШАБЛОН[/i] на главной панели Строительства. Можно задать название Шаблона, а позже загрузить его или поделиться с другом или в Steam Workshop.
  
  [h2]Автосохранения[/h2]
  Во время строительства редактируемый корабль сохраняется как шаблон: при входе, при выходе и каждые 2 минуты (максимум 3 автосохранения). Автосохранённые шаблоны загружаются как обычные.
  
  [h2]Загрузка[/h2]
  Для загрузки шаблона нажмите кнопку [i]ЗАГРУЗИТЬ ШАБЛОН[/i] в режиме строительства.
  
  [img]moddata://base/art/codex/loadtemplate.png[/img]
  
  В окне Загрузки шаблона можно просмотреть все ранее сохранённые шаблоны или подписанные в Steam Workshop. Выберите шаблон в списке и нажмите кнопку [i]ЗАГРУЗИТЬ[/i].
  
  Загрузка шаблона очистит текущий корабль и вернёт все его плитки и компоненты в инвентарь Сборщика; учтите, что эти предметы учитываются в требуемых предметах.
  
  При загрузке шаблон постарается подобрать плитки, установки и компоненты; при невозможности будет использована базовая плитка, а установки останутся пустыми.
   
  [h2]Публикация[/h2]
  [h3]Текстовая строка[/h3]
  Шаблонами можно быстро делиться кнопками [i]ИМПОРТ[/i] и [i]ЭКСПОРТ[/i] в окне Загрузки шаблона.
  [list]
  [*]ЭКСПОРТ: Выберите сохранённый шаблон в списке и нажмите кнопку ЭКСПОРТ. Отобразится длинная строка текста для копирования и публикации.
  [*]ИМПОРТ: Нажмите кнопку ИМПОРТ и вставьте строку текста в поле ввода. Нажав [i]ИМПОРТ[/i], этот Шаблон появится в списке для загрузки.
  [/list]
  [h3]Steam Workshop[/h3]
  На шаблоны можно подписаться в Steam Workshop — они отобразятся в верхней части списка Загрузки шаблона. Для добавления собственного шаблона в Steam Workshop следуйте руководству: [url=https://steamcommunity.com/sharedfiles/filedetails/?id=1461693416]https://steamcommunity.com/sharedfiles/filedetails/?id=1461693416[/url]

codex-assembly-advanced-title: "Продвинутое строительство"
codex-assembly-advanced-body: |
  [h1]Продвинутое строительство[/h1]
  Строительство также предлагает ряд продвинутых возможностей: выделение плиток/установок, копирование, вырезание и поворот вставляемых элементов.
  
  [h2]Выделение[/h2]
  С помощью {key-select} можно кликнуть и перетащить для выбора как плиток, так и установок. Выбранные плитки/установки можно затем изменять.
  
  [img]moddata://base/art/codex/buildselect.png[/img]
  
  [h2]Копирование[/h2]
  Выделенные элементы можно скопировать с помощью {key-copy}. При этом создастся голограмма выбранных элементов, оставив оригиналы на месте. Голограмму можно перемещать{?scheme: |{key-navigateh}{key-navigatev};}, поворачивать {key-rotatecw}/{key-rotateccw} и зеркально отражать {key-mirror}, затем разместить в нужном месте нажатием {key-place}.
  
  [img]moddata://base/art/codex/buildcopy.png[/img]
  
  [h2]Вырезание[/h2]
  Выделенные элементы можно вырезать с помощью {key-cut}. При этом оригинальные элементы удалятся и создастся их голограмма. Голограмму можно перемещать{?scheme: |{key-navigateh}{key-navigatev};}, поворачивать {key-rotatecw}/{key-rotateccw} и зеркально отражать {key-mirror}, затем разместить в нужном месте нажатием {key-place}.

  [h2]Удаление[/h2]
  Нажатие {key-delete} удалит все элементы в выделенной области.
  
codex-intermediate-sysproblems-title: "Проблемы звёздной системы"
codex-intermediate-sysproblems-body: |
  [h1]Проблемы звёздной системы[/h1]
  Проблемы — события, происходящие в Звёздной системе. Они состоят из нескольких шагов, каждый из которых имеет конкретную цель. Цели обычно включают уничтожение опасных пришельцев, восстановление потерянных данных зонда или доставку спасшихся членов экипажа.
  
  По завершении каждого шага выдаются награды и начинается следующий шаг. Обязательно читайте описание для получения информации о каждом шаге.
  
  [img]moddata://base/art/codex/sysproblem.png[/img]
  
  В многопользовательском режиме несколько игроков могут совместно решать текущий шаг.

