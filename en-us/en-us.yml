#Tutorial hint texts that popup once certain actions occur. Usually when clicked links to codex pages
tut-inventoryopen-tip: "Items can be moved around your vessel inventory with {key-interact} and thats just the start..."
tut-manufactureopen-tip: "Using Manufacturing you can convert Ores into Sheets and then Components. {key-interact} to select a recipe and craft it"
tut-firstwarpout-tip: "Welcome to warp. Press {key-systemclickmove} or use {key-moveforward} {key-rotatecounterclockwise} {key-moveback} {key-rotateclockwise} to explore the universe"
tut-warphint-tip: "This region isn't everything. Press the [b]WARP[/b] button or {key-warp} to explore the universe"
tut-pickupresource-tip: "Ores can be [b]Manufactured[/b] with [b]Fabricators[/b] into Sheets, then into items and Components"
tut-firstcomponent-inventory-tip: "You got a Component! Components "do stuff" for a vessel. Components can be placed into the mounts on your vessel with {key-interact}."
tut-firstcomponent-interact-tip: "You swapped a Component! Components can be placed into the slots on your vessel with {key-interact}. Learn about Components"
tut-firstscan-tip: "Scanning reveals ores and other resources nearby"
tut-enterbuild-tip: "You are in range of an Assembler. Press [b]START BUILDING[/b] and select the Assembler to begin Construction"
tut-firstbuild-tip: "Welcome to Constuction here you can upgrade and change your vessel. Click to learn how to get started with Construction"
tut-itempickup-tip: "Items floating near you can be picked up with {key-pickupitems}"
tut-enteredeva-tip: "While in EVA you can do many things, enter other vessels with {key-enterexitvessel}, repair tiles and more!"
tut-hoverasteroid-tip: Shoot asteroids to get resources which can be used for all sorts of things
tut-encounterhostile-tip: You have been targetted!! Fire at enemies with {key-actionsecondary}. Scan for their vital components near the cursor with {key-actionprimary} 
tut-firstregiondiscovery-tip: "You have discovered a new region. Flying near regions will discover more about them"
tut-missions-tip: "It appears people seek help in this system and have posted Missions on the missions board {key-togglemissions}"
tut-trading-tip: "{key-interact} on an item in the Traders inventory(left) to buy or your inventory(right) to sell"
#tut-transitcreation-tip: "Jumpgates are a quick way travel large distances. Place it by {key-actionsecondary} while at warp. Click to learn more & how to link them"
tut-sysconflict-tip: "You have just entered a system in Conflict. Complete [b]battles[/b] or help those in [b]distress[/b] to shift the balance. Click to learn more"
tut-beacons-tip: "Beacons can be used to mark important locations. Place it by {key-actionsecondary} with it held over space"
tut-comp-assemblers-tip: "Assemblers are used to update or construct new vessels. Learn about Assemblers"
tut-comp-bridges-tip: "Bridges can enhance other components or add new abilities. Learn about Bridges"
tut-comp-cargobays-tip: "Cargo bays are used to store items. Learn about Cargo bays"
tut-comp-engines-tip: "Engines make a ship move and allow it to warp. Learn about Engines"
tut-comp-hangars-tip: "Hangars can be used to stow other vessels inside and bring them along for the ride. Learn about Hangars"
tut-comp-labs-tip: "Fabricators allow manufacturing of resources into useful items. Learn about Fabricators"
tut-comp-reactors-tip: "Reactors provide power to all other components. Learn about Reactors"
tut-comp-shields-tip: "Shields protect an area against most weaponry. Learn about Shields"
tut-comp-weapons-tip: "Weapons can blast away your foes or dig up valuable resources. Learn about Weapons"
tut-building-mounts-tip: "Learn all about editing mounts"
tut-building-comps-tip: "Learn all about editing components"
tut-building-tiles-tip: "Time to expand! Place tiles with {key-actionprimary}. Remove tiles with {key-actionsecondary}."
tut-building-paints-tip: "Spruce things up! Paint your vessel with {key-actionprimary}. Remove paint with {key-actionsecondary}."
tut-building-templates-tip: "Save/Load your own vessel designs or perhaps share and load those of other players"
tut-enhancements-tip: "Your vessel now has an Enhancement. Enhancements can boost other components or give all new abilities"
tut-weapongroups-tip: "Weapons becoming unwieldly, dont want to fire everything at once? Learn about weapon groups"
tut-hailing-tip: "Someone wants to talk to you. View incoming hails with {key-viewhail} or even hail others with {key-hail}"
tut-docking-tip: "You have entered range of a Hangar. Learn how to dock vessels into other vessels"
tut-transittravel-tip: "This is a Jumpgate or Wormhole Region. Fly towards the portal shown on the scanner and enter it to travel vast distances"
tut-sysproblems-tip: "Some star systems have a [b]Problem[/b] that needs to be solved with your help. Learn about Problems"
tut-tractors: Tractors
tut-tractors-tip: Use a tractor beam to move vessels or even asteroids. Learn more.
tut-accessopen: Access
tut-accessopen-tip: Manage who can open inventory, modify components and more with Access. Learn about Access.
tut-factions: Factions
tut-factions-tip: Help, or hinder, the different groups throughout the universe. Learn about Factions.
tut-teams: Teams
tut-teams-tip: Work together with other players on a team. Learn about Teams.

