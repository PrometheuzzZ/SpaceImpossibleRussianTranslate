version-gamename: "SPACE IMPOSSIBLE"

menu-ea-text: >
 Welcome Captain\n
 Space Impossible has left beta, and is currently in [b][38FAA6]Early Access[-][/b], with an intended full release in the near future. This means that most of the game is present, however, some content, balancing and other elements are still being added, changed or removed. You may encounter bugs or crashes, and although we make every effort to prevent it, game progress may be lost. If you do encounter a bug, we would be extremely grateful if you report it to us on the Steam forums or Discord.
 \n\n
 We hope you as an early adopter and early access player know and accept these risks, but also know how much you and your feedback has helped, and continue to help, shape and improve the game.
 \n\n
 Enjoy your journey Captain!

