############################
#FACTION TEXT
############################
fac-desc-lawless: "An area of space where no man or creature holds enough control to introduce law or organization."

fac-desc-kalgiri: "A race of fierce warriors poets, the Kal'Giri are openly hostile, but can be impressed through feats of strength which they will record in their sagas."
fac-desc-ticeroy: "Ostensibly peacekeepers, the Ticeroy Navy patrol much of civilized space. Led by the Lord High Ticeroy, an elected, for-life position."
fac-desc-sixiser: "A well organized (relatively speaking) pirate group, the Sixiser Pirates are major scourge to trade wherever they operate."
fac-desc-drum: "A mysterious, isolationistic group, the Druminence hail from a cluster of worlds off limits to outsiders. They prefer to shoot all too quickly. However with considerable efforts their marginal trust can be earned."
fac-desc-gatecreators: "An unknown ancient race who created the jumpgate network"
fac-desc-indtrader: "An association of independant traders. Un-aligned with anyone all they seek is profit."
fac-desc-eu: "A collection of scientists, explorers and traders, the Explorer Union seeks to expand their knowledge and trade contacts."
fac-desc-madd: "Small but efficient, Madd's Marauders is a group of merceneries widely popular for their unconventional tactics and lack of official accountability. Their leader and founder, Captain Madd, leads with a hands-on type of approach."
fac-desc-dim: "An otherworldly bio-mechanical race. Due to rare encounters little is known about these extra-dimensional beings"
fac-desc-scrapper: "The galaxy's scrap collectors and general salvage salemen."
fac-desc-ticeroymutineers: "A band of mutineers, rejecting their oaths to serve in the Ticeroy Navy."
fac-desc-forgottenrelics: "Mysterious and ancient relics from a long lost civilization."
fac-desc-musiciancollective: "Some of the galaxy's top musicians belong to a long standing musicians collective for shared interests."
fac-desc-arkwright: "One of the universe's richest traders; Arkwright travels around in a heavily customized ship, always ready to make a sale."
fac-desc-seti: "An intelligent insectoid race, the Seti Rimanoo fleets are known to roam the galaxy, disrupting the more civilized wherever they arrive."
fac-desc-brotherhood: "A quiet, secluded, apolitical collective of monks, The Brotherhood of Seekers look throughout the galaxy for The Truth, in whatever form that may manifest. Not shy of scientific methods, they utilize a number of approaches in their search."
